<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="{{description}}">
<title>{{title}} · {{city}} · Layers.City</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
{{themeScript}}
<style>
@font-face{font-family:'Archivo';font-weight:700;font-display:swap;src:url(/fonts/archivo-latin-700-normal.woff2) format('woff2')}
@font-face{font-family:'Archivo';font-weight:800;font-display:swap;src:url(/fonts/archivo-latin-800-normal.woff2) format('woff2')}
@font-face{font-family:'IBM Plex Sans';font-weight:400;font-display:swap;src:url(/fonts/ibm-plex-sans-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:'IBM Plex Sans';font-weight:500;font-display:swap;src:url(/fonts/ibm-plex-sans-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'IBM Plex Mono';font-weight:500;font-display:swap;src:url(/fonts/ibm-plex-mono-latin-500-normal.woff2) format('woff2')}
:root{
  --bg:#F7F4F3; --card:#FFFFFF; --ink:#1A1414; --muted:#5E5452; --rule:#E4DCDA; --accent:#C8102E;
  --display:'Archivo',system-ui,sans-serif; --body:'IBM Plex Sans',system-ui,sans-serif;
  --pill-line:#D8CFCD; --sub:#5C5251;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45}
a{color:var(--accent)}
.wrap{max-width:1120px;margin:0 auto;padding:0 24px 40px}
h1{margin:4px 0 8px;font-family:var(--display);font-weight:800;font-size:44px;line-height:1.02;letter-spacing:-.02em}
h2{margin:0;font-family:var(--display);font-weight:800;font-size:26px;line-height:1.1;letter-spacing:-.01em}
.kicker{font-size:12px;font-weight:500;letter-spacing:.12em;color:var(--accent);text-transform:uppercase}
.kicker a{text-decoration:none}
.lede{max-width:640px;color:var(--muted);margin:0 0 18px}
.rule{height:3px;width:64px;background:var(--accent);margin:14px 0}
.nav{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 8px}
.chip{display:inline-flex;align-items:center;border:1px solid var(--rule);background:var(--card);border-radius:999px;padding:6px 12px;min-height:36px;font-size:13.5px;color:var(--ink);text-decoration:none}
.chip:hover{border-color:var(--ink)}
.chip:focus-visible,.share:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.maps{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;margin-top:22px}
.fm{background:var(--card);border:1px solid var(--rule);border-radius:14px;padding:18px 18px 14px;display:flex;flex-direction:column;gap:10px;scroll-margin-top:16px;min-width:0}
.fm .head{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.fm .line{margin:0;font-size:15px;line-height:1.45}
.fm svg{display:block;width:100%;height:auto;touch-action:manipulation}
.fm path{stroke:#FFFFFF;stroke-width:1.1;stroke-linejoin:round;cursor:pointer}
.fm path.on{stroke:var(--ink);stroke-width:2.4}
.fm .n{fill:#ECE7E5}
.key{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12.5px;color:var(--muted)}
.key span{display:inline-flex;align-items:center;gap:6px}
.key i{display:inline-block;width:12px;height:12px;border-radius:3px;flex:none}
.pick{min-height:1.45em;font-size:13.5px;margin:0}
.pick b{font-weight:500}
.pick .hint{color:var(--muted)}
.stand{margin:0;display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;font-size:13.5px;border-top:1px solid var(--rule);padding-top:10px}
.stand dt{font-size:11px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding-top:2px}
.stand dd{margin:0}
.small{font-size:12.5px;color:var(--muted);margin:0}
.share{flex:none;background:none;border:1px solid var(--rule);border-radius:999px;padding:4px 12px;min-height:36px;font:500 13px var(--body);color:var(--ink);cursor:pointer}
.share:hover{border-color:var(--ink)}
.tip{position:fixed;z-index:10;pointer-events:none;background:var(--ink);color:var(--bg);font-size:13px;line-height:1.35;padding:6px 10px;border-radius:8px;max-width:260px;box-shadow:0 6px 20px rgba(0,0,0,.18)}
.tip b{display:block;font-weight:500}
.foot{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px 16px;font-size:12px;color:var(--muted);margin-top:36px;border-top:1px solid var(--rule);padding-top:14px}
@media (max-width:860px){.maps{grid-template-columns:minmax(0,1fr)}}
@media (max-width:520px){
  .wrap{padding:0 16px 32px}
  h1{font-size:34px}
  h2{font-size:22px}
  .fm{padding:14px 14px 12px}
  .stand{grid-template-columns:minmax(0,1fr)}
  .nav{flex-wrap:nowrap;overflow-x:auto;margin:0 -16px 8px;padding:0 16px 6px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
  .nav::-webkit-scrollbar{display:none}
  .chip{flex:none}
  .stand dd{margin-bottom:4px}
}
@media (hover:none){.tip{display:none}}
/* Site header: the same as the maps hub (docs/index.html). */
.site{max-width:1120px;margin:0 auto;padding:28px 24px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.site a{color:inherit;text-decoration:none}
.site .mark{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:800;font-size:18px;letter-spacing:.08em}
.site .brand{display:flex;align-items:center;gap:9px;font-size:24px;letter-spacing:-.01em}
.site .brand b{font-weight:500;color:var(--accent)}
.site .sub{font-family:'IBM Plex Mono',ui-monospace,monospace;font-weight:500;font-size:13px;letter-spacing:.08em;color:var(--sub)}
.site .sub:hover{color:var(--ink)}
.site .sep{width:1.5px;height:16px;background:var(--pill-line)}
.site .links{display:flex;flex-wrap:wrap;gap:10px}
.site .pill{display:flex;align-items:center;gap:8px;min-height:44px;padding:0 16px;border-radius:999px;font-weight:500;font-size:15px;background:var(--card);border:1.5px solid var(--pill-line);transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease}
.site .pill .short{display:none}
.site .pill.instagram{background:linear-gradient(45deg,#F58529 0%,#DD2A7B 45%,#8134AF 75%,#515BD4 100%);border-color:transparent;color:#fff}
.site .pill:hover{transform:translateY(-3px);box-shadow:0 14px 34px rgba(26,20,20,.10);border-color:var(--ink)}
.site .pill.instagram:hover{border-color:transparent}
.site .pill:focus-visible,.site .mark a:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
@media (prefers-reduced-motion:reduce){.site .pill{transition:none}.site .pill:hover{transform:none}}
@media (max-width:520px){.site{padding:20px 16px}.site .links{flex-wrap:nowrap;gap:8px}.site .pill{gap:6px;min-height:40px;padding:0 13px;font-size:14px}.site .pill svg{width:16px;height:16px}.site .pill .full{display:none}.site .pill .short{display:inline}}
{{themeCss}}
</style>
</head>
<body>
  <header class="site">
    <div class="mark">
      <a class="brand" href="/"><svg width="22" height="28" viewBox="18 6 84 108" aria-hidden="true"><path d="M60 112 C60 112 22 74 22 48 A38 38 0 0 1 98 48 C98 74 60 112 60 112 Z" fill="#C8102E"/><polygon points="60,52 84,63 60,74 36,63" fill="#fff" fill-opacity=".42"/><polygon points="60,39 84,50 60,61 36,50" fill="#fff" fill-opacity=".72"/><polygon points="60,20 90,34 60,48 30,34" fill="#fff"/></svg><span>Layers<b>.City</b></span></a>
      <span class="sep" aria-hidden="true"></span>
      <a class="sub" href="https://noumankhan.ca">BY NOUMAN KHAN</a>
    </div>
    <nav class="links" aria-label="Elsewhere">
      <a class="pill" href="mailto:go@layers.city" aria-label="Email go@layers.city">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>
        <span class="full">go@layers.city</span><span class="short">Email</span>
      </a>
      <a class="pill instagram" href="https://www.instagram.com/layers.city" rel="me" aria-label="layers.city on Instagram">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.3" cy="6.7" r="1" fill="currentColor" stroke="none"/></svg>
        layers.city
      </a>
    </nav>
  </header>
<main class="wrap">
  <div class="kicker"><a href="../">{{city}}</a> · Fun maps</div>
  <h1>{{title}}</h1>
  <div class="rule"></div>
  <p class="lede">{{lede}}</p>
  <nav class="nav" id="nav" aria-label="Maps on this page"></nav>
  <div class="maps" id="maps"></div>
  <footer class="foot"><span>{{credits}} {{refresh}}</span><span id="asof"></span></footer>
</main>
<div class="tip" id="tip" hidden></div>
<script>
(() => {
  const F = {{FUN}};   // outlines and per-map classes, written by engine/fun/build.py
  const $ = id => document.getElementById(id);
  const NS = 'http://www.w3.org/2000/svg';
  const el = (tag, attrs = {}, kids) => {
    const n = ['svg', 'path', 'g'].includes(tag) ? document.createElementNS(NS, tag) : document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) if (v != null) n.setAttribute(k, v);
    if (kids != null) (Array.isArray(kids) ? kids : [kids]).forEach(c => c != null && n.append(c));
    return n;
  };
  const tip = $('tip');

  F.maps.forEach(m => {
    $('nav').append(el('a', {class: 'chip', href: '#' + m.id}, m.title));
    const sh = F.shapes[m.unit];
    const pick = el('p', {class: 'pick'}, el('span', {class: 'hint'}, 'Tap a ' + (m.unit === 'wd' ? 'ward' : 'neighbourhood') + ' for its numbers.'));
    const svg = el('svg', {viewBox: `0 0 ${F.w} ${F.h}`, role: 'img', 'aria-label': m.title + ' map. ' + m.line});
    let on = null;
    const show = i => {
      if (on) on.classList.remove('on');
      on = svg.children[i]; on.classList.add('on'); svg.append(on);   // to the front, so its outline shows
      pick.replaceChildren(el('b', {}, sh.names[i] + ': '), m.tips[i]);
    };
    sh.d.forEach((d, i) => {
      const k = m.v[i], leg = m.legend[k];
      const p = el('path', {d, fill: leg.n ? null : leg.c, class: leg.n ? 'n' : null, 'data-i': i});
      p.addEventListener('click', () => show(i));
      p.addEventListener('pointermove', e => {
        if (e.pointerType !== 'mouse') return;
        tip.replaceChildren(el('b', {}, sh.names[i]), m.tips[i]);
        tip.hidden = false;
        const x = Math.min(e.clientX + 14, innerWidth - tip.offsetWidth - 8);
        tip.style.left = x + 'px'; tip.style.top = (e.clientY + 16) + 'px';
      });
      p.addEventListener('pointerleave', () => { tip.hidden = true; });
      svg.append(p);
    });
    const key = el('div', {class: 'key'}, m.legend.map(l => el('span', {}, [el('i', {class: l.n ? 'n' : null, style: l.n ? null : 'background:' + l.c}), l.l])));
    key.querySelectorAll('i.n').forEach(i => i.style.background = 'var(--rule)');
    const share = el('button', {class: 'share', type: 'button', 'aria-label': 'Copy a link to ' + m.title}, 'Copy link');
    share.addEventListener('click', async () => {
      const url = location.origin + location.pathname + '#' + m.id;
      try { await navigator.clipboard.writeText(url); share.textContent = 'Copied'; }
      catch (e) { location.hash = m.id; share.textContent = 'Link in address bar'; }
      setTimeout(() => { share.textContent = 'Copy link'; }, 1800);
    });
    const stand = m.stand.length ? el('dl', {class: 'stand'}, m.stand.flatMap(s => [el('dt', {}, s.k), el('dd', {}, s.v)])) : null;
    $('maps').append(el('section', {class: 'fm', id: m.id, 'aria-labelledby': m.id + '-h'}, [
      el('div', {class: 'head'}, [el('h2', {id: m.id + '-h'}, m.title), share]),
      el('p', {class: 'line'}, m.line),
      svg, key, pick, stand,
      m.total ? el('p', {class: 'small'}, m.total) : null,
      m.note ? el('p', {class: 'small'}, m.note) : null,
    ]));
  });
  if (F.asof) $('asof').textContent = 'Shops counted ' + new Date(F.asof + 'T12:00:00').toLocaleDateString('en-CA', {year: 'numeric', month: 'long', day: 'numeric'});
  if (location.hash) { const t = document.getElementById(location.hash.slice(1)); if (t) t.scrollIntoView(); }
})();
</script>
<script defer src="/stats.js"></script>
</body>
</html>
