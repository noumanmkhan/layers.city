<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>%TITLE% · GPU prototype</title>
<script>try { const t = localStorage.getItem('theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}</script>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@%MLV%/dist/maplibre-gl.css">
<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@%MLV%/dist/maplibre-gl.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
/*ENGINE_CSS*/
</style>
<style>
/*CITY_CSS*/
</style>
<style>
/* Prototype chrome: a small layer box and a one-line "What's here". */
.gl-probe{position:absolute;width:0;height:0;overflow:hidden;visibility:hidden;pointer-events:none}
#gl-box{position:absolute;top:calc(10px + env(safe-area-inset-top));left:10px;z-index:5;background:var(--panel);color:var(--ink);border-radius:12px;box-shadow:var(--shadow);padding:10px 12px;font-size:13px;max-width:240px}
#gl-box h1{font-size:15px;margin:0 0 2px} #gl-box p{margin:0 0 8px;color:var(--ink-2);font-size:12px}
#gl-box details summary{cursor:pointer;font-weight:600;font-size:13px}
#gl-layers{display:grid;gap:4px;margin-top:6px} #gl-layers label{display:flex;gap:6px;align-items:center}
#gl-box .row{display:flex;gap:8px;margin-top:8px} #gl-box button,#gl-box a.btn{font:inherit;font-size:12px;border:1px solid var(--rule);background:var(--panel);color:var(--ink);border-radius:8px;padding:4px 8px;text-decoration:none;cursor:pointer}
#gl-here{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(36px + env(safe-area-inset-bottom));z-index:5;background:var(--panel);color:var(--ink);border-radius:10px;box-shadow:var(--shadow);padding:8px 14px;font-weight:600}
.maplibregl-ctrl-attrib{font-size:10.5px}
@media (max-width:760px){.maplibregl-ctrl-group{display:none}}
</style>
</head>
<body>
<div id="app">
  <div id="map" role="application" aria-label="Map"></div>
  <div id="gl-box">
    <h1>%TITLE%</h1>
    <p>GPU (MapLibre) prototype, for comparing zoom smoothness. Not the full map.</p>
    <details><summary>Layers</summary><div id="gl-layers"></div></details>
    <div class="row"><button id="gl-theme" type="button">Light / dark</button><a class="btn" href="../">Current map</a></div>
  </div>
  <div id="gl-here" hidden></div>
</div>
<script>const CITY = /*CITY_CONFIG*/;</script>
<script>
/*ENGINE_JS*/
</script>
</body>
</html>
