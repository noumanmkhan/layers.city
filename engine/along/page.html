<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="{{description}}">
<title>{{title}} · {{city}} · Layers.City</title>
<link rel="canonical" href="{{canonical}}">{{robots}}
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
{{themeScript}}
<style>
@font-face{font-family:'Archivo';font-weight:700;font-display:swap;src:url(/fonts/archivo-latin-700-normal.woff2) format('woff2')}
@font-face{font-family:'Archivo';font-weight:800;font-display:swap;src:url(/fonts/archivo-latin-800-normal.woff2) format('woff2')}
@font-face{font-family:'IBM Plex Sans';font-weight:400;font-display:swap;src:url(/fonts/ibm-plex-sans-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:'IBM Plex Sans';font-weight:500;font-display:swap;src:url(/fonts/ibm-plex-sans-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'IBM Plex Mono';font-weight:500;font-display:swap;src:url(/fonts/ibm-plex-mono-latin-500-normal.woff2) format('woff2')}
:root{
  --bg:#F7F4F3; --card:#FFFFFF; --ink:#1A1414; --muted:#5E5452; --rule:#E4DCDA; --accent:#C8102E;
  --display:'Archivo',system-ui,sans-serif; --body:'IBM Plex Sans',system-ui,sans-serif;
  --water:#DCE7EC; --m-city:#F7F4F3; --m-out:#ECE7E5; --m-edge:#D8CFCD; --m-hoodline:#E2D7D4;
  --m-major:#D6CDCA; --m-halo:#FFFFFF; --pill-line:#D8CFCD; --sub:#5C5251; --hover:#F3EEEC;
  /* what each kind of place looks like: its dot on the map and its mark in the list */
  --k-landmark:#C8102E; --k-area:#C8102E; --k-street:#B5651D; --k-heritage:#7A5C3E; --k-park:#3F8F4E;
  --k-campus:#2F5E9E; --k-library:#6B4FA0; --k-tower:#4A5560;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45}
button,input{font:inherit;color:inherit}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.wrap{max-width:1120px;margin:0 auto;padding:0 24px 40px}
h1{margin:4px 0 8px;font-family:var(--display);font-weight:800;font-size:44px;line-height:1.02;letter-spacing:-.02em}
h2{margin:0;font-family:var(--display);font-weight:800;font-size:26px;line-height:1.1;letter-spacing:-.01em}
.kicker{font-size:12px;font-weight:500;letter-spacing:.12em;color:var(--accent);text-transform:uppercase}
.lede{max-width:660px;color:var(--muted);margin:0 0 18px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;-webkit-appearance:none;appearance:none;padding:8px 16px;border:1.5px solid var(--ink);border-radius:999px;background:var(--card);min-height:44px;font-weight:500;cursor:pointer;text-decoration:none;color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn:disabled{opacity:.6;cursor:default}
.btn:focus-visible,.opt:focus-visible,.ends input:focus-visible,.mini:focus-visible,.more:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
/* Where from, where to */
.ends{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;max-width:640px}
.ends .pair{display:grid;gap:8px}
.ends .f{display:flex;gap:8px;align-items:center;background:var(--card);border:1px solid var(--rule);border-radius:12px;padding:4px 6px 4px 12px}
.ends .f b{font-size:11px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);width:38px;flex:none}
.ends input{flex:1;min-width:0;border:0;background:none;padding:8px 2px;min-height:40px;border-radius:6px}
.ends input:focus{outline:none}
.mini{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--rule);background:var(--bg);border-radius:999px;padding:0 12px;min-height:36px;cursor:pointer;font-size:13px;font-weight:500;white-space:nowrap}
.mini:hover{border-color:var(--ink)}
.swap{align-self:center;width:44px;height:44px;border-radius:50%;border:1px solid var(--rule);background:var(--card);cursor:pointer;display:grid;place-items:center}
.swap:hover{border-color:var(--ink)}
.go-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:12px}
.hint{color:var(--muted);font-size:13.5px;margin:10px 0 0;min-height:1.4em}
.tries{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:6px}
.tries .lbl{font-size:12px;font-weight:500;letter-spacing:.1em;color:var(--muted);text-transform:uppercase}
.chip{border:1px solid var(--rule);background:var(--card);border-radius:999px;padding:6px 12px;min-height:36px;cursor:pointer;font-size:13.5px}
.chip:hover{border-color:var(--ink)}
/* The ways to go */
.res{margin-top:28px}
.res-head{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:baseline;justify-content:space-between;margin-bottom:12px}
.res-head p{margin:0;color:var(--muted);font-size:13.5px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px;margin-bottom:16px}
.opt{display:flex;flex-direction:column;gap:8px;text-align:left;background:var(--card);border:1.5px solid var(--rule);border-radius:12px;padding:12px 14px;cursor:pointer}
.opt:hover{border-color:var(--ink)}
.opt[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.opt .k{font-size:11px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.opt[aria-pressed="true"] .k{color:var(--accent)}
.opt .chain{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.opt .chain .ar{color:var(--muted);font-size:13px}
.opt .t{font-weight:500}
.opt .t small{color:var(--muted);font-weight:400;font-size:13px}
.split{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:14px;align-items:start}
.mapbox{background:var(--card);border:1px solid var(--rule);border-radius:12px;overflow:hidden;position:sticky;top:12px}
.mapbox svg{display:block;width:100%;height:auto;background:var(--water)}
.mapfoot{display:flex;flex-wrap:wrap;gap:8px 14px;justify-content:space-between;align-items:center;padding:10px 14px;font-size:12.5px;color:var(--muted);border-top:1px solid var(--rule)}
.mapfoot a{color:var(--accent);font-weight:500;text-decoration:none}
.key{display:flex;flex-wrap:wrap;gap:4px 12px}
.key i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:0}
/* The trip, stop by stop */
.story{background:var(--card);border:1px solid var(--rule);border-radius:12px;padding:6px 16px 12px}
.tl{list-style:none;margin:0;padding:0}
.tl > li{position:relative;padding:8px 0 8px 28px}
.tl > li::before{content:'';position:absolute;left:9px;top:0;bottom:0;width:4px;background:var(--line,var(--rule))}
.tl > li.walk::before{background:none;border-left:3px dotted var(--muted);left:10px;width:0}
.tl > li.end::before{bottom:calc(100% - 16px)} .tl > li.start::before{top:16px;background:none;border-left:3px dotted var(--muted);left:10px;width:0}
.tl > li::after{content:'';position:absolute;left:5px;top:13px;width:12px;height:12px;border-radius:50%;background:var(--card);box-shadow:inset 0 0 0 3px var(--line,var(--ink))}
.tl > li.walk::after{display:none}
.tl > li.start::after,.tl > li.end::after{width:18px;height:18px;left:2px;top:10px;background:var(--accent);box-shadow:0 0 0 3px var(--card) inset}
.tl > li.leg::after{display:none}
.tl > li.leg{padding:12px 0 8px 28px}
.tl > li.on{background:var(--hover)}
.tl .h{font-weight:500}
.tl .h .s{display:block;color:var(--muted);font-weight:400;font-size:13px}
.tl .big{font-family:var(--display);font-weight:800;font-size:18px;letter-spacing:-.01em;line-height:1.2}
.tl .lh{display:flex;gap:10px;align-items:center}
.tl .lh .h{line-height:1.25}
.tl .via{color:var(--muted);font-size:13.5px;margin-top:4px}
.tl .via .ka{font-style:italic;color:var(--accent);font-weight:500}
.tl .wl{color:var(--muted);font-size:13.5px}
.ps{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:3px}
.ps li{display:grid;grid-template-columns:12px minmax(0,1fr) auto;gap:8px;align-items:baseline;font-size:14px;line-height:1.35}
.ps li i{width:9px;height:9px;border-radius:50%;background:var(--kc);align-self:center}
.ps li.area i{background:none;border:2px solid var(--kc);width:10px;height:10px}
.ps li .w{color:var(--muted);font-size:12.5px;white-space:nowrap}
.ps li .n small{color:var(--muted);font-size:12.5px;margin-left:5px}
.ps li.area .n{font-style:italic;color:var(--accent);font-weight:500}
.more{background:none;border:0;padding:2px 0;min-height:30px;color:var(--accent);font-weight:500;cursor:pointer;font-size:13.5px}
.note{color:var(--muted);font-size:13px;margin:12px 0 0}
.empty{background:var(--card);border:1px dashed var(--rule);border-radius:12px;padding:18px;color:var(--muted)}
.foot{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px 16px;font-size:12px;color:var(--muted);margin-top:36px;border-top:1px solid var(--rule);padding-top:14px}
/* Badges: shapes here, colours from the city's factsheet.css */
.rb{display:inline-grid;place-items:center;box-sizing:border-box;height:26px;min-width:40px;padding:0 6px;border-radius:5px;font:700 14px/1 var(--body);background:#fff;color:#1A1414;box-shadow:inset 0 0 0 2px #1A1414;flex:none}
.ln{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;font:800 13px/1 var(--display);color:#fff;background:#5E5452;flex:none}
.wk{display:inline-grid;place-items:center;width:22px;height:22px;color:var(--muted)}
@media (max-width:860px){
  .split{grid-template-columns:minmax(0,1fr)}
  .mapbox{position:static}
}
@media (max-width:520px){
  .wrap{padding:0 16px 32px}
  h1{font-size:34px}
  h2{font-size:22px}
  .go-row .btn.primary{flex:1 1 100%}
  .ends .f b{width:32px}
}
/* Site header: the same as the maps hub (docs/index.html). */
.site{max-width:1120px;margin:0 auto;padding:28px 24px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.site a{color:inherit;text-decoration:none}
.site .mark{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:800;font-size:18px;letter-spacing:.08em}
.site .brand{display:flex;align-items:center;gap:9px;font-size:24px;letter-spacing:-.01em}
.site .brand b{font-weight:500;color:var(--accent)}
.site .sub{font-family:'IBM Plex Mono',ui-monospace,monospace;font-weight:500;font-size:13px;letter-spacing:.08em;color:var(--sub)}
.site .sub:hover{color:var(--ink)}
.site .sep{width:1.5px;height:16px;background:var(--pill-line)}
.site .links{display:flex;flex-wrap:wrap;gap:10px}
.site .pill{display:flex;align-items:center;gap:8px;min-height:44px;padding:0 16px;border-radius:999px;font-weight:500;font-size:15px;background:var(--card);border:1.5px solid var(--pill-line);transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease}
.site .pill .short{display:none}
.site .pill.instagram{background:linear-gradient(45deg,#F58529 0%,#DD2A7B 45%,#8134AF 75%,#515BD4 100%);border-color:transparent;color:#fff}
.site .pill:hover{transform:translateY(-3px);box-shadow:0 14px 34px rgba(26,20,20,.10);border-color:var(--ink)}
.site .pill.instagram:hover{border-color:transparent}
.site .pill:focus-visible,.site .mark a:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
@media (prefers-reduced-motion:reduce){.site .pill{transition:none}.site .pill:hover{transform:none}}
@media (max-width:520px){.site{padding:20px 16px}.site .links{flex-wrap:nowrap;gap:8px}.site .pill{gap:6px;min-height:40px;padding:0 13px;font-size:14px}.site .pill svg{width:16px;height:16px}.site .pill .full{display:none}.site .pill .short{display:inline}}
/* This city: */
{{css}}
{{themeCss}}
.rb{height:26px;min-width:40px;font-size:14px;box-shadow:inset 0 0 0 2px currentColor}
</style>
</head>
<body>
  <header class="site">
    <div class="mark">
      <a class="brand" href="/"><svg width="22" height="28" viewBox="18 6 84 108" aria-hidden="true"><path d="M60 112 C60 112 22 74 22 48 A38 38 0 0 1 98 48 C98 74 60 112 60 112 Z" fill="#C8102E"/><polygon points="60,52 84,63 60,74 36,63" fill="#fff" fill-opacity=".42"/><polygon points="60,39 84,50 60,61 36,50" fill="#fff" fill-opacity=".72"/><polygon points="60,20 90,34 60,48 30,34" fill="#fff"/></svg><span>Layers<b>.City</b></span></a>
      <span class="sep" aria-hidden="true"></span>
      <a class="sub" href="https://noumankhan.ca">BY NOUMAN KHAN</a>
    </div>
    <nav class="links" aria-label="Elsewhere">
      <a class="pill" href="mailto:go@layers.city" aria-label="Email go@layers.city">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>
        <span class="full">go@layers.city</span><span class="short">Email</span>
      </a>
      <a class="pill instagram" href="https://www.instagram.com/layers.city" rel="me" aria-label="layers.city on Instagram">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.3" cy="6.7" r="1" fill="currentColor" stroke="none"/></svg>
        layers.city
      </a>
    </nav>
  </header>
<main class="wrap">
  <section id="intro">
    <div class="kicker" id="kicker"></div>
    <h1>{{title}}</h1>
    <p class="lede">{{lede}}</p>
    <form id="find" autocomplete="off">
      <div class="ends">
        <div class="pair">
          <div class="f"><b>From</b><label for="qa" class="sr">Where you start</label><input id="qa" type="search" placeholder="Where you start: an address or place" enterkeyhint="next">
            <button type="button" class="mini" id="locate" aria-label="Start from where I am">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2.5" fill="currentColor"/><path d="M12 1v4M12 19v4M1 12h4M19 12h4"/></svg>Here</button></div>
          <div class="f"><b>To</b><label for="qb" class="sr">Where you’re going</label><input id="qb" type="search" placeholder="Where you’re going" enterkeyhint="go"></div>
        </div>
        <button type="button" class="swap" id="swap" aria-label="Swap start and end"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 4v16M3 8l4-4 4 4M17 20V4M13 16l4 4 4-4"/></svg></button>
      </div>
      <div class="go-row"><button type="submit" class="btn primary" id="go">Show what’s along the way</button></div>
    </form>
    <p class="hint" id="hint" aria-live="polite">Routes are worked out in your browser. A shared link names the nearest stops, never your address.</p>
    <div class="tries" id="tries" hidden></div>
  </section>

  <section class="res" id="res" hidden>
    <div class="res-head"><h2 id="resTitle"></h2><p id="resNote"></p></div>
    <div class="opts" id="opts" role="group" aria-label="Ways to go"></div>
    <div class="split">
      <div class="mapbox"><div id="map"></div>
        <div class="mapfoot"><span class="key" id="key"></span><a id="maplink" href="../">{{mapLink}} →</a></div>
      </div>
      <div class="story"><ol class="tl" id="story"></ol></div>
    </div>
    <p class="note" id="caveat"></p>
  </section>

  <footer class="foot"><span>{{credits}}</span><span id="asof"></span></footer>
</main>
<script>{{router}}</script>
<script>
(() => {
  const RS = {{RS}};   // this city's settings and wording (cities/<city>/along.json)
  const $ = id => document.getElementById(id);
  const NS = 'http://www.w3.org/2000/svg';
  const SVG_TAGS = ['svg', 'path', 'circle', 'text', 'rect', 'g'];
  const el = (tag, attrs = {}, kids) => {
    const n = SVG_TAGS.includes(tag) ? document.createElementNS(NS, tag) : document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) if (v != null) n.setAttribute(k, v);
    if (kids != null) (Array.isArray(kids) ? kids : [kids]).forEach(c => c != null && n.append(c));
    return n;
  };
  const getJSON = async url => { const r = await fetch(url); if (!r.ok) throw new Error(url + ' ' + r.status); return r.json(); };
  const once = f => { let p; return () => (p ||= f()); };
  const gjOrNone = n => getJSON('../data/' + n + '.geojson').catch(() => ({ features: [] }));
  const basemap = once(() => Promise.all([gjOrNone('base'), gjOrNone('streets'), gjOrNone('subway_lines'), gjOrNone('neighbourhoods')]));
  const cityCfg = once(() => getJSON('../data/city.json'));
  const routeFile = {};
  const routeData = rid => (routeFile[rid] ||= getJSON('../routes/data/r/' + encodeURIComponent(rid) + '.json').catch(() => null));

  let G = null, R = null, P = null;      // graph, router, places
  let A = null, B = null;                 // {lon, lat, label, sid}
  let opts = [], cur = 0;

  // ---- words ----
  const kmBetween = (lon1, lat1, lon2, lat2) => Math.hypot((lon1 - lon2) * 111.32 * Math.cos(lat1 * Math.PI / 180), (lat1 - lat2) * 110.574);
  const walkTxt = m => `${Math.max(1, Math.round(m * 1.3 / 80))} min walk`;
  const clean = n => n.replace(/\s*-?\s*\b((North|South|East|West)bound|Subway|LRT)? ?Platform\b.*$/i, '').replace(/\s*\((North|South|East|West)( Side)?\)/gi, '').replace(/\s+(North|South|East|West) Side\b/gi, '').replace(/\s+-\s+[^-]*Station$/, '').replace(/\s+/g, ' ').trim();
  const isRapid = rid => ['subway', 'lrt', 'rail'].includes(G.routes[rid][2]);
  const WORD = { bus: 'bus', tram: 'streetcar', subway: 'subway', lrt: 'LRT' };
  const badge = rid => { const r = G.routes[rid];
    if (isRapid(rid)) return el('span', { class: 'ln l' + r[0], 'aria-hidden': 'true' }, r[0]);
    return el('span', { class: 'rb' + (r[2] === 'tram' ? ' tram' : /^9\d\d$/.test(r[0]) ? ' exp' : ''), 'aria-hidden': 'true' }, r[0]); };
  // The colour a route's badge shows, for its line on the map (read from the city's CSS).
  const colourCache = {};
  function colourOf(rid) {
    if (colourCache[rid]) return colourCache[rid];
    const b = badge(rid); b.style.position = 'absolute'; b.style.left = '-999px'; document.body.append(b);
    // an outlined badge (a regular bus) takes its text colour, a filled one (a streetcar, a subway line) its fill
    const cs = getComputedStyle(b), filled = !b.classList.contains('rb') || b.classList.contains('tram') || b.classList.contains('exp');
    const c = filled ? cs.backgroundColor : cs.color;
    b.remove(); return (colourCache[rid] = c);
  }
  const routeName = rid => { const r = G.routes[rid]; return isRapid(rid) ? r[1].replace(/\s*\(.*\)$/, '') : `${r[0]} ${r[1]}`; };
  const stopName = s => clean(G.stops[s][2]);
  // A station's name for the list ("Pape Station"), a stop's cross streets otherwise.

  // ---- places a short walk away ----
  let grid = null; const CELL = 0.004;
  function indexPlaces() {
    grid = new Map();
    P.pois.forEach((p, i) => { const c = p[3]; for (let j = 0; j < c.length; j += 2) {
      const k = Math.floor(c[j] / CELL) + ',' + Math.floor(c[j + 1] / CELL);
      if (!grid.has(k)) grid.set(k, []); grid.get(k).push(i, j); } });
  }
  // Every place within r metres of a spot: Map(place index -> metres).
  function placesNear(lon, lat, r) {
    const out = new Map(), span = Math.ceil(r / 300) + 1, cx = Math.floor(lon / CELL), cy = Math.floor(lat / CELL);
    for (let i = cx - span; i <= cx + span; i++) for (let j = cy - span; j <= cy + span; j++) {
      const a = grid.get(i + ',' + j); if (!a) continue;
      for (let n = 0; n < a.length; n += 2) { const c = P.pois[a[n]][3], m = kmBetween(lon, lat, c[a[n + 1]], c[a[n + 1] + 1]) * 1000;
        if (m <= r && (!out.has(a[n]) || m < out.get(a[n]))) out.set(a[n], m); }
    }
    return out;
  }
  const KORDER = P0 => Object.fromEntries((P0.kinds || []).map((k, i) => [k, i]));

  // ---- the trip as a list: start, each ride (its stops with what's near them), changes, end ----
  const STOP_R = 350, END_R = 700;   // about a 5-minute walk from a stop, 10 from either end
  function places(o) {
    // Every spot on the trip, in order; each place goes to the spot it's closest to.
    const spots = [{ end: 'a', lon: A.lon, lat: A.lat, r: END_R }];
    // a change is one spot: where you get off (the next ride's first stop is a short walk from it)
    let firstRide = true;
    o.legs.forEach((l, li) => { if (!l.route) return; const fr = firstRide; firstRide = false;

      RS.tries.forEach(x => { const a = byId.get(x.from), b = byId.get(x.to); if (a == null || b == null) return;
        const c = el('button', { type: 'button', class: 'chip' }, x.name);
        c.addEventListener('click', () => { A = spotAt(G.stops[a][0], G.stops[a][1], x.fromLabel || 'Near ' + stopName(a)); B = spotAt(G.stops[b][0], G.stops[b][1], x.toLabel || 'Near ' + stopName(b));
          $('qa').value = A.label; $('qb').value = B.label; cur = 0; plan(true); });
        t.append(c); });
    }
    if (fromURL()) await plan(false);
  }
  init().catch(e => { console.error(e); $('hint').textContent = 'This page could not load. Try again in a moment.'; });
})();
</script>
