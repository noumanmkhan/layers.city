<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="{{description}}">
{{robots}}
<title>{{short}} · {{city}} · Layers.City</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
{{themeScript}}
<style>
@font-face{font-family:'Archivo';font-weight:700;font-display:swap;src:url(/fonts/archivo-latin-700-normal.woff2) format('woff2')}
@font-face{font-family:'Archivo';font-weight:800;font-display:swap;src:url(/fonts/archivo-latin-800-normal.woff2) format('woff2')}
@font-face{font-family:'IBM Plex Sans';font-weight:400;font-display:swap;src:url(/fonts/ibm-plex-sans-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:'IBM Plex Sans';font-weight:500;font-display:swap;src:url(/fonts/ibm-plex-sans-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'IBM Plex Mono';font-weight:500;font-display:swap;src:url(/fonts/ibm-plex-mono-latin-500-normal.woff2) format('woff2')}
:root{
  --bg:#F7F4F3; --card:#FFFFFF; --ink:#1A1414; --muted:#5E5452; --rule:#E4DCDA; --accent:#C8102E;
  --display:'Archivo',system-ui,sans-serif; --body:'IBM Plex Sans',system-ui,sans-serif; --mono:'IBM Plex Mono',ui-monospace,monospace;
  --pill-line:#D8CFCD; --sub:#5C5251;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45}
a{color:var(--accent)}
button{font:inherit;color:inherit}
.wrap{max-width:1120px;margin:0 auto;padding:0 24px 40px}
h1{margin:4px 0 8px;font-family:var(--display);font-weight:800;font-size:44px;line-height:1.02;letter-spacing:-.02em;max-width:820px}
h2{margin:0 0 10px;font-family:var(--display);font-weight:800;font-size:22px;line-height:1.1;letter-spacing:-.01em}
h3{margin:0;font-family:var(--display);font-weight:800;font-size:22px;line-height:1.1}
.kicker{font-size:12px;font-weight:500;letter-spacing:.12em;color:var(--accent);text-transform:uppercase}
.kicker a{text-decoration:none}
.lede{max-width:680px;color:var(--muted);margin:0 0 18px}
.rule{height:3px;width:64px;background:var(--accent);margin:14px 0}
.card{background:var(--card);border:1px solid var(--rule);border-radius:14px}

/* The map */
.mapcard{padding:0;overflow:hidden}
:root{--water:#DCE7EC;--land:#FBFAF9;--near:#EFEBE9;--street:#DDD4D1;--edge:#BFB3B0;--case:#1A1414;--ghost:#A99E9B}
.map{position:relative;background:var(--water)}
.map svg{display:block;width:100%;height:auto;max-height:82vh;touch-action:pan-y;user-select:none;-webkit-user-select:none;cursor:grab}
.map svg.drag{cursor:grabbing}
.map .near{fill:var(--near);stroke:var(--edge);stroke-width:.6;vector-effect:non-scaling-stroke}
.map .boro{fill:var(--land);stroke:var(--edge);stroke-width:1.2;stroke-dasharray:5 4;vector-effect:non-scaling-stroke}
.map .streets{fill:none;stroke:var(--street);stroke-width:1.1;vector-effect:non-scaling-stroke;stroke-linecap:round}
.map .blabel{font:500 11px var(--mono);letter-spacing:.14em;fill:var(--muted);opacity:.75;text-anchor:middle;text-transform:uppercase;pointer-events:none}
.ln path{fill:none;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.ln .case{stroke:var(--case);stroke-width:0}
.ln .main{stroke-width:3}
.ln .hit{stroke:transparent;stroke-width:22;cursor:pointer}
.ln.s-proposed .main{stroke-dasharray:7 6;stroke-width:2.8}
.ln.s-approved .main{stroke-dasharray:11 5;stroke-width:3.4}
.ln.s-floated .main{stroke-dasharray:3 6;stroke-width:2.4;opacity:.85}
.ln.s-building .case{stroke-width:7}
.ln.s-building .main{stroke-dasharray:12 6;stroke-width:4.4}
.ln.s-open .case{stroke-width:7.6}
.ln.s-open .main{stroke-width:4.8}
.ln.s-closed .main{stroke:var(--ghost)!important;stroke-width:3;opacity:.75}
.ln.ghost .main{stroke:var(--ghost)!important;stroke-dasharray:1 5;stroke-width:2.6;opacity:.95}
.ln.sel .main{stroke-width:6.5}
.ln.sel .case{stroke-width:10}
.ln.sel.ghost .main,.ln.sel.s-proposed .main,.ln.sel.s-approved .main{stroke-width:4.5}
.lines.dim .ln:not(.sel){opacity:.38}
.ln circle{stroke:var(--case);fill:#fff;vector-effect:non-scaling-stroke;stroke-width:1.4}
.ln.s-floated circle,.ln.s-proposed circle,.ln.s-approved circle,.ln.s-building circle{fill:var(--land)}
.ln.ghost circle,.ln.s-closed circle{stroke:var(--ghost)}
.ln .sts{display:none}
.ln.s-open .sts,.ln.s-building .sts,.ln.s-closed .sts,.ln.sel .sts{display:inline}
.ln text{font:500 11px var(--body);fill:var(--ink);paint-order:stroke;stroke:var(--land);stroke-width:3.5px;stroke-linejoin:round;display:none;pointer-events:none}
.ln.sel text{display:inline}
.gh circle{fill:var(--land);stroke:var(--accent);stroke-width:1.6;stroke-dasharray:2 2;vector-effect:non-scaling-stroke}
.gh text{font:500 11px var(--body);fill:var(--accent);paint-order:stroke;stroke:var(--land);stroke-width:3.5px;display:none}
svg.zoomed .gh text{display:inline}
.yr{position:absolute;left:16px;top:10px;font:800 56px/1 var(--display);letter-spacing:-.03em;color:var(--ink);pointer-events:none;
  text-shadow:0 0 12px var(--water),0 0 4px var(--water)}
.stat{position:absolute;left:18px;top:70px;font:500 12px var(--mono);letter-spacing:.06em;color:var(--muted);pointer-events:none;text-shadow:0 0 6px var(--water)}
.zoom{position:absolute;right:12px;top:12px;display:flex;flex-direction:column;gap:6px}
.zoom button{width:38px;height:38px;border-radius:10px;border:1px solid var(--rule);background:var(--card);font-size:20px;line-height:1;cursor:pointer}
.zoom button:hover{border-color:var(--ink)}
.zoom button:focus-visible,.ctl button:focus-visible,.chip:focus-visible,.idx button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* The timeline */
.ctl{display:flex;align-items:center;gap:10px;padding:14px 16px 26px;border-top:1px solid var(--rule)}
.ctl button{flex:none;height:40px;min-width:40px;padding:0 12px;border-radius:999px;border:1px solid var(--rule);background:var(--card);cursor:pointer;font-weight:500;font-size:14px}
.ctl button:hover{border-color:var(--ink)}
.ctl .play{background:var(--accent);border-color:var(--accent);color:#fff;min-width:84px}
.track{position:relative;flex:1;min-width:0;height:40px}
.track input{position:absolute;inset:0;width:100%;margin:0;background:none;accent-color:var(--accent);cursor:pointer}
.ticks{position:absolute;left:10px;right:10px;bottom:0;height:8px;pointer-events:none}
.ticks i{position:absolute;bottom:0;width:2px;height:7px;margin-left:-1px;background:var(--muted);opacity:.55;border-radius:1px}
.scale{position:absolute;left:10px;right:10px;top:100%;height:16px;font:500 11px var(--mono);color:var(--muted);pointer-events:none}
.scale span{position:absolute;transform:translateX(-50%);white-space:nowrap}
.scale span:last-child{transform:translateX(-100%)}
.scale span:first-child{transform:none}
.bar{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;padding:10px 16px 14px;border-top:1px solid var(--rule)}
.key{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--muted)}
.key span{display:inline-flex;align-items:center;gap:6px}
.key svg{flex:none}
.chip{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--rule);background:var(--card);border-radius:999px;padding:6px 12px;min-height:36px;font-size:13.5px;cursor:pointer}
.chip:hover{border-color:var(--ink)}
.chip[aria-pressed="true"]{border-color:var(--ink)}
.chip[aria-pressed="true"]::before{content:'✓';font-size:12px}

/* Panels */
.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;margin-top:18px;align-items:start}
.panel{padding:18px}
.evs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.evs li{display:grid;grid-template-columns:12px minmax(0,1fr);gap:10px;align-items:start}
.evs .dot{width:12px;height:12px;border-radius:50%;margin-top:4px}
.evs button{all:unset;cursor:pointer;font-weight:500;text-decoration:underline;text-decoration-color:var(--rule);text-underline-offset:3px}
.evs button:hover{text-decoration-color:var(--ink)}
.evs button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.when{font:500 11.5px var(--mono);color:var(--muted);letter-spacing:.03em}
.empty{color:var(--muted);margin:0}
.empty button{all:unset;cursor:pointer;color:var(--accent);font-weight:500}
.stage{display:inline-block;font:500 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--rule);border-radius:999px;padding:2px 9px;color:var(--muted);vertical-align:middle}
.head{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 10px;margin-bottom:6px}
.sub{color:var(--muted);font-size:13.5px;margin:0 0 10px}
.hist{list-style:none;margin:12px 0 0;padding:0;border-left:2px solid var(--rule)}
.hist li{position:relative;padding:0 0 12px 16px}
.hist li::before{content:'';position:absolute;left:-6px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--card);border:2px solid var(--muted)}
.hist li.now::before{background:var(--accent);border-color:var(--accent)}
.hist li.later{opacity:.5}
.hist .src{font-size:12.5px;color:var(--muted)}
.hist .src a{color:var(--muted)}
.close{float:right;border:1px solid var(--rule);background:none;border-radius:999px;padding:2px 10px;cursor:pointer;font-size:13px}
.idx{margin-top:18px;padding:18px}
.idx .groups{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.idx details summary{cursor:pointer;list-style:none}
.idx details summary::-webkit-details-marker{display:none}
.idx details summary h4::after{content:' ▸';color:var(--accent)}
.idx details[open] summary h4::after{content:' ▾'}
.idx h4{margin:0 0 8px;font:500 11px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.idx ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.idx button{all:unset;box-sizing:border-box;display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:8px;align-items:center;width:100%;padding:6px 8px;border-radius:8px;cursor:pointer;font-size:14px}
.idx button:hover,.idx button[aria-current="true"]{background:var(--bg)}
.idx .yrs{font:500 11.5px var(--mono);color:var(--muted)}
.small{font-size:12.5px;color:var(--muted);margin:14px 0 0;max-width:760px}
.reach{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:0 16px 14px}
.reach .lbl{font:500 11px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-right:2px}
.reach .chip{min-height:32px;padding:4px 11px;font-size:13px}
.reach .chip .n{font:500 11px var(--mono);color:var(--muted)}
.opkey{padding:0 16px 12px}
.opkey i{display:inline-block;width:22px;height:6px;border-radius:3px;vertical-align:middle}
.got{display:inline-block;font:500 11px var(--mono);letter-spacing:.06em;color:var(--accent);margin-left:2px}
.later{margin-top:18px;padding:18px}
.later ul{list-style:none;margin:10px 0 0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 24px}
.later li b{display:block;font-weight:500}
.later li span{color:var(--muted);font-size:14px}
@media (max-width:860px){.later ul{grid-template-columns:minmax(0,1fr)}}
.tip{position:fixed;z-index:10;pointer-events:none;background:var(--ink);color:var(--bg);font-size:13px;line-height:1.35;padding:6px 10px;border-radius:8px;max-width:260px;box-shadow:0 6px 20px rgba(0,0,0,.18)}
.tip b{display:block;font-weight:500}
.foot{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px 16px;font-size:12px;color:var(--muted);margin-top:30px;border-top:1px solid var(--rule);padding-top:14px}
@media (max-width:860px){.cols{grid-template-columns:minmax(0,1fr)}.idx .groups{grid-template-columns:minmax(0,1fr)}}
@media (max-width:520px){
  .wrap{padding:0 12px 32px}
  h1{font-size:32px}
  .yr{font-size:38px;left:10px;top:8px}
  .stat{top:48px;left:12px;font-size:11px}
  .zoom{right:8px;top:8px}
  .zoom button{width:34px;height:34px}
  .ctl{gap:6px;padding:12px 10px 6px}
  .ctl .play{min-width:64px;padding:0 10px}
  .ctl .step{display:none}
  .ctl{padding-bottom:24px}
  .bar{padding:10px 12px 12px}
  .reach{padding:0 12px 12px}
  .panel,.idx{padding:14px}
  .ln.s-open .main{stroke-width:3.6}.ln.s-open .case{stroke-width:6}
  .ln.s-building .main{stroke-width:3.4}.ln.s-building .case{stroke-width:5.6}
}
@media (hover:none){.tip{display:none}}
@media (max-width:520px){svg:not(.zoomed) .ln.sel text{display:none}}   /* station names crowd the whole-city view on a phone: zoom in for them */
@media (prefers-reduced-motion:reduce){.yr{transition:none}}
/* Site header: the same as the maps hub (docs/index.html). */
.site{max-width:1120px;margin:0 auto;padding:28px 24px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.site a{color:inherit;text-decoration:none}
.site .mark{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:800;font-size:18px;letter-spacing:.08em}
.site .brand{display:flex;align-items:center;gap:9px;font-size:24px;letter-spacing:-.01em}
.site .brand b{font-weight:500;color:var(--accent)}
.site .sub{font-family:'IBM Plex Mono',ui-monospace,monospace;font-weight:500;font-size:13px;letter-spacing:.08em;color:var(--sub)}
.site .sub:hover{color:var(--ink)}
.site .sep{width:1.5px;height:16px;background:var(--pill-line)}
.site .links{display:flex;flex-wrap:wrap;gap:10px}
.site .pill{display:flex;align-items:center;gap:8px;min-height:44px;padding:0 16px;border-radius:999px;font-weight:500;font-size:15px;background:var(--card);border:1.5px solid var(--pill-line);transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease}
.site .pill .short{display:none}
.site .pill.instagram{background:linear-gradient(45deg,#F58529 0%,#DD2A7B 45%,#8134AF 75%,#515BD4 100%);border-color:transparent;color:#fff}
.site .pill:hover{transform:translateY(-3px);box-shadow:0 14px 34px rgba(26,20,20,.10);border-color:var(--ink)}
.site .pill.instagram:hover{border-color:transparent}
.site .pill:focus-visible,.site .mark a:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
@media (prefers-reduced-motion:reduce){.site .pill{transition:none}.site .pill:hover{transform:none}}
@media (max-width:520px){.site{padding:20px 16px}.site .links{flex-wrap:nowrap;gap:8px}.site .pill{gap:6px;min-height:40px;padding:0 13px;font-size:14px}.site .pill svg{width:16px;height:16px}.site .pill .full{display:none}.site .pill .short{display:inline}}
{{themeCss}}
</style>
</head>
<body>
<header class="site">
    <div class="mark">
      <a class="brand" href="/"><svg width="22" height="28" viewBox="18 6 84 108" aria-hidden="true"><path d="M60 112 C60 112 22 74 22 48 A38 38 0 0 1 98 48 C98 74 60 112 60 112 Z" fill="#C8102E"/><polygon points="60,52 84,63 60,74 36,63" fill="#fff" fill-opacity=".42"/><polygon points="60,39 84,50 60,61 36,50" fill="#fff" fill-opacity=".72"/><polygon points="60,20 90,34 60,48 30,34" fill="#fff"/></svg><span>Layers<b>.City</b></span></a>
      <span class="sep" aria-hidden="true"></span>
      <a class="sub" href="https://noumankhan.ca">BY NOUMAN KHAN</a>
    </div>
    <nav class="links" aria-label="Elsewhere">
      <a class="pill" href="mailto:go@layers.city" aria-label="Email go@layers.city">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>
        <span class="full">go@layers.city</span><span class="short">Email</span>
      </a>
      <a class="pill instagram" href="https://www.instagram.com/layers.city" rel="me" aria-label="layers.city on Instagram">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.3" cy="6.7" r="1" fill="currentColor" stroke="none"/></svg>
        layers.city
      </a>
    </nav>
  </header>
<main class="wrap">
  <div class="kicker"><a href="../">{{city}}</a> · {{short}}</div>
  <h1>{{title}}</h1>
  <div class="rule"></div>
  <p class="lede">{{lede}}</p>

  <section class="card mapcard" aria-label="Map and timeline">
    <div class="map" id="mapbox">
      <svg id="map" role="img" aria-label="Map of rapid transit lines for the chosen year"></svg>
      <div class="yr" id="yr" aria-hidden="true"></div>
      <div class="stat" id="stat" aria-live="polite"></div>
      <div class="zoom">
        <button type="button" id="zin" aria-label="Zoom in">+</button>
        <button type="button" id="zout" aria-label="Zoom out">−</button>
        <button type="button" id="zreset" aria-label="Show the whole city" style="font-size:14px">⤢</button>
      </div>
    </div>
    <div class="ctl">
      <button type="button" class="play" id="play" aria-label="Play through the years">▶ Play</button>
      <button type="button" class="step" id="prev" aria-label="Previous year with a change">‹</button>
      <div class="track">
        <input type="range" id="slider" aria-label="Year">
        <div class="ticks" id="ticks"></div>
        <div class="scale" id="scale" aria-hidden="true"></div>
      </div>
      <button type="button" class="step" id="next" aria-label="Next year with a change">›</button>
    </div>
    <div class="bar">
      <div class="key" id="key"></div>
      <button type="button" class="chip" id="ghosts" aria-pressed="true">Show plans that died</button>
    </div>
    <div class="reach" id="colourby" role="group" aria-label="Colour the lines by" hidden><span class="lbl">Colour by</span></div>
    <div class="opkey key" id="opkey" hidden></div>
    <div class="reach" id="reach" role="group" aria-label="Plans never built, by how far they got"><span class="lbl">Never built, by how far it got</span></div>
  </section>

  <div class="cols">
    <section class="card panel" aria-labelledby="year-h">
      <h2 id="year-h">In <span id="year-name"></span></h2>
      <div id="year-ev"></div>
    </section>
    <section class="card panel" id="card" aria-live="polite"></section>
  </div>

  <section class="card idx" aria-labelledby="idx-h">
    <h2 id="idx-h">Every line on this page</h2>
    <div class="groups" id="idx"></div>
  </section>
  <section class="card later" id="later" aria-labelledby="later-h" hidden></section>
  <p class="small">{{note}}</p>
  <footer class="foot"><span>{{credits}}</span></footer>
</main>
<div class="tip" id="tip" hidden></div>
<script>
(() => {
  const B = {{BASE}};   // land, former municipalities and main streets, projected by engine/history/build.py
  const H = {{HIST}};   // every line: path, stations, events
  const $ = id => document.getElementById(id);
  const NS = 'http://www.w3.org/2000/svg';
  const el = (tag, attrs = {}, kids) => {
    const svgTags = ['svg', 'path', 'g', 'circle', 'text', 'rect', 'line'];
    const n = svgTags.includes(tag) ? document.createElementNS(NS, tag) : document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) if (v != null && v !== false) n.setAttribute(k, v);
    if (kids != null) (Array.isArray(kids) ? kids : [kids]).forEach(c => c != null && n.append(c));
    return n;
  };
  const FUT = H.now + 1;                      // the slider's last stop: lines under construction as planned
  const LABEL = {floated: 'Floated', proposed: 'Proposed', approved: 'Approved', building: 'Under construction', open: 'Open', closed: 'Closed',
                 cancelled: 'Cancelled', dormant: 'Shelved', superseded: 'Replaced', none: 'Not yet proposed'};
  const DEAD = new Set(['cancelled', 'dormant', 'superseded']);
  const GROUPS = [['built', 'Built'], ['building', 'Under construction'], ['unbuilt', 'Never built (so far)']];
  const byId = Object.fromEntries(H.lines.map(l => [l.id, l]));
  // How far a plan got (the furthest stage it reached), for lines never built. Built and building lines always show.
  const REACH = [[1, 'floated', 'Floated', 'Pitched, but never adopted by anyone who could build it'],
                 [2, 'adopted', 'Adopted', 'Put forward by the TTC, the City, Metrolinx or Ontario, or voted into a plan'],
                 [3, 'funded', 'Funded', 'Money committed, or its environmental assessment approved'],
                 [4, 'dug', 'Dug', 'Construction started before it was stopped']];
  const GOT = {1: 'Got as far as: floated', 2: 'Got as far as: adopted into a plan', 3: 'Got as far as: funded or approved', 4: 'Got as far as: construction'};
  let reachOn = new Set([2, 3, 4]);
  const shown = l => l.group !== 'unbuilt' || reachOn.has(l.r);
  const yearName = y => y >= FUT ? H.future : String(y);

  // The stage of a line (or ghost station) in year y: its last event up to then. Planned openings count only
  // at the Future stop.
  const stageOf = (item, y) => {
    let s = 'none';
    for (const e of item.ev) { if (e.f ? y >= FUT : e.y <= y) s = e.s; }
    return s;
  };

  // ---- the map --------------------------------------------------------------------------------------------------
  const svg = $('map');
  svg.setAttribute('viewBox', `0 0 ${B.w} ${B.h}`);
  svg.append(el('rect', {x: -B.w, y: -B.h, width: B.w * 3, height: B.h * 3, fill: 'var(--water)'}));
  svg.append(el('path', {d: B.near, class: 'near'}));
  B.boroughs.forEach(b => svg.append(el('path', {d: b.d, class: 'boro'})));
  svg.append(el('path', {d: B.streets, class: 'streets'}));
  const blabels = el('g');
  B.boroughs.forEach(b => blabels.append(el('text', {x: b.lp[0], y: b.lp[1], class: 'blabel'}, b.n)));
  svg.append(blabels);
  const linesG = el('g', {class: 'lines'});
  svg.append(linesG);
  const ghostsG = el('g');
  svg.append(ghostsG);

  const tip = $('tip');
  const showTip = (e, html) => {
    if (e.pointerType !== 'mouse') return;
    tip.replaceChildren(...html); tip.hidden = false;
    tip.style.left = Math.min(e.clientX + 14, innerWidth - tip.offsetWidth - 8) + 'px';
    tip.style.top = (e.clientY + 16) + 'px';
  };
  // Draw order: plans first, then lines under construction, then built ones on top.
  const order = {unbuilt: 0, building: 1, built: 2};
  const nodes = {};
  [...H.lines].sort((a, b) => order[a.group] - order[b.group]).forEach(l => {
    const sts = el('g', {class: 'sts'});
    l.st.forEach(([x, y, n]) => {
      sts.append(el('circle', {cx: x, cy: y, r: 2.6}));
      sts.append(el('text', {x: x + 5, y: y - 5}, n));
    });
    const hit = el('path', {d: l.d, class: 'hit'});
    const g = el('g', {class: 'ln'}, [el('path', {d: l.d, class: 'case'}), el('path', {d: l.d, class: 'main', stroke: l.c, 'data-line': l.id}), sts, hit]);
    hit.addEventListener('click', ev => { ev.stopPropagation(); if (!moved) select(sel === l.id ? null : l.id); });   // tap again to let go
    hit.addEventListener('pointermove', e => showTip(e, [el('b', {}, l.name), LABEL[stageOf(l, year)] + ' in ' + yearName(year)]));
    hit.addEventListener('pointerleave', () => { tip.hidden = true; });
    nodes[l.id] = g;
    linesG.append(g);
  });
  const ghostNodes = H.ghosts.map(gh => {
    const g = el('g', {class: 'gh'}, [el('circle', {cx: gh.p[0], cy: gh.p[1], r: 4.2}), el('text', {x: gh.p[0] - 7, y: gh.p[1] + 4, 'text-anchor': 'end'}, gh.n)]);
    g.addEventListener('pointermove', e => showTip(e, [el('b', {}, gh.n), gh.ev[gh.ev.length - 1].t]));
    g.addEventListener('pointerleave', () => { tip.hidden = true; });
    ghostsG.append(g);
    return g;
  });

  // ---- pan and zoom (viewBox): wheel, drag, pinch, buttons --------------------------------------------------------
  let vb = {x: 0, y: 0, w: B.w, h: B.h};
  const MAXZ = 8;
  const applyVB = () => {
    vb.w = Math.min(B.w, Math.max(B.w / MAXZ, vb.w)); vb.h = vb.w * B.h / B.w;
    vb.x = Math.min(B.w - vb.w * .25, Math.max(-vb.w * .75, vb.x));
    vb.y = Math.min(B.h - vb.h * .25, Math.max(-vb.h * .75, vb.y));
    svg.setAttribute('viewBox', `${vb.x} ${vb.y} ${vb.w} ${vb.h}`);
    // Keep dots and labels the same size on screen at every zoom.
    const k = upp() || 1;
    svg.style.setProperty('--k', k);
    svg.querySelectorAll('.ln circle').forEach(c => c.setAttribute('r', 2.8 * k));
    svg.querySelectorAll('.gh circle').forEach(c => c.setAttribute('r', 4.5 * k));
    svg.querySelectorAll('.ln text, .gh text').forEach(t => t.style.fontSize = (11 * k) + 'px');
    svg.querySelectorAll('.ln text, .gh text').forEach(t => t.style.strokeWidth = (3.5 * k) + 'px');
    svg.querySelectorAll('.blabel').forEach(t => t.style.fontSize = (11 * k) + 'px');
    svg.classList.toggle('zoomed', vb.w < B.w / 1.8);
  };
  // Map units per screen pixel. A capped-height map is letterboxed (preserveAspectRatio meet), so it's the larger ratio,
  // and the drawing sits centred in the box.
  const upp = () => { const r = svg.getBoundingClientRect(); return Math.max(vb.w / r.width, vb.h / r.height); };
  const toSvg = (cx, cy) => {
    const r = svg.getBoundingClientRect(), u = upp();
    return [vb.x + vb.w / 2 + (cx - r.left - r.width / 2) * u, vb.y + vb.h / 2 + (cy - r.top - r.height / 2) * u];
  };
  const zoomAt = (f, px, py) => {
    const nw = Math.min(B.w, Math.max(B.w / MAXZ, vb.w / f));
    const g = nw / vb.w;
    vb.x = px - (px - vb.x) * g; vb.y = py - (py - vb.y) * g; vb.w = nw;
    applyVB();
  };
  svg.addEventListener('wheel', e => {
    if (!e.ctrlKey && !e.metaKey && Math.abs(e.deltaY) < 1) return;
    e.preventDefault();
    const [px, py] = toSvg(e.clientX, e.clientY);
    zoomAt(Math.exp(-e.deltaY * (e.ctrlKey ? .01 : .002)), px, py);
  }, {passive: false});
  const ptrs = new Map();
  let moved = false, pinch = null;
  const start = new Map();
  svg.addEventListener('pointerdown', e => {
    ptrs.set(e.pointerId, [e.clientX, e.clientY]); start.set(e.pointerId, [e.clientX, e.clientY]); moved = false;
    if (ptrs.size === 2) {
      const [a, b] = [...ptrs.values()];
      pinch = {d: Math.hypot(a[0] - b[0], a[1] - b[1]), w: vb.w, c: toSvg((a[0] + b[0]) / 2, (a[1] + b[1]) / 2)};
    }
  });
  svg.addEventListener('pointermove', e => {
    if (!ptrs.has(e.pointerId)) return;
    const prev = ptrs.get(e.pointerId);
    ptrs.set(e.pointerId, [e.clientX, e.clientY]);
    const r = svg.getBoundingClientRect();
    if (ptrs.size === 2 && pinch) {
      const [a, b] = [...ptrs.values()];
      const d = Math.hypot(a[0] - b[0], a[1] - b[1]);
      const nw = Math.min(B.w, Math.max(B.w / MAXZ, pinch.w * pinch.d / d));
      const mx = (a[0] + b[0]) / 2, my = (a[1] + b[1]) / 2;
      vb.w = nw; vb.h = nw * B.h / B.w;
      const u = Math.max(vb.w / r.width, vb.h / r.height);
      vb.x = pinch.c[0] - vb.w / 2 - (mx - r.left - r.width / 2) * u;
      vb.y = pinch.c[1] - vb.h / 2 - (my - r.top - r.height / 2) * u;
      moved = true; applyVB();
    } else if (ptrs.size === 1) {
      const dx = e.clientX - prev[0], dy = e.clientY - prev[1];
      const st = start.get(e.pointerId);
      if (!moved && st && Math.hypot(e.clientX - st[0], e.clientY - st[1]) < 8) return;   // a tap wobbles; it isn't a drag
      moved = true;
      svg.classList.add('drag');
      const u = Math.max(vb.w / r.width, vb.h / r.height);
      vb.x -= dx * u; vb.y -= dy * u;
      applyVB();
    }
  });
  const up = e => { ptrs.delete(e.pointerId); if (ptrs.size < 2) pinch = null; if (!ptrs.size) svg.classList.remove('drag'); };
  ['pointerup', 'pointercancel', 'pointerleave'].forEach(t => svg.addEventListener(t, up));
  svg.addEventListener('click', e => { if (!moved && e.target.closest('.ln') == null) select(null); });
  const centre = () => [vb.x + vb.w / 2, vb.y + vb.h / 2];
  $('zin').addEventListener('click', () => zoomAt(1.6, ...centre()));
  $('zout').addEventListener('click', () => zoomAt(1 / 1.6, ...centre()));
  $('zreset').addEventListener('click', () => { vb = {x: 0, y: 0, w: B.w, h: B.h}; applyVB(); });
  addEventListener('resize', applyVB);

  // ---- the timeline -----------------------------------------------------------------------------------------------
  const slider = $('slider');
  slider.min = H.start; slider.max = FUT; slider.step = 1;
  const eventYears = [...new Set([...H.lines.flatMap(l => l.ev.filter(e => !e.f).map(e => e.y)),
                                   ...H.ghosts.flatMap(g => g.ev.map(e => e.y))])].filter(y => y >= H.start && y <= H.now).sort((a, b) => a - b);
  const span = FUT - H.start;
  eventYears.forEach(y => $('ticks').append(el('i', {style: `left:${(y - H.start) / span * 100}%`})));
  const scaleYears = H.scale || [H.start, 1966, 1985, 2002].filter((y, i, a) => a.indexOf(y) === i);
  $('scale').append(...scaleYears.map(y => el('span', {style: `left:${(y - H.start) / span * 100}%`}, String(y))),
                    el('span', {style: 'left:100%'}, H.future));

  // The legend: drawn swatches, the same styles as the lines.
  const swatch = (cls, colour) => el('svg', {width: 30, height: 10, 'aria-hidden': 'true'},
    el('g', {class: 'ln ' + cls}, [el('path', {d: 'M3 5H27', class: 'case'}), el('path', {d: 'M3 5H27', class: 'main', stroke: colour})]));
  [['s-open', 'Open'], ['s-building', 'Under construction'], ['s-approved', 'Approved or proposed'], ['ghost', 'Cancelled, shelved or replaced'],
   ['s-closed', 'Closed']].forEach(([c, t]) => $('key').append(el('span', {}, [swatch(c, '#C8102E'), t])));
  const ghostKey = el('span', {}, [el('svg', {width: 14, height: 14, 'aria-hidden': 'true'}, el('g', {class: 'gh'}, el('circle', {cx: 7, cy: 7, r: 4.5, style: 'fill:var(--card)'}))), 'Platform built, never used']);
  if (H.ghosts.length) $('key').append(ghostKey);

  let year = H.now, sel = null, showGhosts = true;
  // Colour by: today's route colours (the default) or another scheme from history.json "colourBy" (e.g. who built it).
  const CB = H.colourBy;
  let cmode = CB ? CB.default : null;
  const colourOf = l => {
    const m = CB && CB.modes.find(m => m.id === cmode);
    if (!m || !m.field) return l.c;
    return (m.colours[l[m.field]] || {}).c || l.c;
  };

  const render = () => {
    H.lines.forEach(l => nodes[l.id].querySelector('.main').setAttribute('stroke', colourOf(l)));
    $('yr').textContent = yearName(year);
    $('year-name').textContent = year >= FUT ? 'the future (as planned)' : year;
    slider.value = year;
    slider.setAttribute('aria-valuetext', yearName(year));
    let km = 0; const names = new Set();
    H.lines.forEach(l => {
      const s = stageOf(l, year), g = nodes[l.id];
      const dead = DEAD.has(s);
      g.setAttribute('class', 'ln s-' + s + (dead ? ' ghost' : '') + (sel === l.id ? ' sel' : ''));
      g.style.display = (s === 'none' || (sel !== l.id && ((dead && !showGhosts) || !shown(l)))) ? 'none' : '';
      if (s === 'open') { km += l.km; l.st.forEach(st => names.add(st[2] + '@' + Math.round(st[0] / 4) + ',' + Math.round(st[1] / 4))); }   // names repeat in some cities: count places
    });
    linesG.classList.toggle('dim', !!sel && stageOf(byId[sel], year) !== 'none');
    H.ghosts.forEach((gh, i) => { ghostNodes[i].style.display = stageOf(gh, year) === 'none' ? 'none' : ''; });
    const dist = H.units === 'mi' ? `${Math.round(km * 0.621371)} MI` : `${Math.round(km)} KM`;
    $('stat').textContent = km ? `${dist}${names.size ? ' · ' + names.size + ' STATIONS' : ''} OPEN` : 'NO RAPID TRANSIT YET';
    renderYear(); renderCard(); renderIndex();
    const q = new URLSearchParams(location.search);
    q.set('y', year >= FUT ? 'future' : year); if (sel) q.set('line', sel); else q.delete('line');
    if (CB) { if (cmode === CB.default) q.delete('by'); else q.set('by', cmode); }
    const got = [...reachOn].sort().join(''); if (got === '234') q.delete('got'); else q.set('got', got || '0');
    history.replaceState(null, '', location.pathname + '?' + q.toString());
  };

  const pick = l => el('button', {type: 'button'}, l.name);
  const renderYear = () => {
    const rows = [];
    H.lines.forEach(l => l.ev.forEach(e => {
      if (shown(l) && (year >= FUT ? e.f : (!e.f && e.y === year))) rows.push({l, e});
    }));
    H.ghosts.forEach(g => g.ev.forEach(e => { if (year < FUT && e.y === year) rows.push({g, e}); }));
    rows.sort((a, b) => (a.e.d.length > 4 ? 0 : 1) - (b.e.d.length > 4 ? 0 : 1));
    const box = $('year-ev');
    if (!rows.length) {
      const nxt = eventYears.find(y => y > year);
      const msg = el('p', {class: 'empty'}, 'Nothing opened, closed or changed plans this year. ');
      if (nxt) {
        const b = el('button', {type: 'button'}, 'Jump to ' + nxt + ' →');
        b.addEventListener('click', () => { year = nxt; render(); });
        msg.append(b);
      }
      box.replaceChildren(msg);
      return;
    }
    box.replaceChildren(el('ul', {class: 'evs'}, rows.map(({l, g, e}) => {
      const head = l ? pick(l) : el('b', {}, g.n);
      if (l) head.addEventListener('click', () => select(l.id));
      return el('li', {}, [el('span', {class: 'dot', style: 'background:' + (l ? (DEAD.has(e.s) ? 'var(--muted)' : colourOf(l)) : 'var(--accent)')}),
        el('div', {}, [head, ' ', el('span', {class: 'when'}, e.d + ' · ' + (e.f ? 'Planned opening' : LABEL[e.s])), el('div', {}, e.t)])]);
    })));
  };

  const renderCard = () => {
    const card = $('card');
    if (!sel) {
      card.replaceChildren(el('h2', {}, 'Pick a line'),
        el('p', {class: 'sub'}, 'Tap a line on the map, an entry on the left or a name below for its whole story and sources. Tap it again, or anywhere else on the map, to let go.'));
      return;
    }
    const l = byId[sel], s = stageOf(l, year);
    const close = el('button', {type: 'button', class: 'close', 'aria-label': 'Close'}, 'Close');
    close.addEventListener('click', () => select(null));
    const now = l.ev.filter(e => e.f ? year >= FUT : e.y <= year).pop();
    const bits = [l.now, l.km ? (H.units === 'mi' ? (l.km * 0.621371).toFixed(1) + ' mi' : l.km + ' km') : null, l.mode === 'lrt' ? 'Light rail' : (l.mode === 'rt' ? 'Light metro' : l.mode === 'el' ? 'Elevated railway' : 'Subway')].filter(Boolean);
    card.replaceChildren(close,
      el('div', {class: 'head'}, [el('h3', {}, l.name), year < FUT ? el('span', {class: 'stage'}, LABEL[s] + ' in ' + year) : null]),
      l.group === 'unbuilt' ? el('div', {class: 'got'}, GOT[l.r]) : null,
      el('p', {class: 'sub'}, bits.join(' · ') + (l.approx ? '. Route drawn by hand from published descriptions: approximate.' : '')),
      el('ol', {class: 'hist'}, l.ev.map(e => el('li', {class: (e === now ? 'now' : '') + ((e.f ? year < FUT : e.y > year) ? ' later' : '')}, [
        el('div', {class: 'when'}, e.d + ' · ' + (e.f ? 'Planned opening' : LABEL[e.s])),
        el('div', {}, e.t),
        el('div', {class: 'src'}, ['Source: ', ...e.src.flatMap((k, i) => [i ? '; ' : '', el('a', {href: H.sources[k].u, rel: 'noopener', target: '_blank'}, H.sources[k].t)])]),
      ]))));
  };

  const span_ = l => {
    const ys = l.ev.filter(e => !e.f).map(e => e.y);
    const open = l.ev.find(e => e.s === 'open' && !e.f);
    if (l.group === 'built') return String(open ? open.y : ys[0]);
    return ys[0] === ys[ys.length - 1] ? String(ys[0]) : ys[0] + '–' + ys[ys.length - 1];
  };
  // A long group (more than 20 lines) folds into a summary with its count; open groups stay open across renders.
  const openGroups = new Set();
  const group = (g, t, list) => {
    const n = H.lines.filter(l => l.group === g).length;
    if (!n) return null;
    if (n <= 20) return el('div', {}, [el('h4', {}, t), list]);
    const d = el('details', {class: 'grp'}, [el('summary', {}, el('h4', {}, `${t} · ${n}`)), list]);
    if (openGroups.has(g) || (sel && byId[sel].group === g)) d.open = true;
    d.addEventListener('toggle', () => d.open ? openGroups.add(g) : openGroups.delete(g));
    return d;
  };
  const renderIndex = () => {
    $('idx').replaceChildren(...GROUPS.map(([g, t]) => group(g, t, el('ul', {}, H.lines.filter(l => l.group === g).map(l => {
      const b = el('button', {type: 'button', 'aria-current': sel === l.id ? 'true' : null}, [swatch(g === 'built' ? 's-open' : g === 'building' ? 's-building' : 's-approved', colourOf(l)), el('span', {}, l.name), el('span', {class: 'yrs'}, span_(l))]);
      b.addEventListener('click', () => {
        if (sel === l.id) return select(null);   // tap the selected name again to let go
        select(l.id, true); $('mapbox').scrollIntoView({behavior: 'smooth', block: 'start'});
      });
      return el('li', {}, b);
    })))).filter(Boolean));
  };

  // Select a line. From the index, move the timeline to a year when the line is on the map if it isn't now.
  function select(id, jump) {
    sel = id;
    if (id && jump) {
      const l = byId[id];
      if (stageOf(l, year) === 'none' || (DEAD.has(stageOf(l, year)) && !showGhosts)) {
        // Its opening, or else the last year it was alive (the dig, the approval) before it died.
        const open = l.ev.find(e => e.s === 'open' && !e.f);
        const alive = l.ev.filter(e => !e.f && !DEAD.has(e.s)).pop();
        year = open ? open.y : (alive || l.ev[0]).y;
      }
    }
    if (id) linesG.append(nodes[id]);   // to the front
    render();
  }

  slider.addEventListener('input', () => { stop(); year = +slider.value; render(); });
  const stepTo = dir => {
    stop();
    const list = [...eventYears, FUT];
    year = dir > 0 ? (list.find(y => y > year) ?? FUT) : ([...list].reverse().find(y => y < year) ?? H.start);
    render();
  };
  $('prev').addEventListener('click', () => stepTo(-1));
  $('next').addEventListener('click', () => stepTo(1));
  let timer = null;
  const stop = () => { if (timer) { clearInterval(timer); timer = null; $('play').textContent = '▶ Play'; } };
  $('play').addEventListener('click', () => {
    if (timer) return stop();
    const list = [...eventYears, FUT];
    if (year >= H.now) year = list[0];   // from today (the default view) or the future: start at the beginning
    else if (!list.includes(year)) year = list.find(y => y > year) ?? list[0];
    render();
    $('play').textContent = '❚❚ Pause';
    timer = setInterval(() => {
      const nxt = list.find(y => y > year);
      if (nxt == null) return stop();
      year = nxt; render();
      if (year >= FUT) stop();
    }, 1300);
  });
  addEventListener('keydown', e => { if (e.key === 'Escape' && sel) select(null); });
  $('ghosts').addEventListener('click', () => {
    showGhosts = !showGhosts;
    $('ghosts').setAttribute('aria-pressed', showGhosts);
    render();
  });

  // The "how far it got" chips: one per level that has lines, with a count.
  REACH.forEach(([n, , name, help]) => {
    const count = H.lines.filter(l => l.group === 'unbuilt' && l.r === n).length;
    if (!count) return;
    const b = el('button', {type: 'button', class: 'chip', 'aria-pressed': reachOn.has(n), title: help, 'data-r': n}, [name, el('span', {class: 'n'}, String(count))]);
    b.addEventListener('click', () => {
      reachOn.has(n) ? reachOn.delete(n) : reachOn.add(n);
      b.setAttribute('aria-pressed', reachOn.has(n));
      if (sel && !shown(byId[sel])) sel = null;
      render();
    });
    $('reach').append(b);
  });
  if (CB) {
    $('colourby').hidden = false;
    const key = () => {
      const m = CB.modes.find(m => m.id === cmode);
      $('opkey').hidden = !m.field;
      if (m.field) $('opkey').replaceChildren(...Object.values(m.colours).map(v => el('span', {}, [el('i', {style: 'background:' + v.c}), v.name])));
    };
    CB.modes.forEach(m => {
      const b = el('button', {type: 'button', class: 'chip', 'aria-pressed': m.id === cmode, 'data-c': m.id}, m.label);
      b.addEventListener('click', () => {
        cmode = m.id;
        $('colourby').querySelectorAll('[data-c]').forEach(x => x.setAttribute('aria-pressed', x.dataset.c === cmode));
        key(); render();
      });
      $('colourby').append(b);
    });
    key();
  }
  if (H.later) {
    $('later').hidden = false;
    $('later').append(el('h2', {id: 'later-h'}, H.later.title), el('p', {class: 'sub'}, H.later.lede),
      el('ul', {}, H.later.items.map(([t, d]) => el('li', {}, [el('b', {}, t), el('span', {}, d)]))));
  }

  const q = new URLSearchParams(location.search);
  if (q.get('y') === 'future') year = FUT;
  else if (+q.get('y') >= H.start && +q.get('y') <= H.now) year = +q.get('y');
  if (/^[0-4]+$/.test(q.get('got') || '')) {
    reachOn = new Set([...q.get('got')].map(Number).filter(Boolean));
    $('reach').querySelectorAll('[data-r]').forEach(b => b.setAttribute('aria-pressed', reachOn.has(+b.dataset.r)));
  }
  if (CB && CB.modes.some(m => m.id === q.get('by'))) {
    cmode = q.get('by');
    $('colourby').querySelectorAll('[data-c]').forEach(x => x.setAttribute('aria-pressed', x.dataset.c === cmode));
    $('colourby').querySelector('[data-c]') && $('opkey') && (() => { const m = CB.modes.find(m => m.id === cmode); $('opkey').hidden = !m.field; if (m.field) $('opkey').replaceChildren(...Object.values(m.colours).map(v => el('span', {}, [el('i', {style: 'background:' + v.c}), v.name]))); })();
  }
  if (q.get('line') && byId[q.get('line')]) sel = q.get('line');
  if (sel) linesG.append(nodes[sel]);
  render();
  applyVB();
})();
</script>
<script defer src="/stats.js"></script>
</body>
</html>
