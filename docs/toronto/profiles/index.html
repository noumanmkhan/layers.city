<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Unreleased (profiles branch). Keep noindex until launch. -->
<meta name="robots" content="noindex, nofollow">
<title>Neighbourhood profiles · Toronto · Layers.City</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
@font-face{font-family:'Archivo';font-weight:700;font-display:swap;src:url(/fonts/archivo-latin-700-normal.woff2) format('woff2')}
@font-face{font-family:'Archivo';font-weight:800;font-display:swap;src:url(/fonts/archivo-latin-800-normal.woff2) format('woff2')}
@font-face{font-family:'IBM Plex Sans';font-weight:400;font-display:swap;src:url(/fonts/ibm-plex-sans-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:'IBM Plex Sans';font-weight:500;font-display:swap;src:url(/fonts/ibm-plex-sans-latin-500-normal.woff2) format('woff2')}
:root{
  --bg:#F7F4F3; --card:#FFFFFF; --ink:#1A1414; --muted:#5E5452; --rule:#E4DCDA; --accent:#C8102E;
  --hood:#FBE3E5; --land:#F2EEEC; --park:#4E9A57; --bike:#8DBF94; --car:#C8102E;
  --display:'Archivo',system-ui,sans-serif; --body:'IBM Plex Sans',system-ui,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.4}
.bar{max-width:8.5in;margin:0 auto;padding:16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.bar label{font-weight:500}
.bar select{font:inherit;padding:8px 10px;border:1px solid var(--rule);border-radius:8px;background:var(--card);min-height:44px;flex:1 1 240px;max-width:360px}
.bar button{font:inherit;font-weight:500;padding:8px 14px;border:1px solid var(--ink);border-radius:8px;background:var(--card);min-height:44px;cursor:pointer}
.sheet{max-width:8.5in;margin:0 auto 32px;background:var(--card);padding:0.45in;display:flex;flex-direction:column;gap:14px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.top{display:flex;flex-wrap:wrap;gap:6px 16px;justify-content:space-between;align-items:center;font-size:11px;letter-spacing:.12em;font-weight:500;color:var(--muted)}
.brand{display:flex;gap:8px;align-items:center;font-family:var(--display);font-weight:800;font-size:15px;letter-spacing:0;color:var(--ink)}
h1{margin:4px 0 0;font-family:var(--display);font-weight:800;font-size:48px;line-height:1;letter-spacing:-.02em}
.sub{color:var(--muted);font-size:13px}
.rule{height:3px;width:64px;background:var(--accent)}
.hero{display:grid;grid-template-columns:minmax(0,1.9fr) minmax(0,1fr);gap:14px}
.panel{border:1px solid var(--rule);border-radius:10px;padding:12px 14px;background:var(--card)}
.map{padding:0;overflow:hidden;background:var(--land)}
.map svg{display:block;width:100%;height:auto;max-height:4.4in}
.k{font-size:11px;font-weight:500;letter-spacing:.1em;color:var(--accent);text-transform:uppercase;margin-bottom:4px}
.glance .row{display:flex;align-items:baseline;gap:10px;padding:7px 0;border-bottom:1px solid var(--rule)}
.glance .row:last-child{border-bottom:0}
.glance b{font-family:var(--display);font-weight:800;font-size:26px;line-height:1;color:var(--accent);min-width:84px}
.quads{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 14px}
.q .row{display:flex;justify-content:space-between;gap:12px;padding:4px 0;border-bottom:1px solid var(--rule);font-size:12.5px}
.q .row:last-child{border-bottom:0}
.q .row span{color:var(--muted)}
.q .row b{font-weight:500;text-align:right}
.foot{display:flex;justify-content:space-between;gap:16px;font-size:10.5px;color:var(--muted)}
.foot span:last-child{white-space:nowrap}
.msg{max-width:8.5in;margin:40px auto;padding:0 16px;color:var(--muted)}
@media (max-width:640px){
  .sheet{padding:18px;border-radius:0}
  h1{font-size:36px}
  .hero,.quads{grid-template-columns:minmax(0,1fr)}
  .foot{flex-direction:column}
}
@page{size:letter portrait;margin:0.4in}
@media print{
  body{background:#fff}
  .bar{display:none}
  .sheet{max-width:none;margin:0;padding:0;box-shadow:none;break-inside:avoid}
  .sheet{gap:10px;font-size:12px}
  h1{font-size:38px}
  .map svg{max-height:3.5in}
  .glance .row{padding:5px 0}
  .glance b{font-size:22px}
  .q .row{font-size:11.5px;padding:3px 0}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>
<div class="bar">
  <label for="pick">Neighbourhood</label>
  <select id="pick"><option value="">Loading…</option></select>
  <button type="button" id="print">Print</button>
</div>
<p class="msg" id="msg" hidden></p>
<main class="sheet" id="sheet" hidden>
  <div class="top">
    <span class="brand">
      <svg width="16" height="20" viewBox="0 0 18 22" aria-hidden="true"><path d="M9 1C4.6 1 1.5 4.2 1.5 8.2 1.5 13 9 21 9 21S16.5 13 16.5 8.2C16.5 4.2 13.4 1 9 1Z" fill="#C8102E"/><path d="M4.8 8.4 9 6.2l4.2 2.2L9 10.6Z" fill="#fff"/><path d="M4.8 10.6 9 12.8l4.2-2.2" fill="none" stroke="#fff" stroke-width="1.2"/></svg>
      Layers.City
    </span>
    <span>NEIGHBOURHOOD PROFILE · TORONTO</span>
  </div>
  <div>
    <h1 id="name"></h1>
    <div class="sub">City of Toronto neighbourhood boundary</div>
  </div>
  <div class="rule"></div>
  <section class="hero">
    <div class="panel map" id="map"></div>
    <div class="panel glance"><div class="k">At a glance</div><div id="glance"></div></div>
  </section>
  <section class="quads" id="quads"></section>
  <div class="foot">
    <span>Boundaries: City of Toronto Open Data · Transit: TTC · Bike Share: Toronto Parking Authority · Census figures: 2021 · Walk times are approximate</span>
    <span id="asof"></span>
  </div>
</main>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const NS = 'http://www.w3.org/2000/svg';
  const el = (tag, attrs = {}, text) => {
    const n = tag.includes(':') || ['svg','path','circle','text','rect','polygon','polyline','g'].includes(tag)
      ? document.createElementNS(NS, tag) : document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, v);
    if (text != null) n.textContent = text;
    return n;
  };
  const d = pts => 'M' + pts.map(p => p.join(' ')).join('L');

  function drawMap(m) {
    const svg = el('svg', { viewBox: `0 0 ${m.w} ${m.h}`, role: 'img', 'aria-label': 'Map of the neighbourhood with transit, bike lanes and parks' });
    svg.append(el('rect', { width: m.w, height: m.h, fill: 'var(--land)' }));
    m.outline.forEach(r => svg.append(el('path', { d: d(r) + 'Z', fill: 'var(--hood)', stroke: 'var(--accent)', 'stroke-width': 2 })));
    m.bike.forEach(p => svg.append(el('path', { d: d(p), fill: 'none', stroke: 'var(--bike)', 'stroke-width': 1.6 })));
    m.streetcar.forEach(p => svg.append(el('path', { d: d(p), fill: 'none', stroke: 'var(--car)', 'stroke-width': 2.4, 'stroke-opacity': .8 })));
    m.subway.forEach(l => l.paths.forEach(p => svg.append(el('path', { d: d(p), fill: 'none', stroke: l.color || '#333', 'stroke-width': 5, 'stroke-linecap': 'round' }))));
    m.parks.forEach(([x, y]) => svg.append(el('circle', { cx: x, cy: y, r: 3.2, fill: 'var(--park)' })));
    m.bikeshare.forEach(([x, y]) => svg.append(el('rect', { x: x - 2, y: y - 2, width: 4, height: 4, fill: '#1A1414', 'fill-opacity': .55 })));
    m.stations.forEach(s => {
      svg.append(el('circle', { cx: s.x, cy: s.y, r: 5.5, fill: '#fff', stroke: '#1A1414', 'stroke-width': 2 }));
      const left = s.x > m.w - 110;   // label on the left near the right edge, so it isn't cut off
      svg.append(el('text', { x: left ? s.x - 8 : s.x + 8, y: s.y + 4, 'text-anchor': left ? 'end' : 'start', 'font-size': 12, 'font-weight': 500, fill: '#1A1414',
        stroke: '#fff', 'stroke-width': 3, 'paint-order': 'stroke', 'font-family': 'IBM Plex Sans, sans-serif' }, s.name));
    });
    const lg = el('g', { transform: 'translate(10 10)' });
    lg.append(el('rect', { width: 132, height: 70, rx: 6, fill: '#fff', 'fill-opacity': .92 }));
    [['line', '#FFC425', 'Subway'], ['line', 'var(--car)', 'Streetcar'], ['line', 'var(--bike)', 'Bike lane or trail'], ['dot', 'var(--park)', 'Park']]
      .forEach(([kind, c, label], i) => {
        const y = 14 + i * 15;
        lg.append(kind === 'line' ? el('rect', { x: 8, y: y - 2, width: 16, height: 4, fill: c }) : el('circle', { cx: 16, cy: y, r: 3.5, fill: c }));
        lg.append(el('text', { x: 30, y: y + 4, 'font-size': 11, fill: '#1A1414', 'font-family': 'IBM Plex Sans, sans-serif' }, label));
      });
    svg.append(lg);
    $('map').replaceChildren(svg);
  }

  function render(p) {
    document.title = `${p.name} · Neighbourhood profile · Layers.City`;
    $('name').textContent = p.name;
    drawMap(p.map);
    $('glance').replaceChildren(...p.glance.map(([v, label]) => {
      const r = el('div', { class: 'row' }); r.append(el('b', {}, v), el('span', {}, label)); return r;
    }));
    $('quads').replaceChildren(...p.sections.map((s, i) => {
      const q = el('div', { class: 'panel q' });
      q.append(el('div', { class: 'k' }, `0${i + 1} · ${s.title}`));
      s.rows.forEach(([k, v]) => { const r = el('div', { class: 'row' }); r.append(el('span', {}, k), el('b', {}, v)); q.append(r); });
      return q;
    }));
    $('asof').textContent = `Data as of ${p.asof}`;
    $('sheet').hidden = false; $('msg').hidden = true;
  }

  function fail(text) { $('sheet').hidden = true; $('msg').hidden = false; $('msg').textContent = text; }

  async function show(slug) {
    if (!slug) return fail('Pick a neighbourhood to see its profile.');
    try {
      const r = await fetch(`data/${encodeURIComponent(slug)}.json`);
      if (!r.ok) throw new Error(r.status);
      render(await r.json());
    } catch { fail('No profile found for that neighbourhood.'); }
  }

  async function init() {
    const idx = await (await fetch('data/index.json')).json();
    const sel = $('pick');
    sel.replaceChildren(el('option', { value: '' }, 'Choose a neighbourhood'), ...idx.places.map(p => el('option', { value: p.slug }, p.name)));
    const start = new URLSearchParams(location.search).get('n') || '';
    sel.value = start;
    sel.addEventListener('change', () => {
      const u = new URL(location); sel.value ? u.searchParams.set('n', sel.value) : u.searchParams.delete('n');
      history.replaceState(null, '', u); show(sel.value);
    });
    $('print').addEventListener('click', () => window.print());
    show(start);
  }
  init().catch(() => fail('Profiles could not load.'));
})();
</script>
</body>
</html>
