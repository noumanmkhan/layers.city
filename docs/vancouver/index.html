html,body{height:100%}
[hidden]{display:none!important}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.4;overflow:hidden}
#app{position:relative;height:100%}
#map{position:absolute;inset:0;background:var(--water)}
.leaflet-container{background:var(--water);font-family:var(--font)}
.leaflet-container :focus-visible{outline:2px solid var(--focus)}
.leaflet-control-zoom{box-shadow:var(--shadow)!important;border:1px solid var(--rule)!important}
.leaflet-bottom.leaflet-left .leaflet-control-zoom{margin:0 0 calc(var(--attr-h,18px) + 8px) 332px}
@media (max-width:760px){.leaflet-control-zoom{display:none}}
.leaflet-control-zoom a{background:var(--panel)!important;color:var(--ink)!important;border-color:var(--rule)!important}
.leaflet-bar{box-shadow:var(--shadow)!important;border:none!important}
.leaflet-control-attribution{background:color-mix(in srgb,var(--panel) 85%,transparent)!important;color:var(--ink-3)!important;font-size:10.5px}
.leaflet-control-attribution a{color:var(--ink-2)!important}

/* ---------- panel ---------- */
#panel{position:absolute;z-index:1000;top:16px;left:16px;bottom:calc(var(--attr-h,18px) + 8px);width:300px;display:flex;flex-direction:column;
  background:var(--panel);border-radius:14px;box-shadow:var(--shadow);overflow:hidden;overflow:clip}
.ph{padding:18px 18px 12px;border-bottom:1px solid var(--rule)}
.ph h1{margin:0;font-size:21px;font-weight:800;letter-spacing:-.02em;text-wrap:balance}
.ph p{margin:4px 0 0;color:var(--ink-2);font-size:12.5px}
.ph .grab{display:none}
/* City switcher: a native dropdown laid invisibly over the title, so phones get their own picker. */
.hub-link{display:flex;width:max-content;align-items:center;gap:3px;margin:0 0 6px -2px;font-size:11.5px;font-weight:600;color:var(--ink-3);text-decoration:none}
.hub-link svg{width:13px;height:13px}
.hub-link .mk{width:12px;height:15px;margin:0 2px 0 1px}
.hub-link:hover{color:var(--accent)}
.hub-link:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:4px}
.switch{position:relative;display:inline-block;max-width:100%}
.switch h1{display:flex;align-items:center;gap:6px}
.switch .chev{flex:none;width:16px;height:16px;color:var(--ink-3);transition:transform .15s,color .15s}
.switch:hover .chev{color:var(--accent);transform:translateY(1px)}
.switch select{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:16px;appearance:none;border:none}
.switch:focus-within h1{outline:2px solid var(--focus);outline-offset:3px;border-radius:6px}
#layers{overflow:auto;padding:6px 10px 14px;flex:1;min-height:0}
.grp{margin-top:6px}
.grp h2{margin:4px 0 2px;font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
.grp .gh{display:flex;align-items:center;gap:8px;width:100%;font:inherit;letter-spacing:inherit;text-transform:inherit;color:inherit;background:none;border:none;border-radius:7px;padding:6px 8px;cursor:pointer;text-align:left}
.grp .gh:hover{background:var(--pill-bg);color:var(--ink-2)}
.grp .gh:focus-visible{outline:2px solid var(--focus);outline-offset:1px}
.grp .gh span{flex:1}
.grp .gh .gon{display:none;font-size:10.5px;font-weight:600;letter-spacing:0;text-transform:none;color:var(--accent)}
.grp.folded .gh .gon{display:inline}
.grp .gh svg{flex:none;width:14px;height:14px;transition:transform .15s}
.grp.folded .gh svg{transform:rotate(-90deg)}
.grp .gb[hidden]{display:none}
.row{position:relative;display:flex;align-items:flex-start;gap:10px;padding:8px;border-radius:9px;cursor:pointer;user-select:none}
.row:hover{background:var(--pill-bg)}
/* The real checkbox sits invisibly over its own switch, so focusing it never scrolls anything but the list. */
.row input{position:absolute;top:10px;right:8px;width:32px;height:18px;margin:0;opacity:0;pointer-events:none}
.sw{flex:none;width:30px;height:22px;border-radius:6px;position:relative;overflow:hidden;border:1px solid var(--rule)}
.tx{flex:1;min-width:0}
.tx b{display:block;font-weight:600;font-size:13.5px}
.tx span{display:block;color:var(--ink-3);font-size:11.5px;margin-top:1px}
.tg{flex:none;width:32px;height:18px;border-radius:9px;background:var(--rule);position:relative;margin-top:2px;transition:background .15s}
.tg::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:var(--panel);box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .15s}
.row input:checked ~ .tg{background:var(--accent-2)}
.row input:checked ~ .tg::after{transform:translateX(14px)}
.row input:focus-visible ~ .tg{outline:2px solid var(--focus);outline-offset:2px}
.sub{margin:-4px 0 4px 48px;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-2);cursor:pointer}
.sub input{accent-color:var(--accent-2);margin:0}
.pf{padding:10px 18px 14px;border-top:1px solid var(--rule);font-size:11px;color:var(--ink-3)}
.pf button{font:inherit;color:var(--ink-2);background:none;border:1px solid var(--rule);border-radius:7px;padding:4px 7px;cursor:pointer}
.pf button:hover{color:var(--ink)}
.pfb{display:flex;gap:5px;flex-wrap:wrap}
.pf{position:relative}
.imgmenu{position:absolute;left:12px;right:12px;bottom:calc(100% + 6px);background:var(--panel);border:1px solid var(--rule);border-radius:12px;box-shadow:var(--shadow);padding:12px;display:grid;gap:4px;font-size:12px;color:var(--ink-2);z-index:5}
.imgmenu[hidden]{display:none}
.imgmenu b{color:var(--ink);font-size:12.5px}
.imgmenu div{display:flex;gap:6px;margin-top:6px}
.pf .imgmenu button{flex:1;padding:6px 8px;font-weight:600;color:var(--ink)}
.imgmenu .shape{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:6px}
.pf .imgmenu .shape button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:7px 2px 6px;font-size:11px;font-weight:500;color:var(--ink-2)}
.pf .imgmenu .shape button[aria-checked="true"]{background:var(--pill-bg);color:var(--ink);font-weight:700;border-color:var(--ink-3)}
.shape i{display:block;border:1.6px solid currentColor;border-radius:2px;height:20px}
.shape .sh-wide{width:30px;height:17px;margin:1.5px 0}.shape .sh-square{width:20px}.shape .sh-portrait{width:16px}.shape .sh-story{width:11px}
/* Desktop: the layer panel folds away to a small "Layers" button, leaving the whole map. */
.ph{position:relative}
.fold{position:absolute;top:12px;right:12px;width:28px;height:28px;display:grid;place-items:center;border:none;border-radius:7px;background:none;color:var(--ink-3);cursor:pointer}
.fold:hover{background:var(--pill-bg);color:var(--ink)}
.fold svg{width:15px;height:15px}
#panel.folded{display:none}
#unfold{position:absolute;z-index:1000;top:16px;left:16px;display:flex;align-items:center;gap:7px;font:inherit;font-size:13px;font-weight:600;color:var(--ink);background:var(--panel);border:none;border-radius:10px;box-shadow:var(--shadow);padding:9px 13px;cursor:pointer}
#unfold[hidden]{display:none}
#unfold svg{width:15px;height:15px}
#busy{position:fixed;inset:0;z-index:3000;display:grid;place-items:center;background:var(--bg)}
#busy[hidden]{display:none}
#busy span{font-size:14px;font-weight:600;color:var(--ink-2)}
#toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,8px);background:var(--ink);color:var(--panel);font-size:12.5px;font-weight:600;padding:7px 12px;border-radius:8px;opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;z-index:2000}
#toast.on{opacity:1;transform:translate(-50%,0)}
.pf{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:8px;padding:2px;gap:2px}
.pf .seg button{border:none;border-radius:6px;padding:4px 8px;font-size:11.5px}
.pf .seg button[aria-checked="true"]{background:var(--pill-bg);color:var(--ink);font-weight:600}

/* swatches */
/* each city colours its own fill layers, transit lines and their swatches (cities/<city>/city.css) */
.sw.k-units{background:var(--city);background-image:linear-gradient(var(--nbhd) 1px,transparent 1px),linear-gradient(90deg,var(--nbhd) 1px,transparent 1px);background-size:9px 8px;background-position:3px 3px}
.sw.k-knownas{background:var(--city);display:grid;place-items:center;font-size:9px;font-weight:700;color:var(--cult);font-style:italic}
.sw.k-city{background:var(--city);box-shadow:inset 0 0 0 2px var(--ward)}
.sw.k-state{background:var(--city);background-image:repeating-linear-gradient(90deg,var(--prov) 0 4px,transparent 4px 7px);background-size:100% 2px;background-repeat:no-repeat;background-position:0 50%}
.sw.k-national{background:var(--city);box-shadow:inset 0 0 0 2px var(--fed)}
.sw.k-districts{background:color-mix(in srgb,var(--hd) 16%,var(--city));box-shadow:inset 0 0 0 1.5px var(--hd)}
.sw.k-boards{background:var(--city);box-shadow:inset 0 0 0 2px var(--sbw)}
.sw.k-parks{background:color-mix(in srgb,var(--park) 40%,var(--city));box-shadow:inset 0 0 0 1px var(--park)}
.sw.k-patches{background:color-mix(in srgb,var(--bia) 45%,var(--city))}
.sw.k-patches.permit{background:color-mix(in srgb,var(--permit) 22%,var(--city));box-shadow:inset 0 0 0 1.5px var(--permit)}
.sw.k-spots{display:flex;align-items:center;justify-content:center;background:var(--city)}
.sw.k-streets{background:var(--city);background-image:linear-gradient(var(--st-case),var(--st-case)),linear-gradient(var(--st),var(--st));background-size:100% 5px,100% 3px;background-position:0 50%,0 50%;background-repeat:no-repeat}
.sw.k-highways{background:var(--city);background-image:linear-gradient(var(--hwy-case),var(--hwy-case)),linear-gradient(var(--hwy),var(--hwy));background-size:100% 6px,100% 2px;background-position:0 50%,0 50%;background-repeat:no-repeat}
.sw.k-badges{background:var(--city);display:grid;place-items:center;color:var(--accent)}
.sw.k-badges svg{width:15px;height:15px}
/* Neighbourhood badges: a faint drawing in brand ink, over the street lines but under outlines and every label. Knockouts are masked
   out, so the map shows through them. */
.bdg{position:absolute;left:0;top:0;transform:translate(-50%,-50%);overflow:visible;display:block;opacity:var(--bdg-op,.45)}
.bdg .bd-m{fill:var(--accent)}
.bdg .bd-ms{fill:none;stroke:var(--accent);stroke-linecap:round}
.sw.k-landmarks{background:var(--panel);display:grid;place-items:center;color:var(--lm-culture)}
.sw.k-landmarks svg{width:14px;height:14px}

/* ---------- map styling (CSS overrides Leaflet's SVG attributes, so both themes work) ---------- */
.base-out{fill:var(--land-out);fill-opacity:1;stroke:var(--land-out-line);stroke-width:1}
.base-far{fill:var(--land-far);fill-opacity:1;stroke:none}
.base-city{fill:var(--city);fill-opacity:1;stroke:var(--city-line);stroke-width:1.6}

#side>*{pointer-events:auto;flex:none}
#here{background:var(--panel);border-radius:14px;box-shadow:var(--shadow);flex:0 1 auto;min-height:0;overflow-x:hidden;overflow-y:auto;overscroll-behavior:contain;
  scrollbar-width:thin;scrollbar-color:transparent transparent;transition:scrollbar-color .2s}
#here:hover,#here:focus-within,#here.scrolling{scrollbar-color:var(--scroll-thumb) transparent}
#here::-webkit-scrollbar{width:10px}
#here::-webkit-scrollbar-track{background:transparent;margin:14px 0}
#here::-webkit-scrollbar-thumb{background:transparent;border:3px solid transparent;border-radius:6px;background-clip:padding-box}
#here:hover::-webkit-scrollbar-thumb,#here.scrolling::-webkit-scrollbar-thumb{background-color:var(--scroll-thumb)}
#here .hh{position:sticky;top:0;z-index:2;background:var(--panel);transition:box-shadow .15s}
#here.scrolled .hh{box-shadow:0 1px 0 var(--rule)}
#search{position:relative;background:var(--panel);border-radius:14px;box-shadow:var(--shadow)}
#search form{display:flex;align-items:center;gap:8px;padding:6px 6px 6px 14px}
#search svg{flex:none;width:16px;height:16px;color:var(--ink-3)}
#q{flex:1;min-width:0;font:500 14px/1.2 var(--font);color:var(--ink);background:none;border:none;outline:none;padding:8px 0}
/* iPhone Safari zooms the page into any text field set under 16px, and doesn't zoom back out: touch screens get 16px. */
@media (pointer:coarse){#q,.focus select{font-size:16px}}
#q::placeholder{color:var(--ink-3)}
#search:focus-within{box-shadow:var(--shadow),0 0 0 2px var(--focus)}
#locate{flex:none;display:grid;place-items:center;width:34px;height:32px;border:1px solid var(--rule);border-radius:9px;background:none;color:var(--accent);cursor:pointer;padding:0}
#search #locate svg{width:18px;height:18px;color:var(--accent)}
#locate.busy svg{animation:locpulse 1s ease-in-out infinite}
@keyframes locpulse{50%{opacity:.3}}
.pin.me{background:#2F7FD8;box-shadow:0 0 0 7px rgba(47,127,216,.28),0 2px 8px rgba(0,0,0,.4)}
.me-ring{fill:#2F7FD8;fill-opacity:.1;stroke:#2F7FD8;stroke-opacity:.5;stroke-width:1.5}
#go{flex:none;font:600 12.5px/1 var(--font);color:#fff;background:var(--accent);border:none;border-radius:9px;padding:9px 12px;cursor:pointer}
#go:disabled{opacity:.6;cursor:progress}
#results{list-style:none;margin:0;padding:4px 6px 6px;border-top:1px solid var(--rule)}
#results li button{display:block;width:100%;text-align:left;font:500 13px/1.3 var(--font);color:var(--ink);background:none;border:none;border-radius:8px;padding:8px 10px;cursor:pointer}
#results li button:hover,#results li button:focus-visible{background:var(--pill-bg);outline:none}
#results li button span{display:block;color:var(--ink-3);font-size:11.5px;margin-top:1px}
#results .msg{padding:8px 10px;color:var(--ink-2);font-size:12.5px}
.credit{padding:0 16px 8px;font-size:10.5px;color:var(--ink-3)}
.hh{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding:14px 16px 10px}
.hh small{display:block;font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
.hh strong{display:block;font-size:15px;font-weight:700;margin-top:2px}
.hb{display:flex;gap:6px;flex:none}
.hh .share{display:grid;place-items:center;padding:0}
.hh .dir{display:grid;place-items:center;padding:0}
.hh .dir svg{width:16px;height:16px}
/* Directions: an icon after a place's name on the card, a text button in the vote box, and a small menu on Apple devices. */
.dir-row{display:inline-flex!important;align-items:center;gap:6px;margin:0!important;color:inherit!important;font-size:inherit!important}
.dir-row .dir{flex:none;display:grid;place-items:center;width:22px;height:22px;padding:0;border:none;border-radius:6px;background:var(--pill-bg);color:var(--ink-2);cursor:pointer}
.dir-row .dir svg{width:13px;height:13px}
.dir:hover,.dir-row .dir:hover{color:var(--accent)}
.dir:focus-visible,.dir-t:focus-visible,.dirpop button:focus-visible{outline:2px solid var(--focus);outline-offset:1px}
.vote-acts button.dir-t{background:none;color:var(--accent);padding:0}
.vote-acts button.dir-t:hover{text-decoration:underline}
.dirpop{position:fixed;z-index:3000;display:grid;gap:2px;min-width:160px;padding:6px;border-radius:10px;background:var(--panel);border:1px solid var(--rule);box-shadow:0 8px 24px rgba(0,0,0,.22)}
.dirpop small{padding:4px 8px 2px;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.dirpop button{font:inherit;font-size:13px;font-weight:600;text-align:left;padding:8px;border:none;border-radius:7px;background:none;color:var(--ink);cursor:pointer}
.dirpop button:hover{background:var(--pill-bg)}
.hh .share svg{width:15px;height:15px}
.hh button{flex:none;font:inherit;font-size:18px;line-height:1;width:28px;height:28px;border-radius:7px;border:none;background:var(--pill-bg);color:var(--ink-2);cursor:pointer}
.pills{display:flex;flex-wrap:wrap;gap:6px;padding:0 16px 12px}
.tower{margin:0 16px 12px;padding:10px 12px;border:1px solid var(--rule);border-radius:10px;display:grid;gap:9px}
.tw-what{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;color:var(--ink)}
.tw-what .lm.tw{transform:none} .tw-what em{font-style:normal;font-weight:500;color:var(--ink-2);margin-left:6px}
.tw-what em::before{content:"·";color:var(--ink-3);margin-right:6px}
.tw-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:0}
.tw-stats dt{font-size:10.5px;color:var(--ink-3);letter-spacing:.02em}
.tw-stats dd{margin:1px 0 0;font-size:15px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}
.tw-stats dd small{display:block;font-size:11px;font-weight:400;color:var(--ink-3)}
.tw-facts{margin:0;padding:0;list-style:none;display:grid;gap:4px;font-size:12.5px;line-height:1.4;color:var(--ink)}
.tw-facts li{display:flex;gap:7px} .tw-facts li::before{content:"";flex:none;width:5px;height:5px;margin-top:7px;border-radius:50%;background:var(--accent)}
.tw-src{font-size:11px;color:var(--ink-3)} .tw-src a{color:inherit}
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 10px 5px 8px;border-radius:999px;background:var(--pill-bg);font-weight:600;font-size:12.5px}
.pill i{width:9px;height:9px;border-radius:50%;flex:none}
dl.facts{margin:0;padding:10px 16px 14px;border-top:1px solid var(--rule);display:grid;grid-template-columns:auto 1fr;gap:5px 12px;font-size:12.5px}
dl.facts dt{color:var(--ink-3)}
dl.facts dd{margin:0;font-weight:500;min-width:0}
.sec{border-top:1px solid var(--rule)}
.sec>summary{list-style:none;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 16px;cursor:pointer;font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);user-select:none}
.sec>summary::-webkit-details-marker{display:none}
.sec>summary::after{content:'';width:7px;height:7px;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:rotate(45deg) translate(-2px,-2px);transition:transform .15s}
.sec[open]>summary::after{transform:rotate(-135deg) translate(-1px,-1px)}
.sec>summary:hover{color:var(--ink-2)}
.sec>summary:focus-visible{outline:2px solid var(--focus);outline-offset:-2px}
.sec dl.facts{border-top:none;padding-top:0}
.reps a{color:var(--ink);font-weight:600;text-decoration:underline;text-decoration-color:var(--rule);text-underline-offset:2px}
.reps a:hover{text-decoration-color:currentColor}
.reps a::after{content:' \2197';font-size:10px;color:var(--ink-3)}
.reps dd b{font-weight:600}
.reps details.cands summary{cursor:pointer;color:var(--ink);font-weight:600}
.reps details.cands > span{margin:2px 0 3px;color:var(--ink-2)}
.reps details.cands > .cand-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(10.5em,1fr));gap:2px 12px;margin:4px 0 4px}
.cand-grid i{font-style:normal;color:var(--ink-2);line-height:1.35}
/* Opened, a long list takes the card's full width (two columns), with the row's label on its own line above */
.live dd:has(details.cands[open] > .cand-grid){grid-column:1 / -1;padding:2px 0 0;border-top:1px dashed var(--rule)}
.live dt:has(+ dd details.cands[open] > .cand-grid){grid-column:1 / -1}
.reps .vacant{color:var(--ink-2);font-weight:500;font-style:italic}
.hint{padding:12px 16px 14px;color:var(--ink-2);font-size:12.5px;border-top:1px solid var(--rule)}

@media (max-width:760px){
  #panel{top:auto;left:0;right:0;bottom:0;width:auto;max-height:46%;border-radius:16px 16px 0 0;overflow-x:hidden;overflow-y:auto;overscroll-behavior:contain}
  /* Phones: Views, the extent switch and the layer list scroll as one, between a pinned heading and footer,
     so the list never gets squeezed to a sliver under the Views chips. */
  #panel>*{flex-shrink:0}
  #layers{flex:none;overflow:visible;min-height:auto}
  .ph{position:sticky;top:0;z-index:3;background:var(--panel)}
  .pf{position:sticky;bottom:0;z-index:3;background:var(--panel);padding-bottom:calc(10px + env(safe-area-inset-bottom,0px))}
  #panel.collapsed #layers,#panel.collapsed .pf,#panel.collapsed .presets{display:none}
  #panel.collapsed .focus-list,#panel.collapsed .focus-res{display:none}
  #panel.collapsed .pf-inv{display:none}
  .pf-inv{max-height:180px}
  .ph{padding:8px 16px 10px;cursor:pointer}
  .ph .grab{display:block;width:36px;height:4px;border-radius:2px;background:var(--rule);margin:0 auto 8px}
  .ph h1{font-size:17px}
  .ph p{display:none}
  .ph .hub-link{position:absolute;top:14px;right:16px;margin:0;padding:10px 0 10px 12px}   /* the Layers.City mark, on the heading's row */
  .ph .hub-link svg:first-child{display:none}
  .fold,#unfold{display:none!important}
  #panel.folded{display:flex}
  #side{top:12px;left:12px;right:12px;bottom:calc(var(--panel-h,0px) + 8px);width:auto;gap:8px}
  .hh{padding:10px 12px 6px}
  .pills{padding:0 12px 8px}
  .sec>summary{padding:9px 12px}
  .sec dl.facts,.live{padding-left:12px;padding-right:12px}
  .leaflet-top.leaflet-left{display:none}
}
/* ---------- Heritage buildings (.hbm: .hb is the card header's buttons) ---------- */
.hbm{position:absolute;left:0;top:0;display:flex;align-items:center;gap:5px;transform:translate(-4.5px,-50%);white-space:nowrap;pointer-events:auto;cursor:pointer}
.hbm i{flex:none;width:7px;height:7px;transform:rotate(45deg);background:var(--hd);box-shadow:0 0 0 1.5px var(--city)}
.hbm b{font:600 10.5px/1.15 var(--font);color:var(--hd);text-shadow:0 0 2px var(--city),0 0 3px var(--city),0 0 5px var(--city)}
#map:not(.z16) .hbm b{display:none}
.sw.k-heritage{position:relative;background:var(--city)}
.sw.k-heritage::after{content:'';position:absolute;inset:0;margin:auto;width:8px;height:8px;transform:rotate(45deg);background:var(--hd)}
/* ---------- What's changing ---------- */
.chg{stroke:var(--city);stroke-width:1.2;fill-opacity:.92}
.chg.s-proposed{fill:var(--chg-1)} .chg.s-approved{fill:var(--chg-2)} .chg.s-building{fill:var(--chg-3)} .chg.s-finished{fill:var(--chg-4)}
.chg.demo{fill:var(--city);stroke-width:2;stroke-dasharray:2 1.5}
.chg.demo.s-proposed{stroke:var(--chg-1)} .chg.demo.s-approved{stroke:var(--chg-2)} .chg.demo.s-building{stroke:var(--chg-3)} .chg.demo.s-finished{stroke:var(--chg-4)}
.chg-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:0;flex:none}
/* Category chips on a merged places layer (each dot in its pins' colour), and the label over a second chip row */
.pl-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:0;flex:none;box-shadow:0 0 0 1px var(--panel)}
.pp-link{margin:6px 0 0;font-size:12px} .pp-link a{color:var(--accent,inherit);font-weight:600}
.pc-lab{display:block;font-size:10.5px;font-weight:600;color:var(--ink-3);margin:2px 0 4px}
.chg-dot.s-proposed{background:var(--chg-1)} .chg-dot.s-approved{background:var(--chg-2)} .chg-dot.s-building{background:var(--chg-3)} .chg-dot.s-finished{background:var(--chg-4)}
.chg-dot.demo{background:none;box-shadow:inset 0 0 0 2px currentColor}
.chg-dot.demo.s-proposed{color:var(--chg-1)} .chg-dot.demo.s-approved{color:var(--chg-2)} .chg-dot.demo.s-building{color:var(--chg-3)} .chg-dot.demo.s-finished{color:var(--chg-4)}
#chgbox .chips button{display:inline-flex;align-items:center}
#chgbox .chips button[aria-pressed="false"] .chg-dot{opacity:.35}
.live.chg dd{margin-bottom:4px}
.live.chg dd span.chg-sub{display:block;color:var(--ink-3);font-size:11px}
.live.chg dd span.chg-d{display:block;color:var(--ink-2);font-size:11.5px;margin-top:2px;line-height:1.4}
.live.chg a.chg-l{font-size:11.5px;font-weight:600;color:var(--accent)}
.live.cls dt{white-space:nowrap}
.cl-key{display:inline-block;width:14px;height:0;border-top:3px solid var(--cl-closed);margin-right:6px;vertical-align:middle;border-radius:2px}
.cl-key.narrowed{border-top:3px dotted var(--cl-narrow)}
.live p.chg-none{margin:0;font-size:12.5px;color:var(--ink-2)}
.chg-pop .chg-a{font-weight:600;margin-bottom:2px}
.chg-pop .chg-also{font-size:11.5px;color:var(--ink-2);margin-top:6px} .chg-pop .chg-also ul{margin:2px 0 0;padding-left:16px}
.bk{fill:none;stroke-linecap:round;stroke-linejoin:round}
.bk.t-prot{stroke:var(--bike)} .bk.t-paint{stroke:var(--bike-2)} .bk.t-trail{stroke:var(--bike-trail)}
.bk.t-shared{stroke:var(--bike-2);stroke-dasharray:5 5;stroke-linecap:butt}
.bk-case{fill:none;stroke:var(--city);stroke-opacity:.85;stroke-linecap:round;stroke-linejoin:round}
.bk-key{display:inline-block;width:15px;height:0;border-top:3.5px solid var(--bike);margin-right:5px;vertical-align:middle;flex:none}
.bk-key.t-paint{border-top:2.5px solid var(--bike-2)} .bk-key.t-shared{border-top:2.5px dashed var(--bike-2)} .bk-key.t-trail{border-top:2.5px solid var(--bike-trail)}
#bkbox .chips button{display:inline-flex;align-items:center}
#bkbox .chips button[aria-pressed="false"] .bk-key{opacity:.35}
.chips button[aria-pressed="true"] .bk-key.t-shared,.chips button[aria-pressed="true"] .bk-key.t-paint{filter:brightness(1.15)}
.bk-pop small{display:flex;align-items:center}
.pk-key{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:middle;flex:none;background:color-mix(in srgb,var(--park) 40%,transparent);box-shadow:inset 0 0 0 1px var(--park)}
.pk-pop small{display:flex;align-items:center}
.pk-pop .bk-fine{font-size:11px;color:var(--ink-3);margin:6px 0 0}
.bk-pop .bk-fine{font-size:11px;color:var(--ink-3);margin:6px 0 0}
/* Bike share stations: a ringed dot, filled lime where it charges e-bikes; a clear wider circle takes the tap. */
.dk{fill:var(--city);stroke:var(--dock);stroke-width:1.6;fill-opacity:1}
.dk.e{fill:var(--bike)}
.dk-hit{fill:#000;fill-opacity:0;stroke:none;cursor:pointer}
.dk-key{display:inline-block;width:9px;height:9px;border-radius:50%;box-sizing:border-box;border:2px solid var(--dock);background:var(--city);margin-right:6px;flex:none}
.dk-key.e{background:var(--bike)}
.dk-pop small{display:flex;align-items:center}
/* Parking spots: lots are squares (filled = garage, outlined = surface lot), chargers dots (filled with a darker ring = DC fast,
   ringed = Level 2 only; grey dashed = temporarily unavailable). Small and plain citywide; from zoom 14 they grow by size step
   z-1..3 (spaces or ports) and show a P or a bolt. Centred on the point (zero-size icon). */
.sp{display:block;position:absolute;box-sizing:border-box;transform:translate(-50%,-50%);border:1.5px solid var(--gp);background:var(--city);pointer-events:auto;cursor:pointer;width:7px;height:7px}
.sp.lot{border-radius:1.5px}
.sp.lot.c-g{background:var(--gp)}
.sp.charger{border-radius:50%;border-color:var(--evc);width:6px;height:6px}
.sp.charger.c-dc{background:var(--evc);border-color:color-mix(in srgb,var(--evc) 55%,var(--ink))}
.sp.charger.off{border-color:var(--ink-3);border-style:dashed;background:var(--city)}
.sp svg{display:none}
#map.z14 .sp{border-width:2px}
#map.z14 .sp.lot.z-1{width:11px;height:11px}#map.z14 .sp.lot.z-2{width:14px;height:14px}#map.z14 .sp.lot.z-3{width:17px;height:17px}
#map.z14 .sp.charger.z-1{width:10px;height:10px}#map.z14 .sp.charger.z-2{width:12px;height:12px}#map.z14 .sp.charger.z-3{width:15px;height:15px}
#map.z14 .sp.lot::after{content:"P";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--gp);font:800 8px/1 system-ui,sans-serif}
#map.z14 .sp.lot.c-g::after{color:#fff}
#map.z14 .sp.lot.z-3::after{font-size:10px}
#map.z15 .sp.charger.z-1{width:13px;height:13px}#map.z15 .sp.charger.z-2{width:15px;height:15px}#map.z15 .sp.charger.z-3{width:18px;height:18px}
#map.z15 .sp.charger svg{display:block;position:absolute;inset:0;margin:auto;width:70%;height:70%;fill:var(--evc)}
#map.z15 .sp.charger.c-dc svg{fill:#fff}
#map.z15 .sp.charger.off svg{fill:var(--ink-3)}
.sp-pop small .sp,.chips .sp,.sw .sp{position:static;transform:none;display:inline-block;flex:none;margin-right:6px;vertical-align:-1px;width:9px;height:9px;border-width:2px}
.sw .sp{margin:0;width:11px;height:11px}
.sp-pop small{display:flex;align-items:center}
.sw.k-docks{background:radial-gradient(circle at 32% 50%,var(--city) 0 2.6px,var(--dock) 2.8px 4.3px,transparent 4.6px),radial-gradient(circle at 70% 50%,var(--bike) 0 2.6px,var(--dock) 2.8px 4.3px,transparent 4.6px),var(--city)}
.sw.k-bikes{background:linear-gradient(var(--bike),var(--bike)) left center/55% 4px no-repeat,repeating-linear-gradient(90deg,var(--bike-2) 0 4px,transparent 4px 7px) right center/40% 2.5px no-repeat,var(--city)}
.sw.k-changes{background:radial-gradient(circle at 30% 40%,var(--chg-1) 0 3px,transparent 3.5px),radial-gradient(circle at 70% 35%,var(--chg-3) 0 3px,transparent 3.5px),radial-gradient(circle at 52% 74%,var(--chg-2) 0 3px,transparent 3.5px),var(--city)}
/* ---------- Guided first visit ---------- */
.tourbox{position:absolute;z-index:1100;left:50%;bottom:24px;transform:translateX(-50%);width:min(390px,calc(100% - 24px));box-sizing:border-box;background:var(--panel);color:var(--ink);border-radius:14px;box-shadow:var(--shadow);padding:14px 16px 12px;font-size:13px}
.tourbox.inv{display:flex;align-items:center;gap:10px;padding:10px 10px 10px 14px;width:auto;max-width:calc(100% - 24px);font-weight:600}
.tourbox.inv span{flex:1}
.tourbox[hidden]{display:none}
.tr-go{flex:none;font:inherit;font-size:12.5px;font-weight:700;border:none;border-radius:8px;padding:7px 12px;background:var(--accent);color:#fff;cursor:pointer}
.tr-x{flex:none;font:inherit;font-size:18px;line-height:1;width:28px;height:28px;border-radius:7px;border:none;background:var(--pill-bg);color:var(--ink-2);cursor:pointer}
.tr-h{display:flex;align-items:center;justify-content:space-between;gap:10px}
.tr-h small{font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
.tourbox strong{display:block;font-size:16px;margin:4px 0 4px}
.tourbox p{margin:0 0 12px;line-height:1.5;color:var(--ink-2)}
.tr-b{display:flex;align-items:center;justify-content:space-between;gap:10px}
.tr-b button{font:inherit;font-size:12.5px;font-weight:700;border-radius:8px;padding:7px 14px;cursor:pointer;border:1px solid var(--rule);background:none;color:var(--ink)}
.tr-b .tr-next{background:var(--accent);border-color:var(--accent);color:#fff;margin-left:auto}
.tr-b button[hidden]{display:none}
.tr-dots{display:flex;gap:5px} .tr-dots i{width:6px;height:6px;border-radius:50%;background:var(--rule)} .tr-dots i.on{background:var(--accent-2)}
#layers .row.tour-hi{border-radius:10px;box-shadow:inset 0 0 0 2px var(--accent-2);background:color-mix(in srgb,var(--accent-2) 8%,transparent)}
@media (max-width:760px){.tourbox{bottom:calc(var(--panel-h,0px) + 10px)} .tourbox p{font-size:12.5px}}
/* ---------- How addresses work ---------- */
.ag-line{fill:none;stroke:var(--ag);stroke-width:1.4;stroke-dasharray:5 5;opacity:.9}
.ag-line.base{stroke-width:3.2;stroke-dasharray:none;opacity:1}
.ag-divide{fill:none;stroke:var(--ag);stroke-width:4.5;stroke-linecap:round}
.ag-e,.ag-w{fill:none;stroke-width:3;stroke-linecap:round;opacity:.9}
.ag-e{stroke:var(--ag-e)} .ag-w{stroke:var(--ag-w)}
#map.z14 .ag-e,#map.z14 .ag-w{stroke-width:4.5}
.lbl-ag{font-size:10.5px;font-weight:700;color:var(--ag)!important;letter-spacing:.02em}
.lbl-ag.base{font-size:11.5px}
.lbl-ag.div{display:flex;align-items:center;gap:8px;font-size:11px}
.lbl-ag.div i{font-style:normal;color:var(--ag-w)} .lbl-ag.div i:last-child{color:var(--ag-e)} .lbl-ag.div b{color:var(--ag)}
.sw.k-addresses{background:var(--city) repeating-linear-gradient(90deg,var(--ag) 0 4px,transparent 4px 7px) 0 50%/100% 2px no-repeat}
dl.facts dd span.ag-blk{display:block;font-weight:500;margin-top:1px}
dl.facts dd span.ag-sub{display:block;font-weight:400;color:var(--ink-2);font-size:11.5px;margin-top:1px;line-height:1.4}
dl.facts dd span.ag-sub.pu-note{color:var(--ink-3);font-size:11px;margin-top:3px}
/* ---------- Compare two places ---------- */
.cmp-go{display:block;margin:0 16px 12px;font:inherit;font-size:12px;font-weight:600;border:1px solid var(--rule);border-radius:8px;padding:6px 10px;background:none;color:var(--accent);cursor:pointer}
.cmp-go:hover{border-color:var(--accent)}
.cmp-row{display:flex;flex-wrap:wrap;gap:8px;margin:0 16px 12px}
.cmp-row .cmp-go{margin:0;text-decoration:none}
.rpt{border-top:1px solid var(--rule);padding:8px 16px 14px}
.rpt-go{font:inherit;font-size:12px;background:none;border:none;padding:4px 0;color:var(--ink-2);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.rpt-go:hover,.rpt-go[aria-expanded="true"]{color:var(--accent)}
.rpt-box{display:flex;flex-direction:column;gap:10px;margin-top:8px;font-size:12.5px}
.rpt-l{display:flex;flex-direction:column;gap:4px;font-weight:600}
.rpt-kind{font:inherit;font-weight:400;font-size:13px;padding:6px 8px;border:1px solid var(--rule);border-radius:8px;background:var(--panel);color:var(--ink);max-width:100%}
.rpt-inc{display:flex;gap:8px;align-items:flex-start;line-height:1.4;cursor:pointer}
.rpt-inc input{margin:2px 0 0;accent-color:var(--accent-2,var(--accent))}
.rpt-send{align-self:flex-start;font-size:12.5px;font-weight:600;border-radius:8px;padding:7px 12px;background:var(--accent);color:#fff;text-decoration:none}
.rpt-send:focus-visible,.rpt-go:focus-visible,.rpt-copy:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.rpt-note{margin:0;color:var(--ink-2);line-height:1.45}
.rpt-copy{font:inherit;font-size:12px;background:none;border:none;padding:0;color:var(--accent);text-decoration:underline;cursor:pointer}
.cmp-wait{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 16px 12px;padding:8px 10px;border-radius:8px;background:color-mix(in srgb,var(--accent) 12%,transparent);font-size:12px;line-height:1.4}
.cmp-wait button{flex:none;font:inherit;font-size:12px;font-weight:600;border:none;border-radius:6px;padding:4px 8px;background:var(--pill-bg);color:var(--ink);cursor:pointer}
.cmp-cols{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 16px 12px}
.cmp-c{min-width:0}
.cmp-top{display:flex;align-items:flex-start;gap:6px}
.cmp-top strong{flex:1;min-width:0;font-size:13.5px;line-height:1.3;overflow-wrap:anywhere}
.cmp-k{flex:none;display:grid;place-items:center;width:18px;height:18px;margin-top:1px;border-radius:50%;background:var(--accent);color:#fff;font-size:10.5px;font-weight:700}
.cmp-c:nth-child(2) .cmp-k{background:var(--cmp-b)}
.cmp-x{flex:none;border:none;background:none;color:var(--ink-3);font:inherit;font-size:16px;line-height:1;padding:0 2px;cursor:pointer}
.cmp-x:hover{color:var(--ink)}
.cmp-c .pills{padding:6px 0 0;gap:4px}
.cmp-c .pill{font-size:11px;padding:3px 8px 3px 6px}
.cmp-rows{padding:0 16px 12px;font-size:12.5px}
.cmp-rows.top{padding-top:2px}
.cmp-r{display:grid;grid-template-columns:1fr 1fr;column-gap:12px;padding:6px 0;border-top:1px solid var(--rule)}
.cmp-r:first-child{border-top:none;padding-top:0}
.cmp-l{grid-column:1/-1;color:var(--ink-3);font-size:11px;margin-bottom:2px}
.cmp-v{font-weight:500;min-width:0;overflow-wrap:anywhere}
.cmp-v span{display:block;font-weight:400;color:var(--ink-2);font-size:11.5px}
.cmp-v span.caveat{color:var(--ink-3);font-size:10.5px;font-style:italic;margin-top:2px;line-height:1.35}
.cmp-v span.tier{display:inline-flex;align-items:center;gap:6px;font-weight:500;color:var(--ink);font-size:12.5px}
.cmp-v .tier i{width:9px;height:9px;border-radius:50%}
.cmp-v span.mix{display:flex;height:7px;border-radius:4px;overflow:hidden;margin:3px 0;background:var(--rule)}
.cmp-v span.mix i{display:block;height:100%}
.cmp-v b.dot{display:inline-block;width:7px;height:7px;border-radius:2px;margin-right:4px;vertical-align:1px}
.cmp-v span.standout{display:flex;gap:6px;padding:0;color:var(--ink);font-weight:500;font-size:12px}
.cmp-v span.standout span{display:inline;color:inherit;font-size:inherit;font-weight:inherit}
.cmp-v span.cmp-n{color:var(--ink-3)}
.cmp-rows p{margin:8px 0 0;font-size:10.5px;color:var(--ink-3)}
.pin.lettered{display:grid;place-items:center;font:700 10px/1 var(--font);color:#fff}
.pin.b{background:var(--cmp-b);box-shadow:0 0 0 7px color-mix(in srgb,var(--cmp-b) 28%,transparent),0 2px 8px rgba(0,0,0,.4)}
@media (min-width:761px){#side.cmp{width:min(540px,calc(100vw - 364px))}}
@media (max-width:760px){.cmp-cols,.cmp-rows{padding-left:12px;padding-right:12px} .cmp-go,.cmp-wait,.cmp-row{margin-left:12px;margin-right:12px} .cmp-row .cmp-go{margin:0}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

:root{
  --s-downtown:#EE6E73; --s-west:#7DAFE0; --s-east:#95CA7E;
  --l-expo:#0033A0; --l-millennium:#FFCD00; --l-canada:#007C9F; --l-seabus:#7D6A5C;

}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --s-downtown:#C2484E; --s-west:#4C7FB5; --s-east:#5E9A48;
  --l-expo:#4D7FE0; --l-seabus:#B29C8B; --wce:#A47CC8;
}}
:root[data-theme="dark"]{
  --s-downtown:#C2484E; --s-west:#4C7FB5; --s-east:#5E9A48;

/* Layers.City map engine. Everything city-specific comes from CITY (cities/<city>/city.json),
   inlined above this script by engine/assemble.py, and from the city's data/ folder. */
(() => {
const DATA = 'data/';
const slug = s => s.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
/* Feature counts (docs/stats.js, which also enforces this): an event name and short config ids, true/false
   or a tour step number only. Never place names, search text, pins or coordinates. Logged where a person acts, not
   where the tour, a View or a shared link replays the same functions. */
const logEvent = (name, data) => { try { if (window.lcTrack) window.lcTrack(name, data); } catch (e) {} };

/* Text templates from the config: "{name}" fills from a feature's properties, "{f.num}" walks into
   nested objects, a list becomes "a, b". A part in [square brackets] is dropped when a field inside it
   is missing; a missing field outside brackets blanks the whole text. */
function fill(tpl, ctx){
  const val = k => k.split('.').reduce((o, p) => o == null ? undefined : o[p], ctx);
  const sub = (s, miss) => s.replace(/\{([\w.]+)\}/g, (m, k) => {
    const v = val(k);
    if (v == null || v === '') { miss(); return ''; }
    return Array.isArray(v) ? v.join(', ') : v;
  });
  let missing = false;
  const out = sub(tpl.replace(/\[([^\]]*)\]/g, (m, inner) => { let gone = false; const r = sub(inner, () => { gone = true; }); return gone ? '' : r; }), () => { missing = true; });
  return missing ? '' : out;
}

const LAYERS = CITY.groups.flatMap(([, items]) => items);
const byKind = k => LAYERS.find(it => it.kind === k);
const UNITS = byKind('units'), METRO = byKind('metro');
const AREA_KINDS = ['fill', 'units', 'outline', 'patches', 'districts'];   // polygon layers the "What's here" card tests against
/* School board wards ("boards" kind): one file holds every board's wards, each feature tagged with its
   board. The panel shows one board at a time (it.boards: [id, short, long], the first is the default);
   the card looks up the spot's ward in every board. */
const BOARDS = LAYERS.filter(it => it.kind === 'boards');
const boardPick = {};
BOARDS.forEach(it => { boardPick[it.id] = it.boards[0][0]; });
const boardOf = (it, id) => it.boards.find(b => b[0] === id);
const boardCtx = (it, f) => { const b = boardOf(it, f.properties.board) || []; return Object.assign({}, f.properties, {short: b[1], long: b[2]}); };
function boardHits(it, x, y){
  const out = {}, fc = data.layers[it.id]; if (!fc) return out;
  fc.features.forEach(f => { if (!out[f.properties.board] && contains(f.geometry, x, y)) out[f.properties.board] = f; });
  return out;
}

/* Neighbourhood lenses (tiers from the city's profile data). One shows at a time. */
const LENSES = {};
CITY.lens.lenses.forEach(L_ => { LENSES[L_.id] = L_; });
/* A transit lens with "hubs" lets the viewer pick where the trip ends (New York: Penn Station or Grand Central).
   Each hub carries its own figures (key, minutes) and words (short, note, filter); the first is the default, and
   the lens's own fields repeat it for apps and the static pages. The pick is remembered in this browser. */
const HUB_STORE = 'hub:' + CITY.id;
const hubLens = CITY.lens.lenses.find(L_ => L_.hubs && L_.hubs.length > 1);
function useHub(L_, id){
  const h = L_.hubs.find(x => x.id === id) || L_.hubs[0];
  ['key', 'minutes', 'short', 'note', 'source'].forEach(k => { if (h[k] != null) L_[k] = h[k]; });
  L_.hub = h.id;
  return h;
}
const hubOf = L_ => L_.hubs.find(h => h.id === L_.hub) || L_.hubs[0];
if (hubLens){ let saved = null; try { saved = localStorage.getItem(HUB_STORE); } catch (e) {} useHub(hubLens, saved); }
const FILTERS = CITY.lens.filters;
/* A "pick a type" lens (e.g. housing type) shades units by the share of one category the viewer picks:
   d[L_.field] is a list of shares, L_.pick names the categories in the same order, L_.cuts splits a
   share into the lens's tiers. Every other lens reads a precomputed tier, d[L_.key]. */
const pick = {};
CITY.lens.lenses.forEach(L_ => { if (L_.pick) pick[L_.id] = L_.pick[0][0]; });

  if (!d) return null;
  if (!L_.pick) return d[L_.key];
  const i = L_.pick.findIndex(p => p[0] === pick[L_.id]), v = d[L_.field] && d[L_.field][i];
  if (v == null) return null;
  const t = L_.cuts.findIndex(c => v < c);
  return L_.tiers[t < 0 ? L_.tiers.length - 1 : t][0];
}
const FIRST_LENS = CITY.lens.lenses[0].id;
// Each lens tier's fill colour, written once from the config.
const tierCss = document.createElement('style');
tierCss.textContent = CITY.lens.lenses.map(L_ => L_.tiers.map(([k, , v]) => '.lens.' + L_.id + '-' + k + '{fill:var(' + v + ')}').join(' ')).join('\n');
document.head.appendChild(tierCss);
// The shortlist: tiers picked in any lens, plus a maximum for a "minutes" lens. Empty means "any".
const filt = {};
const clearFilters = () => FILTERS.forEach(f => { filt[f.lens] = f.max ? 0 : new Set(); });
clearFilters();
const filtOn = () => FILTERS.some(f => f.max ? filt[f.lens] > 0 : filt[f.lens].size);
// A "top" filter on a pick lens (housing type) keeps units whose largest share is one of the picked categories.
const topOf = (L_, d) => { const v = d[L_.field]; if (!v || !v.length) return null;
  let i = 0; v.forEach((x, j) => { if (x > v[i]) i = j; }); return L_.pick[i][0]; };
FILTERS.forEach(f => { if (f.top && !f.options) f.options = LENSES[f.lens].pick.map(([v, t]) => [v, t]); });
const matches = d => !!d && FILTERS.every(f => {
  const L_ = LENSES[f.lens];
  if (f.max) return !filt[f.lens] || (d[L_.minutes] != null && d[L_.minutes] <= filt[f.lens]);
  if (f.top) return !filt[f.lens].size || filt[f.lens].has(topOf(L_, d));
  return !filt[f.lens].size || filt[f.lens].has(keyOf(L_, d));
});

/* Label declutter: after each move, place labels in priority order and hide any that would overlap

const LABEL_PRIORITY = ['.lbl-focus', '.sub-b', '#map.elect .lbl-ward.el', '.rt-b.pick', '.lm.t1 b', '.lm.t2 b', '.lm.tw.sup b', '.lm.inst b', '.lm.tw b', '.lbl-stn.end', '.lbl-go.end', '.shield', '.lbl-stn', '.lbl-go', '.rt-b', '.lbl-cult', '.lbl-area', '.lbl-nbhd', '.lbl-ward, .lbl-prov, .lbl-fed, .lbl-sbw', '.lbl-bia', '.lbl-hd'];
let declutterQueued = false;
function declutter(){
  declutterQueued = false;
  const box = map.getContainer().getBoundingClientRect(), kept = [], seen = new Set();
  const el = map.getContainer();
  el.querySelectorAll('.clash').forEach(n => n.classList.remove('clash'));
  // Focused on a place: every label inside it is placed before any outside it.
  const passes = el.classList.contains('pfocus') ? [n => !n.closest('.fz-out'), n => !!n.closest('.fz-out')] : [() => true];
  passes.forEach(pass => LABEL_PRIORITY.forEach(sel => el.querySelectorAll(sel).forEach(n => {
    if (seen.has(n) || !pass(n)) return;  // e.g. a line-end label matches both '.lbl-stn.end' and '.lbl-stn'
    seen.add(n);
    const r = n.getBoundingClientRect();
    if (!r.width || r.right < box.left || r.left > box.right || r.bottom < box.top || r.top > box.bottom) return;
    const pad = 2;
    if (kept.some(k => r.left < k.right + pad && r.right > k.left - pad && r.top < k.bottom + pad && r.bottom > k.top - pad)) n.classList.add('clash');
    else kept.push(r);
  })));
}
function queueDeclutter(){ if (!declutterQueued){ declutterQueued = true; requestAnimationFrame(() => requestAnimationFrame(declutter)); } }

function polyLayer(fc, opts){
  const g = L.layerGroup();

    onEachFeature: (f, lyr) => { if (opts.hover) hoverTip(lyr, opts.hover(f)); lyr.on('click', tapMap); }});
  g.addLayer(geo);
  if (opts.label) fc.features.forEach(f => { const t = opts.label(f); if (!t) return;
    const lb = label(t, opts.lcls(f), ll(f.properties.lp));
    if (opts.focusId) tapToFocus(lb, opts.focusId, f);

/* ---------- geometry helpers for "What's here" ---------- */
function inRing(x, y, r){ let ins = false; for (let i = 0, j = r.length - 1; i < r.length; j = i++){ const xi=r[i][0], yi=r[i][1], xj=r[j][0], yj=r[j][1]; if (((yi>y)!==(yj>y)) && (x < (xj-xi)*(y-yi)/(yj-yi)+xi)) ins = !ins; } return ins; }
function inPoly(x, y, c){ if (!inRing(x, y, c[0])) return false; for (let k = 1; k < c.length; k++) if (inRing(x, y, c[k])) return false; return true; }
function contains(geom, x, y){ if (!geom) return false; if (geom.type === 'Polygon') return inPoly(x, y, geom.coordinates); if (geom.type === 'MultiPolygon') return geom.coordinates.some(c => inPoly(x, y, c)); return false; }
function hit(fc, x, y){ return fc ? fc.features.find(f => contains(f.geometry, x, y)) : null; }
function metres(a, b){ const k = Math.PI/180, dx = (a[0]-b[0])*k*Math.cos(a[1]*k)*6371000, dy = (a[1]-b[1])*k*6371000; return Math.hypot(dx, dy); }

/* ---------- build layers ---------- */
function buildBase(fc, regions){
  const g = L.geoJSON(fc, {pane:'base', interactive:false, style: f => ({className: {city:'base-city', neighbour:'base-out', outside:'base-far', annex:'base-annex'}[f.properties.kind]})});
  g.addTo(map);
  // An annex (kind annex): land beyond the city limits that the map treats as part of the city view (Vancouver's
  // University Endowment Lands): shaded and outlined apart, never masked, and inside the footprint, so taps there get
  // the full card. The city's units file names it (as one of its units); city-only layers simply stop at the line.
  // A municipality marked minor (a small town in a dense region, such as New Jersey's boroughs) is named from zoom 12 only.
  fc.features.filter(f => f.properties.kind === 'neighbour').forEach(f => label(f.properties.name, 'lbl-muni' + (f.properties.minor ? ' minor' : ''), ll(f.properties.lp)).addTo(map));
  regions.features.forEach(f => label(f.properties.name, 'lbl-region', ll(f.geometry.coordinates)).addTo(map));
  // A water label may turn to follow a river ("rotate", degrees clockwise) and be set smaller (cls "river").
  (CITY.water || []).forEach(w => label(w.rotate ? '<span class="rot" style="transform:rotate(' + (+w.rotate) + 'deg)">' + esc(w.name) + '</span>' : w.name, 'lbl-lake ' + w.cls, w.at).addTo(map));
  map.on('click', tapMap);
}

const PTY = CITY.party || {parties: []};
const PARTY = Object.fromEntries(LAYERS.filter(it => it.kind === 'outline' && (it.party || ELECT[it.id])).map(it => [it.id, it]));
const PTY_RANK = {city: 0, state: 1, national: 2};
// When several shaded layers come on at once: an election under way first, then national over state over city.
const prank = id => ELECT[id] ? 9 : PTY_RANK[PARTY[id].level];
const electShading = () => !!(shade && ELECT[shade]);
let shade = null, partyBusy = false, partyStack = [], partyDisplaced = [];
const partyPref = {};
function partyOf(it, f){   // [class, label] for one seat
  if (ELECT[it.id]) return ['elect', ''];
  const R = data.reps && data.reps[it.party.table], k = String(f.properties[it.party.key]);
  if (!R || !(k in R)) return ['nd', ''];
  const r = R[k]; if (!r) return ['vac', PTY.vacant || 'Vacant'];
  const p = PTY.parties.find(x => x[2].includes(r.party));
  return p ? [p[1], p[0]] : ['other', r.party || PTY.other || 'Other'];
}

// One seat's race for its election label: [heading, detail lines].
function electLines(it, f){
  const E = it.election, k = String(f.properties[E.key]), R = data.reps || {};
  // The sitting member: the card's office for this layer and key (e.g. the councillor, not the MPP on the same lines).
  const O = ((CITY.card.reps || {}).offices || []).find(o => o.layer === it.id && o.key === E.key);
  const r = (R[E.table] || {})[k], inc = O && (R[O.table] || {})[k];
  const lines = [fill(E.when, {date: longDay(E.date)})];
  if (r && r.winner) lines[0] = fill(r.acclaimed ? E.acclaimed : E.elected, {winner: r.winner});
  else if (new Date() >= dayStart(E.date)) lines[0] = E.counting;
  const ew = r && r.incumbentRunning === false && r.incumbentElsewhere, elsewhere = ew && (E.elsewhere || {})[ew.office];
  if (inc && inc.name) lines.push(fill(elsewhere || (r && r.incumbentRunning === false ? E.retiring : E.incumbent), Object.assign({name: inc.name}, ew || {})));
  else if (E.open) lines.push(E.open);
  if (r && !r.winner){ const n = r.candidates.length; lines.push(fill(E.running, {n, s: n === 1 ? '' : 's'})); }
  return [fill(E.head, f.properties), lines];
}
const longDay = s => dayStart(s).toLocaleDateString(CITY.locale, {month:'short', day:'numeric'});

const DRIVE_TIERS = [['d1', 'Under 30 min', '--drv-1', 30], ['d2', '30–60 min', '--drv-2', 60], ['d3', '60–90 min', '--drv-3', 90], ['d4', '90 min or more', '--drv-4', Infinity]];
const driveTier = m => m == null ? null : DRIVE_TIERS.find(t => m < t[3]);
const SUBURBS = LAYERS.find(it => it.kind === 'suburbs');

/* One builder per kind of layer. Each gets its config entry and its loaded data. */
const KINDS = {
  fill: (it, fc) => {

  },
  units: (it, fc) => polyLayer(fc, {pane:'lines', cls: () => 'nbhd', label: f => f.properties.name, lcls: () => 'lbl-nbhd', hover: f => fill(it.hover || '{name}', f.properties), focusId: it.id}),
  outline: (it, fc) => {
    const c = OUTLINE[it.level];
    // Election view: the label carries the race too, shown (and the number enlarged) only while the view is on.
    const lab = !ELECT[it.id] ? f => fill(it.label, f.properties) : f => { const [h, ls] = electLines(it, f);
      // The chip reads "Ward 19"; zoomed out to the whole city it shrinks to the number (el-s) so all 25 fit.
      return '<span class="el-n"><span class="el-h">' + esc(h) + '</span><span class="el-s">' + esc(String(f.properties[it.election.key])) + '</span></span><span class="el-x">' + ls.map(esc).join('<br>') + '</span>'; };
    const g = polyLayer(fc, {pane:'civic', cls: () => c, label: lab, lcls: () => 'lbl-' + c + (ELECT[it.id] ? ' el' : ''),
      hover: f => !it.party ? fill(it.hover, f.properties) : () => { const p = shade === it.id && partyOf(it, f)[1]; return esc(fill(it.hover, f.properties)) + (p ? ' · ' + esc(p) : ''); }});
    // Party colours sit in the fill pane, under the lines; the lines on top still take hovers and taps.
    // A halo under the lines (lines pane, below civic) makes the contrasting edge read on any colour.
    if (PARTY[it.id]) g._party = L.layerGroup([L.geoJSON(fc, {pane:'fill', interactive:false, style: f => ({className: 'pty p-' + partyOf(it, f)[0], weight: 0})}),

  },
  // Protected districts (heritage, landmark): a dashed outline with a light wash, so the streets inside still read.

  // Trustee wards: only the picked board's wards are drawn; g._pick swaps boards.

  // clsBy: one more class per feature from a property ("evac evac-3"), for patches shaded by category in city.css.

  lens: (it, [fc, prof]) => {

    const full = L.layerGroup(), inner = L.layerGroup();

    const gap = () => { const z = map.getZoom(); return z < 11 ? 0 : z < 12 ? 2 : z < 13 ? 3 : 4; };

  },
  streets: (it, fc) => {
    // Arterial roads, with names laid along the line. Labels are re-placed after every

    function place(){
      labels.clearLayers();
      const z = map.getZoom();

      const SP = z < 13 ? 420 : z < 14 ? 340 : 280;
      // Keep clear of other labels, shields and the panels floating over the map.
      const mr = map.getContainer().getBoundingClientRect();
      // A layer that yields (collectors) also keeps clear of the main streets' names, placed just before.
      document.querySelectorAll('#search, #here, #panel, .leaflet-tooltip.lbl, .shield, .lm i, .lm b, .stn, .sub-b, .leaflet-pin-pane > *' + (it.yieldLabels ? ', .st-lbl:not(.coll)' : '')).forEach(el => {

  highways: (it, [fc, outer, outerShields]) => {

    const gcore = L.geoJSON(outer, {pane:'hwy', style: () => ({className:'hwy-core outer', weight: w()[1]}),
      onEachFeature: (f, lyr) => { hoverTip(lyr, f.properties.name); lyr.on('click', e => inspect(e.latlng)); }});
    map.on('zoomend', () => { gcas.eachLayer(l => l.setStyle({weight: w()[0]})); gcore.eachLayer(l => l.setStyle({weight: w()[1]})); });
    g.addLayer(gcas); g.addLayer(gcore);

const TOUR = CITY.tour && CITY.tour.steps && CITY.tour.steps.length ? CITY.tour : null;
const tourBox = document.getElementById('tour'), tourInv = document.getElementById('tourInv');
let tourI = -1, tourSnap = null;
const TOUR_KEY = 'tourSeen-' + CITY.id;
function tourSeen(){ try { localStorage.setItem(TOUR_KEY, '1'); } catch (e) {} tourInv.hidden = true; }
function startTour(){

  rows.forEach(r => { r.classList.add('tour-hi'); const g = r.closest('.grp.folded'); if (g) foldGroup(g, false, false); });

function endTour(){

function tourInvite(){
  if (!TOUR) return;

document.addEventListener('keydown', e => {

/* ---------- Views: named presets (CITY.presets) ----------

   sub-toggles), its lens, its bus families, the regional or city scope, no filters, picks, focus or card,
   then frames its view. Changing anything after that (a layer, the lens, a chip) marks the view "Custom";
   moving the map, tapping a spot or focusing on a place doesn't. Links carry preset= while it holds.
   A view with "boundaries" (Who represents me) shows one of them at a time, with chips to switch: it leads
   with the layer of the next election within "window" days (CITY.presets.elections), else its "lead". */
const PRESETS = CITY.presets && CITY.presets.items && CITY.presets.items.length ? CITY.presets : null;
const presetBox = document.getElementById('presets'), qHint = document.getElementById('qhint');

function applyPreset(id){

function drawPresets(){

function clearPreset(){ presetOn = null; presetCustom = false; drawPresets(); }
if (qHint) qHint.addEventListener('click', () => document.getElementById('q').focus());

/* ---------- Special events: a view and a banner while a big one is on ----------
   An event marked "banner" in events.geojson (engine/events.py) becomes a view at the top of the Views
   list from a few days before it ("bannerFrom") until its last closure ends: only the layers in the
   events layer's "viewLayers" (streets and the event's closures), framed on its closures. The first time

const EVL = byKind('events'), evBanner = document.getElementById('evBanner');

// "today", "this weekend" or "Oct 24 to Oct 25".

function eventPresets(){

function eventBanner(){

  let seen = false; try { seen = !!localStorage.getItem(key); } catch (x) {}
  if (seen) return;

  evBanner.innerHTML = '<i class="ev-dot" aria-hidden="true"></i><span>' + esc(fill(EVL.bannerText, {name: e.name, when: evPhrase(e)})) + '</span>' +

/* ---------- Theme: Auto (device setting), Light or Dark; remembered in this browser ---------- */
function applyTheme(choice){

  else delete document.documentElement.dataset.theme;

try { savedTheme = localStorage.getItem('theme') || 'auto'; } catch (e) {}

/* ---------- Address search (OpenStreetMap Nominatim; one request per search, per its usage policy) ---------- */
const qf = document.getElementById('qf'), q = document.getElementById('q'), go = document.getElementById('go'), results = document.getElementById('results');
let lastSearch = 0;
function showResults(html){ results.innerHTML = html; results.hidden = !html; }
function placeLabel(r){
  const a = r.address || {};
  const street = a.road || a.pedestrian || a.footway || '';
  if (a.house_number && street) return a.house_number + ' ' + street;
  return r.name || street || r.display_name.split(',')[0];
}
function placeSub(r){
  const a = r.address || {};
  const name = r.name && r.name !== placeLabel(r) ? r.name : '';
  const town = data.footprint && !hit(data.footprint, +r.lon, +r.lat) ? (a.city || a.town || a.village || a.municipality) : '';
  return [name, a.neighbourhood || a.suburb || a.quarter, town, a.postcode].filter(Boolean).join(' · ');
}
function choose(r){ goTo(L.latLng(+r.lat, +r.lon), placeLabel(r), true); }
function goTo(latlng, name, fromSearch, minZoom, muniName){
  showResults('');

  if (fromSearch) q.value = name;
  // A spot beyond the city limits isn't visible in city-only mode: switch to the region view.
  if (scope === 'inner' && data.footprint && !hit(data.footprint, latlng.lng, latlng.lat)) setScope('outer', false);
  inspect(latlng, name, muniName);  // fill the card first, so a map-move problem can't hide the result
  const zoom = minZoom || Math.max(map.getZoom(), 15);
  const calm = matchMedia('(prefers-reduced-motion: reduce)').matches;
  try {
    const size = map.getSize();
    if (calm || !size.x || !size.y) map.setView(latlng, zoom, {animate: false});
    else map.flyTo(latlng, zoom, {duration: .8});

let busy = false;
async function geocode(url){
  // One retry after a pause covers a brief rate-limit (HTTP 429) or network hiccup.
  for (let attempt = 0; ; attempt++){
    try {
      const ctl = new AbortController(); const timer = setTimeout(() => ctl.abort(), 10000);
      const r = await fetch(url, {signal: ctl.signal, headers: {'Accept-Language': 'en'}});
      clearTimeout(timer);
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return await r.json();
    } catch (err){
      if (attempt >= 1) throw err;
      await new Promise(r => setTimeout(r, 1500));
    }

}
qf.addEventListener('submit', async e => {
  e.preventDefault();

  if (!text || !data.footprint || busy) return;
  // A place or landmark typed in full goes straight there, without a network search.
  const sugg = suggestions(text), exact = sugg.filter(x => x.s === 0);
  if (exact.length === 1){ exact[0].go(); return; }
  if (exact.length > 1){ showSuggestions(exact, false); return; }
  busy = true;
  const wait = 1100 - (Date.now() - lastSearch);
  if (wait > 0) await new Promise(r => setTimeout(r, wait));
  lastSearch = Date.now();
  go.disabled = true; go.textContent = '…';
  const url = 'https://nominatim.openstreetmap.org/search?format=jsonv2&addressdetails=1&limit=6&countrycodes=' + CITY.search.country + '&bounded=1' +
    '&viewbox=' + (CITY.search.regionViewbox || CITY.search.viewbox) + '&q=' + encodeURIComponent(text);
  try {
    let list;
    try { list = await geocode(url); }
    catch (err){ showResults('<li class="msg">Address search isn’t responding right now. Try again in a moment, or tap the map instead.</li>'); return; }
    // Keep matches inside the city (and, if the city searches its region too, the municipalities around it,
    // listed after the city's own), and merge repeats of the same address (one per entrance/postcode).
    const inCity = [], inside = r => hit(data.footprint, +r.lon, +r.lat);
    list.filter(r => inside(r) || (CITY.search.regionViewbox && hit(data.outer, +r.lon, +r.lat)))
      .sort((a, b) => inside(b) - inside(a)).forEach(r => {
      const dup = inCity.some(k => placeLabel(k) === placeLabel(r) && metres([+k.lon, +k.lat], [+r.lon, +r.lat]) < 150);
      if (!dup) inCity.push(r);
    });
    if (!inCity.length && sugg.length){
      showSuggestions(sugg, false);   // e.g. a misspelt or partial place name
    } else if (!inCity.length){
      showResults('<li class="msg">' + esc(fill(CITY.search.noMatch, {q: text})) + '</li>');
    } else if (inCity.length === 1){
      choose(inCity[0]);
    } else {
      window.__hits = inCity;
      showResults(inCity.map((r, i) => '<li><button type="button" data-i="' + i + '">' + esc(placeLabel(r)) + (placeSub(r) ? '<span>' + esc(placeSub(r)) + '</span>' : '') + '</button></li>').join(''));
      results.querySelectorAll('button').forEach(b => b.addEventListener('click', () => choose(window.__hits[+b.dataset.i])));
      results.querySelector('button').focus();
    }
  } catch (err){
    console.error(err);

  } finally { busy = false; go.disabled = false; go.textContent = 'Find'; }
});
q.addEventListener('keydown', e => { if (e.key === 'Escape'){ showResults(''); q.blur(); } });
/* Suggestions as you type: landmarks plus place names (neighbourhoods, known-as names, the city's big

   policy rules out autocomplete-as-you-type, so live suggestions never come from it. */
const norm = s => s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/['’]/g, '').replace(/[^a-z0-9]+/g, ' ').trim();
let PLACES = [];
function indexPlaces(base){
  const seen = new Set();
  const add = (f, sub, outside) => {
    const key = f.properties.name + '|' + sub;
    if (!f.properties.name || seen.has(key)) return;
    seen.add(key); PLACES.push({f, name: f.properties.name, sub, outside, alt: f.properties.aka});
  };
  LAYERS.filter(it => it.kind === 'fill').forEach(it => data.layers[it.id].features.forEach(f => add(f, it.place || it.name, false)));
  if (UNITS) data.units.features.forEach(f => add(f, CITY.units.singular + (f.properties.code != null ? ' #' + f.properties.code : ''), false));
  if (data.knownas) data.knownas.features.forEach(f => add(f, 'Known-as name', false));
  base.features.filter(f => f.properties.kind === 'neighbour').forEach(f => add(f, fill(CITY.outside.regionPill, f.properties) || 'Nearby', true));
  // The counties or regions themselves: choosing one focuses on it.
  // "DuPage" or "Peel" alone is as good as the full name ("Lake" matches two, so it lists both).
  if (data.regionAreas) data.regionAreas.features.forEach(f => PLACES.push({name: regionName(f.properties.region), sub: (CITY.focus && CITY.focus.noun) || 'Region', outside: true, focus: f.properties.region, rank: 3.5, f,
    alt: [f.properties.region, regionName(f.properties.region).split(/ (?:county|region)\b/i)[0]]}));

  (data.regionPlaces || []).forEach(p => PLACES.push({name: p.name, alt: p.alt, sub: fill(CITY.regionPlaces.sub, p), outside: true, muni: p.muni,
    community: (CITY.regionPlaces.near || []).includes(p.kind) ? 5 : 6,

function suggestions(text){

    const cs = getComputedStyle(n);

const frames = n => new Promise(r => { const step = k => k ? requestAnimationFrame(() => step(k - 1)) : r(); step(n); });
let saving = false;
async function saveImage(labels){
  if (saving) return; saving = true;
  logEvent('image', {shape: imgShape, labels: !!labels});
  imgMenuOpen(false);
  const [W, H, suffix] = SHAPES[imgShape], el = map.getContainer(), busy = document.getElementById('busy');
  const center = map.getCenter(), zoom = map.getZoom(), before = el.getAttribute('style') || '';
  // Wide: a 16:9 frame at least as big as the screen's map, so the picture shows what's on screen (and a bit more
  // on the short side). Instagram shapes: a 1080-px-wide frame drawn at twice the size, so names stay readable
  // when the post is seen on a phone.
  const cw = imgShape === 'wide' ? Math.round(Math.max(el.clientWidth, el.clientHeight * W / H)) : W / 2, ch = Math.round(cw * H / W);
  const k = cw / W;   // frame pixels per image pixel
  busy.firstElementChild.textContent = 'Making your image…'; busy.hidden = false;
  let canvas = null, restoreSvg = null;
  try {
    const lib = await loadImgLib();
    el.style.right = 'auto'; el.style.bottom = 'auto'; el.style.width = cw + 'px'; el.style.height = ch + 'px';
    map.invalidateSize({pan: false});
    // Focused on a place: fit it in the frame, clear of the title (top left) and the credits (bottom right).
    if (placeF) map.fitBounds(L.geoJSON(placeF.f).getBounds(), {animate: false, reset: true, maxZoom: 16,
      paddingTopLeft: [70 * k, (titleH(W) + 90) * k], paddingBottomRight: [70 * k, 220 * k]});
    else map.setView(center, zoom, {animate: false, reset: true});   // reset: redraw every shape for the new frame
    await new Promise(r => setTimeout(r, 400)); declutter(); await frames(2);
    const has = (n, c) => n.classList && n.classList.contains(c);
    const skip = n => has(n, 'leaflet-control-container') || has(n, 'leaflet-pin-pane') || has(n, 'hover-tip') ||
      (!labels && (has(n, 'leaflet-tooltip-pane') || has(n, 'leaflet-stlbl-pane') || has(n, 'shield') || has(n, 'rt-b') || has(n, 'sub-b') ||
        (n.tagName === 'B' && n.parentElement && has(n.parentElement, 'lm'))));
    restoreSvg = inlineSvgStyles(el);
    canvas = await lib.toCanvas(el, {width: cw, height: ch, canvasWidth: W, canvasHeight: H, pixelRatio: 1,
      backgroundColor: getComputedStyle(el).backgroundColor, filter: n => !skip(n)});
    if (placeF) stampTitle(canvas, placeF.name, pfNoun(placeF.it) + ' · ' + document.title);
    stampCredits(canvas);
  } catch (err){
    console.error(err);
  } finally {
    if (restoreSvg) restoreSvg();
    el.setAttribute('style', before);
    map.invalidateSize({pan: false}); map.setView(center, zoom, {animate: false, reset: true});   // reset: redraw every shape for the new frame
    busy.hidden = true; saving = false;
  }
  if (!canvas){ flash('The image couldn’t be made. Check your connection and try again.'); return; }
  canvas.toBlob(async blob => {
    if (!blob){ flash('The image couldn’t be made.'); return; }
    const what = placeF ? placeF.name : pin && pinName ? pinName : '';
    const name = slug(document.title) + (what ? '-' + slug(what) : '') + suffix + (labels ? '' : '-no-labels') + '.png';
    const file = new File([blob], name, {type: 'image/png'});
    if (matchMedia('(pointer:coarse)').matches && navigator.canShare && navigator.canShare({files: [file]})){
      try { await navigator.share({files: [file], title: document.title}); return; } catch (e){ if (e && e.name === 'AbortError') return; }
    }
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click(); a.remove();

}
// Bottom-right: the map's name and address, then the data credits (the licences ask for them wherever the map

function stampCredits(canvas){
  const ctx = canvas.getContext('2d'), cs = getComputedStyle(document.documentElement);
  const ink = cs.getPropertyValue('--ink').trim() || '#23262B', bg = cs.getPropertyValue('--panel').trim() || '#fff';
  const font = cs.getPropertyValue('--font').trim() || 'sans-serif';
  const credit = (() => { const d = document.createElement('div'); d.innerHTML = CITY.attribution; return d.textContent.replace(/\s+/g, ' ').trim(); })();
  const title = document.title + ' · ' + location.host + location.pathname.replace(/\/$/, '');
  const pad = 22, x = canvas.width - 36, y = canvas.height - 36, maxW = Math.min(canvas.width - 200, 2600);
  ctx.font = '400 24px ' + font;
  const lines = [];
  credit.split(' ').forEach(w => { const l = lines.length ? lines[lines.length - 1] + ' ' + w : w;
    if (lines.length && ctx.measureText(l).width <= maxW) lines[lines.length - 1] = l; else lines.push(w); });
  const w2 = Math.max(...lines.map(l => ctx.measureText(l).width));
  ctx.font = '700 30px ' + font; const w1 = ctx.measureText(title).width;
  const bw = Math.max(w1, w2) + pad * 2, bh = 30 + lines.length * 31 + 11 + pad * 2;
  ctx.globalAlpha = .88; ctx.fillStyle = bg;
  ctx.beginPath(); if (ctx.roundRect) ctx.roundRect(x - bw, y - bh, bw, bh, 14); else ctx.rect(x - bw, y - bh, bw, bh); ctx.fill();
  ctx.globalAlpha = 1; ctx.fillStyle = ink; ctx.textAlign = 'right'; ctx.textBaseline = 'alphabetic';
  ctx.fillText(title, x - pad, y - bh + pad + 28);

  ctx.globalAlpha = 1;
}
// Top-left, when focused on a place: its name, big, and what it is, for a poster or a post.
const titleH = W => Math.round(W / 2160 * 210);
function stampTitle(canvas, name, sub){
  const ctx = canvas.getContext('2d'), cs = getComputedStyle(document.documentElement);
  const ink = cs.getPropertyValue('--ink').trim() || '#23262B', ink2 = cs.getPropertyValue('--ink-2').trim() || '#5D6168', bg = cs.getPropertyValue('--panel').trim() || '#fff';
  const font = cs.getPropertyValue('--font').trim() || 'sans-serif';
  const s = canvas.width / 2160, pad = 34 * s, x = 48 * s, y = 48 * s, maxW = canvas.width - 2 * x - 2 * pad;
  let big = 84 * s;
  ctx.font = '800 ' + big + 'px ' + font;
  while (ctx.measureText(name).width > maxW && big > 40 * s){ big -= 4 * s; ctx.font = '800 ' + big + 'px ' + font; }
  const w1 = Math.min(ctx.measureText(name).width, maxW);
  const small = 34 * s; ctx.font = '500 ' + small + 'px ' + font; const w2 = Math.min(ctx.measureText(sub).width, maxW);
  const bw = Math.max(w1, w2) + pad * 2, bh = big + small + 22 * s + pad * 2;
  ctx.globalAlpha = .92; ctx.fillStyle = bg;
  ctx.beginPath(); if (ctx.roundRect) ctx.roundRect(x, y, bw, bh, 22 * s); else ctx.rect(x, y, bw, bh); ctx.fill();
  ctx.globalAlpha = 1; ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  ctx.fillStyle = ink; ctx.font = '800 ' + big + 'px ' + font; ctx.fillText(name, x + pad, y + pad + big * .82, maxW);
  ctx.fillStyle = ink2; ctx.font = '500 ' + small + 'px ' + font; ctx.fillText(sub, x + pad, y + pad + big + 14 * s + small * .82, maxW);
}

/* ---------- load ---------- */
renderEmpty('Loading map data…');
const files = ['base', 'regions'].concat(CITY.maskWater ? [CITY.maskWater] : []);
const REP_FILES = ((CITY.card.reps && CITY.card.reps.offices) || []).map(o => o.file).filter(Boolean);
data.repAreas = {};
// Files of layers marked "lazy" (bus route shapes) load the first time they're needed.
LAYERS.filter(it => !it.lazy).forEach(it => [].concat(it.file || it.files || []).forEach(f => { if (!files.includes(f)) files.push(f); }));
const loaded = {};
// Files of layers marked "optional" (e.g. daily closures not fetched yet) load as empty instead of failing the map.
const OPTIONAL = new Set(LAYERS.filter(it => it.optional).flatMap(it => [].concat(it.file || it.files || [])).concat(CITY.maskWater ? [CITY.maskWater] : []));
Promise.all(files.map(f => get(f).catch(e => { if (OPTIONAL.has(f)) return {type:'FeatureCollection', features:[]}; throw e; }).then(d => { loaded[f] = d; }))
  .concat([get(CITY.lens.file).then(d => { data.profiles = d; }), get(CITY.card.reps.file).then(d => { data.reps = d; }).catch(() => { data.reps = null; }),
    CITY.regionPlaces ? get(CITY.regionPlaces.file).then(d => { data.regionPlaces = d; }).catch(() => { data.regionPlaces = null; }) : null,
    CITY.card.nearby ? get(CITY.card.nearby.file).then(d => { data.nearby = d; }).catch(() => { data.nearby = null; }) : null,
    ...REP_FILES.map(f => get(f).then(d => { data.repAreas[f] = d; }).catch(() => { data.repAreas[f] = null; })),
    CITY.drive ? get('drive_grid.json').then(d => { data.driveGrid = d; }).catch(() => { data.driveGrid = null; }) : null,
    CITY.focus ? get('region_areas').then(d => { data.regionAreas = d; }).catch(() => { data.regionAreas = null; }) : null]))
.then(() => {
  const base = loaded.base, src = it => it.file ? loaded[it.file] : it.files.map(f => loaded[f]);
