name: Probe BART (temporary)
on:
  push:
    branches: [probe-bart]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q gtfs-realtime-bindings
      - run: |
          exec > >(tee probe.txt) 2>&1
          curl -sSL -o bart.zip https://www.bart.gov/dev/schedules/google_transit.zip; ls -l bart.zip
          python3 - <<'PY'
          import zipfile, csv, io, collections
          z=zipfile.ZipFile('bart.zip'); print(z.namelist())
          rd=lambda n: list(csv.DictReader(io.TextIOWrapper(z.open(n),encoding='utf-8-sig')))
          for r in rd('routes.txt'): print({k:r[k] for k in r if k in('route_id','route_short_name','route_long_name','route_type','route_color')})
          st=rd('stops.txt'); print(len(st), [ {k:s.get(k) for k in ('stop_id','stop_name','location_type','parent_station','platform_code')} for s in st[:8]])
          print([s['stop_name'] for s in st if s.get('location_type')!='1'][:30])
          cal=rd('calendar.txt'); print(cal[:4])
          tr=rd('trips.txt'); print(tr[0])
          PY
          curl -sS -D h.txt -o tu.pb "https://api.bart.gov/gtfsrt/tripupdate.aspx"; head -5 h.txt; ls -l tu.pb
          python3 - <<'PY'
          from google.transit import gtfs_realtime_pb2 as g
          import collections, time
          f=g.FeedMessage(); f.ParseFromString(open('tu.pb','rb').read())
          tu=[e.trip_update for e in f.entity if e.HasField('trip_update')]
          print('age', int(time.time())-f.header.timestamp, 'tu', len(tu), 'vehicle', sum(1 for t in tu if t.vehicle.id), 'routes', collections.Counter(t.trip.route_id for t in tu))
          print('stops', [ (s.stop_id, s.arrival.time, s.departure.time, s.arrival.delay) for t in tu[:2] for s in t.stop_time_update][:12])
          print('trip', tu[0].trip)
          PY
      - run: |
          git config user.name probe; git config user.email probe@users.noreply.github.com
          git add -f probe.txt && git commit -qm "probe output" && git push -q
