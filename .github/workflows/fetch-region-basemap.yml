name: Fetch region basemap
# A city's arterials and collectors, parks and reserves, and land use across its region from OpenStreetMap (Overpass
# API), into cities/<city>/raw/region_basemap/ (engine/region/fetch_basemap.py), committed back to the branch that ran
# it. Run by hand now and then (OSM changes slowly): workflow_dispatch with the city, or push the fetch-region-basemap
# branch (it fetches the cities listed in CITIES below).
on:
  workflow_dispatch:
    inputs:
      city:
        description: City folder under cities/
        required: true
  push:
    branches: [fetch-region-basemap]
    paths: ['engine/region/fetch_basemap.py', 'engine/region/fetch_places.py', '.github/workflows/fetch-region-basemap.yml', 'cities/*/region.json', 'cities/*/fetch_region.py']
permissions:
  contents: write
env:
  CITIES: vancouver dallas
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq gdal-bin && pip install shapely   # ogr2ogr: some cities' fetch_region.py
      - run: |
          for c in ${{ github.event.inputs.city || env.CITIES }}; do
            mkdir -p cities/$c/raw/region_basemap
            python3 -u engine/region/fetch_basemap.py $c 2>&1 | tee cities/$c/raw/region_basemap/fetch.log
            python3 -u engine/region/fetch_places.py $c 2>&1 | tee -a cities/$c/raw/region_basemap/fetch.log
            if [ -f cities/$c/fetch_region.py ]; then python3 -u cities/$c/fetch_region.py 2>&1 | tee -a cities/$c/raw/region_basemap/fetch.log; fi
          done
      - if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add cities/*/raw/region_basemap cities/*/raw/region 2>/dev/null || git add cities/*/raw/region_basemap
          git commit -m "Fetch the region basemap (roads, parks, land use) from OpenStreetMap" || echo "no changes"
          git pull --rebase
          git push
