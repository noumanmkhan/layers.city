name: Build map tiles
# Building outlines as PMTiles (engine/tiles/buildings.sh), uploaded to the R2 bucket layers-city-tiles that the Worker
# serves at /tiles/. Run by hand (Overture publishes a new release about monthly; buildings change slowly), or by
# pushing the build-tiles branch. Commits only the log line naming the release used.
# Each city's area is the bbox in cities/<city>/region.json. Pushing the branch builds the cities in CITIES below.
on:
  workflow_dispatch:
    inputs:
      cities:
        description: City folders under cities/, space-separated
        required: true
  push:
    branches: [build-tiles]
    paths: ['engine/tiles/**', '.github/workflows/build-tiles.yml']
env:
  CITIES: sf
permissions:
  contents: write
jobs:
  buildings:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install duckdb
      - name: tippecanoe
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq build-essential libsqlite3-dev zlib1g-dev >/dev/null
          git clone --depth 1 https://github.com/felt/tippecanoe /tmp/tc && make -C /tmp/tc -j4 >/dev/null && sudo make -C /tmp/tc install >/dev/null
          tippecanoe --version
      - name: Buildings for each city
        run: |
          set -o pipefail
          for c in ${{ github.event.inputs.cities || env.CITIES }}; do
            bb=$(python3 -c "import json; s,w,n,e=json.load(open('cities/$c/region.json'))['bbox']; print(w,s,e,n)")
            mkdir -p cities/$c/raw
            bash engine/tiles/buildings.sh $c $bb 2>&1 | grep -v '%  1[0-9]/' | tail -c 6000 | tee cities/$c/raw/buildings_tiles.log
            rm -rf /tmp/tiles-$c
          done
      - if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add cities/*/raw/buildings_tiles.log
          git commit -m "Build the building-outline tiles" || echo "no changes"
          git pull --rebase
          git push
