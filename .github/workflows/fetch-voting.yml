name: Fetch voting places
# Every city's voting places, rebuilt into docs/<city>/data/voting.geojson, while an election is coming up. One job,
# each city in its own step, so one city failing keeps the others' updates (the run is then marked failed). Commits
# to main once, only what changed; the deploy workflow then republishes the site.
#   Toronto: voting subdivisions and voting places (cities/toronto/fetch_voting.py, voting.py).
#   Chicago: early voting and election day vote centers from the Board of Election Commissioners' page
#     (fetch_vote_centers.py, voting.py; the saved pages are gitignored).
#   Dallas: where people vote in Dallas, Tarrant, Collin and Denton counties (fetch_voting.py, voting.py).
#   New York: the Board of Elections' poll site lists and the State's site points (fetch_voting.py, voting.py), and
#     the ballot rows in representatives.json (fetch_ballot.py, ballot.py: the candidate list is marked tentative).
#   Melbourne: the VEC's venues spreadsheet, each address placed (fetch_voting.py, voting.py).
# When: every morning, local time, from a city's voting_from date to election day (.github/elections.json). The two
# crons are North America's and Australia's mornings; outside every window a run does nothing. Also when a city's
# voting scripts change on main (that city only), or by hand (any cities; empty = those in a window today).
on:
  workflow_dispatch:
    inputs:
      cities: {description: 'Cities, space-separated (empty = those in a voting window today)', default: ''}
  schedule:
    - cron: '41 10 * * *'   # 06:41 Toronto and New York, 05:41 Chicago and Dallas (an hour earlier in winter)
    - cron: '41 19 * * *'   # 06:41 Melbourne in summer (AEDT), 05:41 in winter
  push:
    branches: [main]
    paths:
      - 'cities/toronto/fetch_voting.py'
      - 'cities/toronto/voting.py'
      - 'cities/chicago/fetch_vote_centers.py'
      - 'cities/chicago/voting.py'
      - 'cities/dallas/fetch_voting.py'
      - 'cities/dallas/voting_sources.py'
      - 'cities/dallas/voting.py'
      - 'cities/melbourne/fetch_voting.py'
      - 'cities/melbourne/voting.py'
permissions:
  contents: write
concurrency: fetch-voting
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Which cities
        run: |
          if [ "${{ github.event_name }}" = push ]; then
            C=$(git diff --name-only HEAD~1 HEAD -- cities | cut -d/ -f2 | sort -u | tr '\n' ' ')
          elif [ -n "${{ inputs.cities }}" ]; then C="${{ inputs.cities }}"
          else C=$(python3 .github/elections.py voting); fi
          echo "Cities: ${C:-none}"
          echo "CITIES= $C " >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        if: env.CITIES != '  '
        with:
          node-version: 22
      - if: env.CITIES != '  '
        run: pip install -q shapely openpyxl pdfplumber pypdf

      - name: Toronto
        id: toronto
        if: contains(env.CITIES, ' toronto ')
        continue-on-error: true
        run: |
          set -o pipefail
          mkdir -p cities/toronto/raw/voting
          python3 -u cities/toronto/fetch_voting.py 2>&1 | tee cities/toronto/raw/voting/fetch.log
          if [ -f cities/toronto/voting.py ]; then
            npm install --silent
            python3 -u cities/toronto/voting.py 2>&1 | tee -a cities/toronto/raw/voting/fetch.log
          fi
      - name: Chicago
        id: chicago
        if: contains(env.CITIES, ' chicago ')
        continue-on-error: true
        run: |
          set -o pipefail
          mkdir -p cities/chicago/raw/vote_centers
          python3 -u cities/chicago/fetch_vote_centers.py 2>&1 | tee cities/chicago/raw/vote_centers/fetch.log
          npm install --silent
          python3 -u cities/chicago/voting.py 2>&1 | tee -a cities/chicago/raw/vote_centers/fetch.log
      - name: Dallas
        id: dallas
        if: contains(env.CITIES, ' dallas ')
        continue-on-error: true
        run: |
          set -o pipefail
          npm install --silent
          python3 -u cities/dallas/fetch_voting.py 2>&1 | tee cities/dallas/raw/fetch_voting.log
          python3 cities/dallas/voting.py
      - name: New York
        id: nyc
        if: contains(env.CITIES, ' nyc ')
        continue-on-error: true
        run: |
          set -o pipefail
          npm install --silent
          python3 -u cities/nyc/fetch_voting.py 2>&1 | tee cities/nyc/raw/fetch_voting.log
          python3 cities/nyc/voting.py
          python3 -u cities/nyc/fetch_ballot.py > cities/nyc/raw/ballot/fetch_ballot.log 2>&1 && python3 cities/nyc/ballot.py && python3 cities/nyc/representatives.py || echo 'ballot refresh failed; keeping the last list'
      - name: Melbourne
        id: melbourne
        if: contains(env.CITIES, ' melbourne ')
        continue-on-error: true
        run: |
          set -o pipefail
          mkdir -p cities/melbourne/raw/voting
          python3 -u cities/melbourne/fetch_voting.py 2>&1 | tee cities/melbourne/raw/voting/fetch.log
          python3 -u cities/melbourne/voting.py 2>&1 | tee -a cities/melbourne/raw/voting/fetch.log

      - name: Commit what changed
        if: always()
        run: |
          add() { for p in "$@"; do [ -e "$p" ] && git add "$p"; done; return 0; }
          for c in $CITIES; do add docs/$c/data/voting.geojson cities/$c/raw/voting cities/$c/raw/fetch_voting.log; done
          add cities/chicago/raw/vote_centers cities/nyc/raw/ballot docs/nyc/data/representatives.json
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update voting places:$(git diff --cached --name-only | cut -d/ -f2 | sort -u | tr '\n' ' ' | sed 's/^/ /')"
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && exit 0; sleep 10; done
          exit 1
      - name: Report cities that failed
        if: always()
        run: |
          f=""
          [ "${{ steps.toronto.outcome }}" = failure ] && f="$f Toronto"
          [ "${{ steps.chicago.outcome }}" = failure ] && f="$f Chicago"
          [ "${{ steps.dallas.outcome }}" = failure ] && f="$f Dallas"
          [ "${{ steps.nyc.outcome }}" = failure ] && f="$f New-York"
          [ "${{ steps.melbourne.outcome }}" = failure ] && f="$f Melbourne"
          [ -z "$f" ] && { echo "All cities OK"; exit 0; }
          echo "::error::Failed:$f (the other cities' updates were committed)"; exit 1
