name: Deploy to Cloudflare Pages

# Publishes docs/ (the finished site) to Cloudflare Pages with Wrangler's direct upload:
# no Cloudflare build runs, so this doesn't count toward Pages' monthly build limit, and
# only files that changed are uploaded.
#
# Runs on:
# - a push to main that changes docs/ (or this file);
# - the end of each fetch job that commits to docs/. Commits those jobs push with
#   GITHUB_TOKEN don't trigger push workflows, so this listens for the jobs finishing;
# - by hand, for main or for a preview of another branch (e.g. dev →
#   https://dev.layers-city.pages.dev).
#
# A newer deploy for the same branch cancels one still running, so a burst of commits
# publishes once.
#
# Needs repo secrets CLOUDFLARE_API_TOKEN (permission: Cloudflare Pages: Edit) and
# CLOUDFLARE_ACCOUNT_ID.

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'functions/**'
      - '.github/workflows/deploy.yml'
  workflow_run:
    workflows:
      - "Fetch transit closures"
      - "Fetch what's changing"
      - "Fetch streetcar and bus routes"
      - "Fetch heritage buildings"
      - "Fetch bike lanes"
      - "Fetch Toronto collection days"
      - "Fetch voting places"
      - "Fetch Dallas voting places"
      - "Refresh representatives"
      - "Refresh Chicago representatives"
      - "Refresh Dallas representatives"
      - "Refresh Vancouver representatives"
      - "Fetch New York voting places"
      - "Fetch Chicago voting places"
      - "Refresh New York representatives"
      - "Fetch Vancouver places"
      - "Fetch Toronto parking"
      - "Fetch New York City parking"
      - "Fetch Toronto nearby places"
      - "Refresh fact sheets"
      - "Refresh venues"
      - "Fetch GO fares"
      - "Refresh San Francisco data"
      - "Fetch Toronto fun maps"
    types: [completed]
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to publish (main = the live site; anything else = a preview URL)'
        default: main

permissions:
  contents: read

concurrency:
  group: deploy-${{ inputs.branch || 'main' }}
  cancel-in-progress: true

jobs:
  deploy:
    # After a fetch job, deploy only if it succeeded (a failed job committed nothing new).
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BRANCH: ${{ inputs.branch || 'main' }}
      PROJECT: layers-city
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || 'main' }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check the secrets are set
        run: |
          [ -n "$CLOUDFLARE_API_TOKEN" ] || { echo "::error::Repo secret CLOUDFLARE_API_TOKEN is missing"; exit 1; }
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || { echo "::error::Repo secret CLOUDFLARE_ACCOUNT_ID is missing"; exit 1; }

      - name: Create the Pages project if it doesn't exist yet
        run: |
          if npx --yes wrangler@4 pages project list 2>/dev/null | grep -q "\b$PROJECT\b"; then
            echo "Project $PROJECT exists."
          else
            npx --yes wrangler@4 pages project create "$PROJECT" --production-branch=main
          fi

      # The arrivals function (functions/api/arrivals.js) reads Muni's live times from 511.org with this key. It's
      # set on the Pages project, for production and previews, before each deploy (a deploy picks up the project's
      # variables as they are then). Skipped when the repo secret isn't set: San Francisco's page then shows the
      # timetable only.
      # MTA_BUSTIME_KEY: New York's live bus times (MTA Bus Time), the same way.
      - name: Hand the live-times keys to the arrivals function
        env:
          FIVE11_KEY: ${{ secrets.FIVE11_KEY }}
          MTA_BUSTIME_KEY: ${{ secrets.MTA_BUSTIME_KEY }}
        run: |
          [ -n "$FIVE11_KEY$MTA_BUSTIME_KEY" ] || { echo "No live-times key secrets: skipped."; exit 0; }
          python3 -c "import json,os; v={k:{'type':'secret_text','value':os.environ[k]} for k in ('FIVE11_KEY','MTA_BUSTIME_KEY') if os.environ.get(k)}; print(json.dumps({'deployment_configs':{'production':{'env_vars':v},'preview':{'env_vars':v}}}))" > /tmp/vars.json
          code=$(curl -sS -o /tmp/patch.json -w '%{http_code}' -X PATCH \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PROJECT" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json' --data @/tmp/vars.json)
          rm -f /tmp/vars.json
          python3 -c "import json; d=json.load(open('/tmp/patch.json')); print('success' if d.get('success') else d.get('errors'))"
          [ "$code" = 200 ] || echo "::warning::Couldn't set the live-times keys on the Pages project (HTTP $code)"

      - name: Publish docs/
        run: |
          npx --yes wrangler@4 pages deploy docs \
            --project-name="$PROJECT" \
            --branch="$BRANCH" \
            --commit-hash="$(git rev-parse HEAD)" \
            --commit-message="$(git log -1 --format=%s | cut -c1-200)" \
            --commit-dirty=true
