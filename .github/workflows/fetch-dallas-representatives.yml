name: Refresh Dallas representatives
# Weekly: fetches Dallas's council members (the City's council district layer), Texas legislators (Open States) and
# members of Congress (Clerk of the House), and rebuilds docs/dallas/data/representatives.json. Commits to main only
# when a name, party or link changed; the deploy workflow then republishes the site. Can also be run by hand.
on:
  schedule:
    - cron: '47 9 * * 1'   # Mondays 09:47 UTC
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: refresh-dallas-representatives
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q shapely
      - run: python3 -u cities/dallas/fetch_more.py reps
      - run: |
          [ -f docs/dallas/data/council.geojson ] || { echo "Dallas isn't on main yet"; exit 0; }
          python3 cities/dallas/representatives.py
      - run: |
          if git diff --quiet -- docs/dallas/data/representatives.json; then echo "no changes"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add cities/dallas/raw/representatives cities/dallas/raw/dallas_council.geojson docs/dallas/data/representatives.json
          git commit -m "Refresh Dallas council members, state legislators and members of Congress"
          git pull --rebase origin main
          git push origin HEAD:main
