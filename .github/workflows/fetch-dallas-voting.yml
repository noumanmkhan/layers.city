name: Fetch Dallas voting places
# Where people vote on November 3, 2026 in Dallas, Tarrant, Collin and Denton counties
# (cities/dallas/fetch_voting.py), then docs/dallas/data/voting.geojson (cities/dallas/voting.py).
# Daily until election day, twice on election morning, on change, or by hand. After election day it does nothing.
on:
  workflow_dispatch:
  schedule:
    - cron: '17 11 * 10,11 *'
    - cron: '23 12 3 11 *'
  push:
    branches: [main]
    paths: ['cities/dallas/fetch_voting.py', 'cities/dallas/voting_sources.py', 'cities/dallas/voting.py', '.github/workflows/fetch-dallas-voting.yml']
permissions:
  contents: write
concurrency: fetch-dallas-voting
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Stop after election day
        run: |
          if [ "$(TZ=America/Chicago date +%F)" \> "2026-11-03" ] && [ "${{ github.event_name }}" = schedule ]; then echo "STOP=1" >> "$GITHUB_ENV"; fi
      - uses: actions/setup-python@v5
        if: env.STOP != '1'
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        if: env.STOP != '1'
        with:
          node-version: '22'
      - if: env.STOP != '1'
        run: pip install -q pdfplumber shapely && npm install --silent
      - if: env.STOP != '1'
        run: |
          python3 -u cities/dallas/fetch_voting.py 2>&1 | tee cities/dallas/raw/fetch_voting.log
          python3 cities/dallas/voting.py
      - if: env.STOP != '1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add cities/dallas/raw/voting cities/dallas/raw/fetch_voting.log docs/dallas/data/voting.geojson
          git commit -m "Update Dallas-area voting places" || exit 0
          git pull --rebase
          git push
