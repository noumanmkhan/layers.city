name: Compute transit times to Waterfront
# Downloads TransLink's schedules plus an OpenStreetMap extract, routes a weekday morning trip to
# Waterfront Station from points across every Vancouver local area with r5py, and commits
# cities/vancouver/raw/transit_waterfront.json and its log to main.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['cities/vancouver/fetch_transit_waterfront.py', '.github/workflows/fetch-transit-waterfront.yml']
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update -q && sudo apt-get install -y -q osmium-tool
      - run: pip install r5py geopandas shapely
      - run: set -o pipefail; python3 -u cities/vancouver/fetch_transit_waterfront.py 2>&1 | tee cities/vancouver/raw/transit_waterfront.log
      - if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add cities/vancouver/raw/transit_waterfront.log; if [ -f cities/vancouver/raw/transit_waterfront.json ]; then git add cities/vancouver/raw/transit_waterfront.json; fi
          git commit -m "Compute transit times from each Vancouver local area to Waterfront" || echo "no changes"
          git pull --rebase
          git push
