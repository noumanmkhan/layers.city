name: Fetch Dallas fun maps
# Downloads the inputs for the Fun maps page (OpenStreetMap shops, 311 requests)
# into cities/dallas/raw/fun/, boiled down to small summaries, then rebuilds docs/dallas/fun/, which deploy.yml
# publishes. These maps change slowly, so it runs quarterly, when its scripts change on main, or by hand.
on:
  workflow_dispatch:
    inputs:
      parts: {description: 'Parts to fetch (osm 311); empty = all', default: ''}
  schedule:
    - cron: '19 11 3 1,4,7,10 *'
  push:
    branches: [main]
    paths: ['cities/dallas/fetch_fun.py', 'engine/fun/osm.py', '.github/workflows/fetch-dallas-fun.yml']
permissions:
  contents: write
concurrency: fetch-dallas-fun
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install shapely
      - run: mkdir -p cities/dallas/raw/fun && python3 -u cities/dallas/fetch_fun.py ${{ inputs.parts }} 2>&1 | tee cities/dallas/raw/fun/fetch.log
      - run: |
          if [ -f engine/fun/build.py ]; then python3 engine/fun/build.py dallas; fi
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add cities/dallas/raw/fun
          if [ -d docs/dallas/fun ]; then git add docs/dallas/fun; fi
          git commit -m "Fetch Dallas fun maps inputs" || { echo "no changes"; exit 0; }
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep 10; done
          exit 1
