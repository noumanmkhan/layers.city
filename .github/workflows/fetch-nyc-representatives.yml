name: Refresh New York representatives
# Weekly: New York's council members (council.nyc.gov), state legislators (Open States) and members of Congress
# (Clerk of the House) (cities/nyc/fetch_representatives.py), then docs/nyc/data/representatives.json
# (cities/nyc/representatives.py). Commits to main only when a name, party or link changed. Can also be run by hand.
on:
  schedule:
    - cron: '53 9 * * 1'   # Mondays 09:53 UTC
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: refresh-nyc-representatives
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -u cities/nyc/fetch_representatives.py
      - run: python3 cities/nyc/representatives.py
      - run: |
          if git diff --quiet -- docs/nyc/data/representatives.json; then echo "no changes"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add cities/nyc/raw/representatives docs/nyc/data/representatives.json
          git commit -m "Refresh New York council members, state legislators and members of Congress"
          git pull --rebase origin main
          git push origin HEAD:main
