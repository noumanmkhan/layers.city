name: Fetch New York voting places
# Where New Yorkers vote on November 3, 2026: the Board of Elections' poll site lists and the State's site points
# (cities/nyc/fetch_voting.py), then docs/nyc/data/voting.geojson (cities/nyc/voting.py). Daily until election day,
# twice on election morning, or by hand. After election day it does nothing. Commits to main only when the file changes.
on:
  workflow_dispatch:
  schedule:
    - cron: '41 10 * 10,11 *'   # 06:41 in New York
    - cron: '11 11 3 11 *'
permissions:
  contents: write
concurrency: fetch-nyc-voting
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Stop after election day
        run: |
          if [ "$(TZ=America/New_York date +%F)" \> "2026-11-03" ] && [ "${{ github.event_name }}" = schedule ]; then echo "STOP=1" >> "$GITHUB_ENV"; fi
      - uses: actions/setup-python@v5
        if: env.STOP != '1'
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        if: env.STOP != '1'
        with:
          node-version: '22'
      - if: env.STOP != '1'
        run: pip install -q pypdf shapely && npm install --silent
      - if: env.STOP != '1'
        run: |
          set -o pipefail
          python3 -u cities/nyc/fetch_voting.py 2>&1 | tee cities/nyc/raw/fetch_voting.log
          python3 cities/nyc/voting.py
      - if: env.STOP != '1'
        run: |
          if git diff --quiet -- docs/nyc/data/voting.geojson; then echo "no changes"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add cities/nyc/raw/voting cities/nyc/raw/fetch_voting.log docs/nyc/data/voting.geojson
          git commit -m "Update New York voting places"
          git pull --rebase origin main
          git push origin HEAD:main
