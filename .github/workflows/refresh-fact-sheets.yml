name: Refresh fact sheets
# Keeps the fact sheets (docs/<city>/profiles/, built by engine/profiles/build.py from cities/<city>/factsheet.json)
# in step with the map's data, for each city in CITIES. Two kinds of run:
# - Quick: after a fetch job that changes the map files the fact sheets read (routes and stops, parking,
#   bike lanes and Bike Share), rebuild the sheets from what's already committed. No network, a minute or two.
# - Full: monthly, or by hand with "full", also re-fetches what the sheets alone use, from OpenStreetMap and
#   OSRM: the walking network and walk-time grid (fetch_walk.py, walk_grid.py), highway ramps and drive times
#   (fetch_drive.py). A step that can't reach its server keeps last month's file, and the rebuild still runs.
# Scheduled and workflow_run jobs only run from the copy of this file on main. deploy.yml lists this workflow,
# so a refresh that commits goes live.
on:
  workflow_dispatch:
    inputs:
      full:
        description: 'Also re-fetch walking network, walk times, ramps and drive times (30–90 min a city)'
        type: boolean
        default: false
      cities:
        description: 'Cities, space-separated'
        default: 'toronto nyc'
  schedule:
    - cron: '17 7 9 * *'
  workflow_run:
    workflows:
      - "Fetch streetcar and bus routes"
      - "Fetch Toronto parking"
      - "Fetch New York City parking"
      - "Fetch bike lanes"
      - "Fetch New York City data"
    types: [completed]
permissions:
  contents: write
concurrency: refresh-fact-sheets
jobs:
  refresh:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      CITIES: ${{ inputs.cities || 'toronto nyc' }}
      FULL: ${{ github.event_name == 'schedule' || inputs.full == true }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Check fact sheets exist on this branch
        id: have
        run: |
          if [ -f engine/profiles/build.py ]; then echo "ok=1" >> "$GITHUB_OUTPUT"
          else echo "::notice::No engine/profiles/build.py on main yet: nothing to refresh."; fi
      - if: steps.have.outputs.ok
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - if: steps.have.outputs.ok
        run: pip install -q shapely
      # Overpass tiles fetched this month are kept between runs, so a run that stopped partway carries on.
      - if: steps.have.outputs.ok && env.FULL == 'true'
        run: echo "MONTH=$(date -u +%Y-%m)" >> "$GITHUB_ENV"
      - if: steps.have.outputs.ok && env.FULL == 'true'
        uses: actions/cache@v4
        with:
          path: cities/*/raw/walk_tiles
          key: walk-tiles-${{ env.MONTH }}-${{ github.run_id }}
          restore-keys: walk-tiles-${{ env.MONTH }}-
      - name: Walking network and walk times (full runs)
        if: steps.have.outputs.ok && env.FULL == 'true'
        continue-on-error: true
        run: |
          for CITY in $CITIES; do
            # the log is committed, so a failed run can be read without the Actions page
            ( set -o pipefail; { python3 -u engine/profiles/fetch_walk.py "$CITY" && python3 -u engine/profiles/walk_grid.py "$CITY"; } 2>&1 | tail -c 20000 > "cities/$CITY/raw/factsheet_walk.log" ) || echo "::warning::$CITY walk times not refreshed"
          done
      - name: Highway ramps and drive times (full runs)
        if: steps.have.outputs.ok && env.FULL == 'true'
        continue-on-error: true
        run: |
          for CITY in $CITIES; do
            python3 -u engine/profiles/fetch_drive.py "$CITY" || echo "::warning::$CITY drive times not refreshed"
          done
      - name: Rebuild the fact sheets
        if: steps.have.outputs.ok
        run: for CITY in $CITIES; do python3 -u engine/profiles/build.py "$CITY"; done
      - name: Commit
        if: steps.have.outputs.ok
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          for CITY in $CITIES; do
            git add "docs/$CITY/profiles"
            for f in ramps.json drive_profiles.json factsheet_walk.log; do [ -f "cities/$CITY/raw/$f" ] && git add "cities/$CITY/raw/$f"; done
          done
          git commit -m "Refresh fact sheets ($CITIES)$([ "$FULL" = true ] && echo ', walk and drive times re-fetched')" || { echo "no changes"; exit 0; }
          git pull --rebase
          git push
