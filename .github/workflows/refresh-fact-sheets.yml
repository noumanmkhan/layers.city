name: Refresh fact sheets
# Keeps the neighbourhood fact sheets (docs/<city>/profiles/data/, built by engine/profiles/build.py) in step
# with the map's data. Two kinds of run:
# - Quick: after a fetch job that changes the map files the fact sheets read (routes and stops, parking,
#   bike lanes and Bike Share), rebuild the sheets from what's already committed. No network, a minute or two.
# - Full: monthly, or by hand with "full", also re-fetches what the sheets alone use, from OpenStreetMap and
#   OSRM: the walking network and walk-time grid (fetch_walk.py, walk_grid.py), highway ramps and drive times
#   (fetch_drive.py). A step that can't reach its server keeps last month's file, and the rebuild still runs.
# Scheduled and workflow_run jobs only run from the copy of this file on main, so nothing runs until dev is
# released. While fact sheets are unlaunched, deploy.yml leaves them off the live site, so these commits
# publish nothing; at launch, add this workflow's name to deploy.yml's workflow_run list.
on:
  workflow_dispatch:
    inputs:
      full:
        description: 'Also re-fetch walking network, walk times, ramps and drive times (30–90 min)'
        type: boolean
        default: false
  schedule:
    - cron: '17 7 9 * *'
  workflow_run:
    workflows:
      - "Fetch streetcar and bus routes"
      - "Fetch Toronto parking"
      - "Fetch bike lanes"
    types: [completed]
permissions:
  contents: write
concurrency: refresh-fact-sheets
jobs:
  refresh:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      CITY: toronto
      FULL: ${{ github.event_name == 'schedule' || inputs.full == true }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Check fact sheets exist on this branch
        id: have
        run: |
          if [ -f engine/profiles/build.py ]; then echo "ok=1" >> "$GITHUB_OUTPUT"
          else echo "::notice::No engine/profiles/build.py on main yet: nothing to refresh."; fi
      - if: steps.have.outputs.ok
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - if: steps.have.outputs.ok
        run: pip install -q shapely
      - name: Walking network and walk times (full runs)
        if: steps.have.outputs.ok && env.FULL == 'true'
        continue-on-error: true
        run: |
          python3 -u engine/profiles/fetch_walk.py "$CITY"
          python3 -u engine/profiles/walk_grid.py "$CITY"
      - name: Highway ramps and drive times (full runs)
        if: steps.have.outputs.ok && env.FULL == 'true'
        continue-on-error: true
        run: python3 -u engine/profiles/fetch_drive.py "$CITY"
      - name: Rebuild the fact sheets
        if: steps.have.outputs.ok
        run: python3 -u engine/profiles/build.py "$CITY"
      - name: Commit
        if: steps.have.outputs.ok
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add "docs/$CITY/profiles/data"
          for f in ramps.json drive_profiles.json; do [ -f "cities/$CITY/raw/$f" ] && git add "cities/$CITY/raw/$f"; done
          git commit -m "Refresh $CITY fact sheets$([ "$FULL" = true ] && echo ' (walk and drive times re-fetched)')" || { echo "no changes"; exit 0; }
          git pull --rebase
          git push
