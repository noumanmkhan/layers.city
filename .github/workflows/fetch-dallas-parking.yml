name: Fetch Dallas parking
# Public EV chargers for Dallas: cities/dallas/fetch_parking.py (the Alternative Fuels Data Center's station API)
# -> raw/parking/ev_afdc.json, then parking.py -> docs/dallas/data/parking.geojson (the map's EV chargers layer and the
# fact sheets' charging rows). Monthly, when either script changes on main, or by hand. deploy.yml and
# refresh-fact-sheets.yml list this workflow, so its commits go live and the fact sheets follow.
on:
  workflow_dispatch:
  schedule:
    - cron: '43 6 4 * *'
  push:
    branches: [main]
    paths: ['cities/dallas/fetch_parking.py', 'cities/dallas/parking.py', '.github/workflows/fetch-dallas-parking.yml']
permissions:
  contents: write
concurrency: fetch-dallas-parking
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q shapely
      - env:
          NLR_API_KEY: ${{ secrets.NLR_API_KEY }}
        run: |
          mkdir -p cities/dallas/raw/parking
          # The log is committed either way, so a failed run can be read without the Actions page.
          ( set -o pipefail; { python3 -u cities/dallas/fetch_parking.py && python3 -u cities/dallas/parking.py; } 2>&1 | tee cities/dallas/raw/parking/fetch.log ) || echo "::warning::Dallas parking fetch or build failed; last month's files stay"

      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add cities/dallas/raw/parking
          [ -f docs/dallas/data/parking.geojson ] && git add docs/dallas/data/parking.geojson
          git commit -m "Fetch Dallas parking (EV chargers)" || echo "no changes"
          git pull --rebase
          git push
