name: Fetch Melbourne voting places
# The VEC's venues spreadsheet for the Victorian state election (cities/melbourne/fetch_voting.py) into
# cities/melbourne/raw/voting/. Venues can change up to election day (November 28), so this runs daily from
# November 13 to 28, on change, or by hand. A day with no change commits nothing.
on:
  workflow_dispatch:
  schedule:
    - cron: '41 19 13-28 11 *'   # daily, 19:41 UTC (6:41 am Melbourne)
  push:
    branches: [main]
    paths: ['cities/melbourne/fetch_voting.py', '.github/workflows/fetch-melbourne-voting.yml']
permissions:
  contents: write
concurrency: fetch-melbourne-voting
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          mkdir -p cities/melbourne/raw/voting
          python3 -u cities/melbourne/fetch_voting.py 2>&1 | tee cities/melbourne/raw/voting/fetch.log
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add cities/melbourne/raw/voting
          git commit -m "Update Melbourne voting places" || echo "no changes"
          git pull --rebase
          git push
