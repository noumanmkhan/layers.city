name: Fetch Chicago data
# Runs a Chicago fetch script and commits what it writes under cities/chicago/raw/
# back to the branch that ran it. The sandbox can't reach these hosts; Actions can.
# Pushing a changed fetch script to main runs it there, so no fetch branch is needed.
on:
  workflow_dispatch:
    inputs:
      script: {description: 'Script in cities/chicago/ to run', default: 'fetch.py'}
  push:
    branches: [main, fetch-chicago]
    # fetch_faith.py, fetch_vote_centers.py, fetch_happening.py and fetch_closures.py have their own jobs
    # (fetch-chicago-faith.yml, monthly; fetch-chicago-voting.yml, daily to election day; fetch-happening.yml and
    # fetch-closures.yml, daily), so they aren't run twice (a second fetch_happening.py run left docs/ files this
    # job doesn't commit, and its rebase failed).
    paths: ['cities/chicago/fetch*.py', '!cities/chicago/fetch_faith.py', '!cities/chicago/fetch_vote_centers.py', '!cities/chicago/fetch_happening.py', '!cities/chicago/fetch_closures.py', '!cities/chicago/fetch_parking.py', '!cities/chicago/fetch_fun.py', '.github/workflows/fetch-chicago.yml']
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # A manual run names its script; a push runs whichever fetch script its last commit changed (none: nothing to do).
      - run: |
          S="${{ inputs.script }}"
          [ -n "$S" ] || S=$(git diff --name-only HEAD~1 HEAD -- 'cities/chicago/fetch*.py' | grep -v -e fetch_fun -e fetch_happening -e fetch_parking -e fetch_closures -e fetch_faith -e fetch_vote_centers | head -1 | xargs -r basename)
          if [ -z "$S" ]; then echo "No fetch script changed in the last commit; nothing to fetch."; exit 0; fi
          echo "SCRIPT=$S" >> "$GITHUB_ENV"
          mkdir -p cities/chicago/raw
          python3 -u "cities/chicago/$S" 2>&1 | tee "cities/chicago/raw/${S%.py}.log"
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          [ -n "$SCRIPT" ] || exit 0
          git add cities/chicago/raw
          git commit -m "Fetch Chicago data ($SCRIPT)" || echo "no changes"
          git pull --rebase
          git push
