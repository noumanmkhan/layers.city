name: Scout bike lane closures
# One-off check: can Toronto's road restrictions feed and Chicago's CDOT permits show bike lanes closed or
# narrowed by construction (any construction, not just transit)? Matches active permits against each city's
# bike network. Writes scouting/bike-closures/out/ and commits it to main. Doesn't touch the site.
# Runs when scout.py changes on main, or by hand.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scouting/bike-closures/scout.py']
permissions:
  contents: write
concurrency: scout-bike-closures
jobs:
  scout:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install shapely
      - run: |
          mkdir -p scouting/bike-closures/out
          python3 -u scouting/bike-closures/scout.py 2>&1 | tee scouting/bike-closures/out/scout.log || true
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add scouting/bike-closures/out
          git commit -m "Bike lane closure scouting report" || echo "no changes"
          git pull --rebase
          git push
