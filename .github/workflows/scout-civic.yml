name: Scout civic data
# One-off check of open data for v1.2 civic rows: Toronto garbage schedule and collection areas,
# drop-in programs, beach water quality and GIS layers on collection, snow and beaches; Chicago
# Park District activities, beach lab data and street sweeping. Writes scouting/civic/out/ and
# commits it to main. Doesn't touch the site. Runs when scout.py changes on main, or by hand.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scouting/civic/scout.py']
permissions:
  contents: write
concurrency: scout-civic
jobs:
  scout:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          mkdir -p scouting/civic/out
          python3 -u scouting/civic/scout.py 2>&1 | tee scouting/civic/out/scout.log || true
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add scouting/civic/out
          git commit -m "Civic data scouting report" || echo "no changes"
          git pull --rebase
          git push
